<script>

// Pomocná funkcia pre správne slovenské skloňovanie počtu dní: 1 deň, 2-4 dni, 5+ dní
// (používa sa pri odpočte v tabuľke auditov aj v tabuľke voľna)
function formatDaysSk(n){
  if(n===1) return '1 deň';
  if(n>=2 && n<=4) return n+' dni';
  return n+' dní';
}

// ========== FIREBASE (zdieľané audity a voľno medzi všetkými prehliadačmi/zariadeniami) ==========
// Dáta sa naďalej ukladajú aj do localStorage (rýchle okamžité zobrazenie pri otvorení stránky),
// ale Firebase Realtime Database je teraz "zdroj pravdy" - keď niekto zapíše audit/voľno
// na jednom zariadení, po chvíli sa to zobrazí aj všade inde (iný prehliadač, iný počítač/mobil).
const firebaseConfig = {
  apiKey: "AIzaSyA2uXyx3B4W9FqmhbsKl8WYT4Uo4piX_iM",
  authDomain: "info-tabula.firebaseapp.com",
  databaseURL: "https://info-tabula-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "info-tabula",
  storageBucket: "info-tabula.firebasestorage.app",
  messagingSenderId: "580253308375",
  appId: "1:580253308375:web:8750fe38a5710a984b2792"
};
let firebaseDb = null;
try{
  firebase.initializeApp(firebaseConfig);
  firebaseDb = firebase.database();
  // ".info/connected" je špeciálna cesta vo Firebase, ktorá hovorí, či je tento konkrétny
  // prehliadač momentálne reálne pripojený k serveru (nielen či sa SDK podarilo načítať).
  firebaseDb.ref('.info/connected').on('value', snap=>{
    if(typeof setApiStatus==='function') setApiStatus('firebase', snap.val()===true);
  });
}catch(e){
  console.warn('Firebase sa nepodarilo inicializovať, dashboard bude fungovať len lokálne (localStorage).', e);
  if(typeof setApiStatus==='function') setApiStatus('firebase', false);
}

// Zapíše dáta do Firebase na danej ceste (napr. 'customAudits' alebo 'officeLeave').
// Zlyhanie (napr. výpadok siete) sa len zaloguje - localStorage zostáva ako záloha,
// takže dashboard nikdy nezamrzne ani pri nedostupnom Firebase.
function firebaseSave(path, data){
  if(!firebaseDb) return;
  firebaseDb.ref(path).set(data).catch(e=>console.warn('Firebase zápis zlyhal ('+path+'):', e));
}

// Prihlási sa na zmeny dát na danej ceste. Callback sa zavolá hneď po prvom načítaní
// a potom znova vždy, keď sa dáta zmenia (na tomto alebo inom zariadení/prehliadači).
function firebaseListen(path, callback){
  if(!firebaseDb) return;
  firebaseDb.ref(path).on('value', snapshot=>{
    const val = snapshot.val();
    if(val !== null && val !== undefined) callback(val);
  }, e=>console.warn('Firebase počúvanie zlyhalo ('+path+'):', e));
}

// ========== SPOLOČNÉ CORS PROXY (verejné, bezplatné, bez API kľúča) ==========
// Viaceré externé zdroje na stránke (PHM ceny, kurzy, komodity, RSS správy) potrebujú
// CORS proxy, pretože cieľové servery nemajú CORS hlavičky pre priamy fetch z prehliadača.
// Tento zoznam je centrálny, aby sa pri pridaní/zmene proxy nemuselo upravovať na viacerých miestach.
const CORS_PROXIES = [
  'https://api.allorigins.win/raw?url=',
  'https://corsproxy.io/?url=',
  'https://api.codetabs.com/v1/proxy/?quest=',
  'https://thingproxy.freeboard.io/fetch/'
];

// Skúsi stiahnuť text z danej URL postupne cez všetky proxy v CORS_PROXIES, kým jeden nezafunguje.
// Vracia text odpovede, alebo null ak zlyhali všetky.
async function fetchTextViaCorsProxy(targetUrl, timeoutMs){
  for(const proxy of CORS_PROXIES){
    try{
      const proxyUrl = proxy.includes('thingproxy') ? (proxy+targetUrl) : (proxy+encodeURIComponent(targetUrl));
      const r=await fetch(proxyUrl,{signal:AbortSignal.timeout(timeoutMs||7000)});
      if(r.ok) return await r.text();
    }catch(e){ /* skús ďalšie proxy */ }
  }
  return null;
}

function getNameday(d){
  let key = d.getDate()+"."+(d.getMonth()+1);
  let entry = MENINY[key];
  return entry ? entry : "–";
}

// FORMAT
function format(sec){
  sec=Math.floor(sec);
  let h=Math.floor(sec/3600);
  let m=Math.floor((sec%3600)/60);
  return `${h}h ${m}m`;
}

// IKONY
function icon(code){
  // WMO Weather interpretation codes
  // 0 = Clear, 1-2 = Mainly clear, 3 = Overcast, 45-48 = Fog
  // 51-67 = Drizzle/Rain, 71-77 = Snow, 80-82 = Rain showers
  // 85-86 = Snow showers, 95-99 = Thunderstorm
  
  if (code === 0 || code === 1 || code === 2) return "☀️";      // Clear/Mainly clear
  if (code === 3) return "⛅";                                    // Overcast
  if (code === 45 || code === 48) return "🌫️";                  // Fog/Depositing rime fog
  if (code === 51 || code === 53 || code === 55) return "🌦️";   // Light/Moderate/Dense drizzle
  if (code === 61 || code === 63 || code === 65) return "🌧️";   // Slight/Moderate/Heavy rain
  if (code === 71 || code === 73 || code === 75) return "❄️";    // Slight/Moderate/Heavy snow
  if (code === 77) return "🌨️";                                  // Snow grains
  if (code === 80 || code === 81 || code === 82) return "⛈️";   // Slight/Moderate/Violent rain showers
  if (code === 85 || code === 86) return "🌨️";                  // Slight/Heavy snow showers
  if (code === 95 || code === 96 || code === 99) return "⚡";    // Thunderstorm (slight/moderate/violent)
  
  return "☁️";  // Default fallback
}

function windDir(deg){
  const d=["S","SV","V","JV","J","JZ","Z","SZ"];
  return d[Math.round(deg/45)%8];
}

// ISO TÝŽDEŇ
function getISOWeek(d){
  const date=new Date(d);
  date.setDate(date.getDate()+3-(date.getDay()+6)%7);
  const week1=new Date(date.getFullYear(),0,4);
  return 1+Math.round(((date-week1)/86400000)/7);
}

function updateTime(){

// MENINY – aktualizuje každý deň automaticky
let lastNamedayDate = -1;

function updateNameday(){
  const n = new Date();
  const today = n.getDate();
  if(today === lastNamedayDate) return;
  lastNamedayDate = today;

  const tomorrow = new Date(n);
  tomorrow.setDate(tomorrow.getDate()+1);

  const todayName   = getNameday(n);
  const tomorrowName = getNameday(tomorrow);

  nameday.innerHTML = "Dnes má meniny: <span style=\"color:#00d4ff;font-weight:bold;\">" + todayName + "</span><hr style=\"border:none;border-top:1px solid rgba(255,255,255,0.2);margin:6px 0;\">Zajtra má meniny: " + tomorrowName;
  nameday.style.cursor='pointer';
  nameday.onclick=function(){ window.open('https://kto-ma-meniny.sk/','_blank'); };
  nameday.title='Zdroj: kto-ma-meniny.sk';

  // Ak sa pri dlhších/dvojitých menách (napr. "Peter a Pavol") text nezmestí na jeden
  // riadok v rámci skutočnej šírky boxu, zmenši font (rovnako ako pri tabuľke auditov),
  // nech ostane vždy presne na 2 riadkoch (Dnes/Zajtra) bez zalomenia textu na tretí riadok.
  // Najprv treba zaistiť, že box má nastavenú svoju skutočnú (nie len CSS min-width) šírku.
  if(typeof positionLeftColumn==='function') positionLeftColumn();
  nameday.style.fontSize = '28px';
  const minFontPx = 14; // bezpečný spodný limit, aby text ostal čitateľný
  let safety = 0;
  while(nameday.scrollWidth > nameday.clientWidth + 1 && safety < 30){
    const curSize = parseFloat(getComputedStyle(nameday).fontSize);
    if(curSize <= minFontPx) break;
    nameday.style.fontSize = (curSize - 1) + 'px';
    safety++;
  }
  if(typeof positionBottomBoxes==='function') positionBottomBoxes();
}

// Sleduje úspech/neúspech každého externého API zdroja na stránke.
// Zelená = všetko OK, červená = aspoň jedno zlyhalo, sivá = ešte sa nezistilo (na začiatku).
const apiStatus = {
  sun: null,        // východ/západ slnka
  weather: null,    // počasie Vráble
  worldWeather: null, // počasie pre svetové mestá
  fuel: null,       // PHM ceny

};

function setApiStatus(key, ok){
  apiStatus[key]=ok;
  updateApiStatusIndicator();
}

function updateApiStatusIndicator(){
  const el=document.getElementById('apiStatusIndicator');
  if(!el) return;
  const values=Object.values(apiStatus);
  const allKnown=values.every(v=>v!==null);
  const allOk=values.every(v=>v===true);
  const anyFail=values.some(v=>v===false);

  let color, label;
  if(anyFail){
    color='#ff4d4d';
    label='Chyba načítania API';
  } else if(allKnown && allOk){
    color='#4caf50';
    label='Všetky API načítané OK';
  } else {
    color='#888';
    label='Načítavam API...';
  }
  el.style.background=color;
  el.style.boxShadow='0 0 8px '+color;

  // Detailný rozpis jednotlivých zdrojov - viditeľný panel po kliknutí (nie len hover tooltip,
  // ktorý na dotykových/TV obrazovkách bez myši nie je dostupný)
  const names={sun:'Slnko/mesiac', weather:'Počasie Vráble', worldWeather:'Svetové počasie', fuel:'PHM ceny', currency:'Kurzy mien', commodities:'Komodity', firebase:'Zdieľaná databáza'};
  const lines=Object.keys(apiStatus).map(k=>{
    const v=apiStatus[k];
    const mark = v===true ? '✓' : (v===false ? '✗' : '…');
    const markColor = v===true ? '#4caf50' : (v===false ? '#ff4d4d' : '#888');
    return `<div style="margin:2px 0;"><span style="color:${markColor};font-weight:bold;">${mark}</span> ${names[k]}</div>`;
  });
  const panel=document.getElementById('apiStatusPanel');
  if(panel){
    panel.innerHTML=`<div style="font-weight:bold;margin-bottom:6px;color:${color};">${label}</div>`+lines.join('');
  }
  el.title=label+' (klikni pre detail)';
}

function toggleApiStatusPanel(){
  const panel=document.getElementById('apiStatusPanel');
  if(!panel) return;
  panel.style.display = (panel.style.display==='none' || !panel.style.display) ? 'block' : 'none';
}

// SLNKO - VÝCHOD/ZÁPAD + MESIAC
async function loadSun(){
  try {
    const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=48.24&longitude=18.32&daily=sunrise,sunset&timezone=Europe%2FBratislava&forecast_days=1");
    const data = await res.json();
    
    const sunrise = new Date(data.daily.sunrise[0]).toLocaleTimeString('sk-SK', {hour: '2-digit', minute: '2-digit'});
    const sunset = new Date(data.daily.sunset[0]).toLocaleTimeString('sk-SK', {hour: '2-digit', minute: '2-digit'});
    
    // Výpočet fázy mesiaca - DO SPLNÉHO MESIACA (30. júna 2026)
    const now = new Date();
    const fullMoonDate = new Date(2026, 5, 30, 1, 57); // 30. jún 2026
    const lunarCycle = 29.53;
    
    // New moon pre tento cyklus (14.765 dní pred full moon)
    let newMoonDate = new Date(fullMoonDate.getTime() - (14.765 * 24 * 60 * 60 * 1000));
    
    // Ak je new moon v budúcnosti, vezmem predchádzajúci cyklus
    while (newMoonDate > now) {
      newMoonDate = new Date(newMoonDate.getTime() - (lunarCycle * 24 * 60 * 60 * 1000));
    }
    
    // Dní od new moonu
    const daysSinceNewMoon = (now - newMoonDate) / (1000 * 60 * 60 * 24);
    
    // Správny piktogram a názov fázy podľa lunárneho veku
    let moonEmoji = '🌑';
    let moonName = 'Nový mesiac';
    
    if (daysSinceNewMoon < 1.84) { moonEmoji = '🌑'; moonName = 'Nov'; }
    else if (daysSinceNewMoon < 7.38) { moonEmoji = '🌒'; moonName = 'Dorastajúci mesiac'; }
    else if (daysSinceNewMoon < 9.23) { moonEmoji = '🌓'; moonName = 'Prvá štvrť'; }
    else if (daysSinceNewMoon < 14.77) { moonEmoji = '🌔'; moonName = 'Dorastajúci mesiac'; }
    else if (daysSinceNewMoon < 16.61) { moonEmoji = '🌕'; moonName = 'Spln'; }
    else if (daysSinceNewMoon < 22.15) { moonEmoji = '🌖'; moonName = 'Ubúdajúci mesiac'; }
    else if (daysSinceNewMoon < 23.99) { moonEmoji = '🌗'; moonName = 'Posledná štvrť'; }
    else { moonEmoji = '🌘'; moonName = 'Ubúdajúci mesiac'; }
    
    // Skontroluj či je dnes new moon alebo full moon
    const today = new Date();
    const isNewMoonDay = today.getDate() === newMoonDate.getDate() && today.getMonth() === newMoonDate.getMonth();
    if (isNewMoonDay) moonName = 'Now';
    
    // Nový formát - tri riadky s názvami
    document.getElementById('sun').innerHTML = `Východ slnka: ☀️ ${sunrise}<hr style="border:none;border-top:1px solid rgba(255,255,255,0.2);margin:6px 0;">Západ slnka: 🌙 ${sunset}<hr style="border:none;border-top:1px solid rgba(255,255,255,0.2);margin:6px 0;">Fáza mesiaca: ${moonEmoji} ${moonName}`;
    document.getElementById('sun').style.cursor='pointer';
    document.getElementById('sun').onclick=function(){ window.open('https://www.timeanddate.com/astronomy/slovakia/nitra','_blank'); };
    document.getElementById('sun').title='Zdroj: timeanddate.com';
    setApiStatus('sun', true);
  } catch (err) {
    document.getElementById('sun').innerHTML = "☀️ Slnko: Chyba";
    setApiStatus('sun', false);
  }
}

        if([95,96,99].includes(code) || (prec > 0.5 && wind > 25)){
          alert=`⚡ Búrka ~${Math.round(diff)} min | ${prec.toFixed(1)} mm`;
          break;
        } else if([80,81,82].includes(code) || (prec > 2 && wind > 15)){
          alert=`⛈️ Lejaky ~${Math.round(diff)} min | ${prec.toFixed(1)} mm`;
          break;
        } else if([61,63,65].includes(code) || prec > 1){
          alert=`🌧️ Dážď ~${Math.round(diff)} min | ${prec.toFixed(1)} mm`;
          break;
        }
      }
    }
  }

  // Iba do tempNow elementu pod Vráble - v jednom riadku
  if(alert.trim()){
    document.getElementById('tempNow').innerHTML=`${currentIcon} ${temp}° | <span style='color:white;'>${alert}</span>`;
  } else {
    document.getElementById('tempNow').innerHTML=`${currentIcon} ${temp}°`;

  // Dynamické názvy dní podľa dátumu
  const d=data.daily;

    dn=dn.charAt(0).toUpperCase()+dn.slice(1);

  }

  const daysOfWeek = ['ne','po','ut','st','št','pi','so'];

  const day2 = new Date(today);

  const day3 = new Date(today);

  // Zobraz: Dnes [0], Zajtra [1], +2dni [2], +3dni [3]
  const day1Name = daysOfWeek[tomorrow.getDay()];
  const day2Name = daysOfWeek[day2.getDay()];
  const day3Name = daysOfWeek[day3.getDay()];
  
  const rows=[
    {name:'Dnes', idx:0},
    {name:day1Name, idx:1},
    {name:day2Name, idx:2},
    {name:day3Name, idx:3}
  ];
  let fHtml=`<table style="width:100%;border-collapse:collapse;font-size:24px;">`;
  rows.forEach((r,i)=>{
    const borderStyle = i<rows.length-1 ? "border-bottom:1px solid rgba(255,255,255,0.15);" : "";
    const nameStyle = r.name==='Dnes' ? "font-weight:bold;color:#fff;" : "color:#aaa;";
    const precip = d.precipitation_sum[r.idx];
    const precipHtml = precip>0 ? ` 💧 ${precip.toFixed(1)} mm` : '';
    fHtml+=`<tr style="${borderStyle}">`+
      `<td style="padding:10px 6px;text-align:left;width:60px;${nameStyle}">${r.name}</td>`+
      `<td style="padding:10px 12px;text-align:left;font-size:32px;width:50px;">${icon(d.weather_code[r.idx])}</td>`+
      `<td style="padding:10px 12px;text-align:left;white-space:nowrap;">${Math.round(d.temperature_2m_max[r.idx])}°/${Math.round(d.temperature_2m_min[r.idx])}°</td>`+
      `<td style="padding:10px 12px;text-align:left;color:#aaa;white-space:nowrap;width:100%;">💨 ${Math.round(d.wind_speed_10m_max[r.idx])} ${windDir(d.wind_direction_10m_dominant[r.idx])}${precipHtml}</td>`+
    `</tr>`;
  });
  fHtml+=`</table>`;
  document.getElementById('forecast3days').innerHTML=fHtml;
  document.getElementById('weather').style.display='none';
  
  console.log('Weather codes:', 'Dnes:', d.weather_code[0], 'Zajtra:', d.weather_code[1], 'Za 2 dni:', d.weather_code[2], 'Za 3 dni:', d.weather_code[3]);
  setApiStatus('weather', true);
 } catch(err){

// GONG - VYRAZNÝ ALERT
// ZVUK NOTIFIKÁCIA - GONG
function playAlert(){
  try {
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    
    // Prvý tón - hlboký gong
    const osc1=ctx.createOscillator();
    const gain1=ctx.createGain();
    osc1.connect(gain1);
    gain1.connect(ctx.destination);
    osc1.frequency.value=180;
    gain1.gain.setValueAtTime(0.6,ctx.currentTime);
    gain1.gain.exponentialRampToValueAtTime(0.05,ctx.currentTime+3.5);
    osc1.start(ctx.currentTime);
    osc1.stop(ctx.currentTime+3.5);
    
    // Druhý tón - vyšší "zvonenie" (harmonický)
    const osc2=ctx.createOscillator();
    const gain2=ctx.createGain();
    osc2.connect(gain2);
    gain2.connect(ctx.destination);
    osc2.frequency.value=360;
    gain2.gain.setValueAtTime(0.4,ctx.currentTime);
    gain2.gain.exponentialRampToValueAtTime(0.02,ctx.currentTime+3.5);
    osc2.start(ctx.currentTime);
    osc2.stop(ctx.currentTime+3.5);
  } catch(e){}
}

// DOVOLENKA + VIANOCE + ZMENA + OBED - BANERY V STREDE
function updateVacation(){
  const n=new Date();
  const s=new Date();s.setHours(7,0,0,0); // Začiatok zmeny dnes
  const shiftEnd=new Date();shiftEnd.setHours(15,0,0,0); // Koniec zmeny
  const lunchTime=new Date();lunchTime.setHours(10,30,0,0); // Obed
  const vacStart=new Date(2026,7,3); // 3.8.2026
  const christmas=new Date(2026,11,25); // 25.12.2026
  
  // Ďalší začiatok zmeny - ak je po 7:00, tak zajtra (preskočí víkend)
  const nextShift=new Date();nextShift.setHours(7,0,0,0);
  while(nextShift<=n || nextShift.getDay()===0 || nextShift.getDay()===6){
    nextShift.setDate(nextShift.getDate()+1);
  }
  
  const diffVac=Math.ceil((vacStart-n)/(1000*60*60*24));
  const diffChrist=Math.ceil((christmas-n)/(1000*60*60*24));
  const diffShift=Math.ceil((shiftEnd-n)/1000); // Do konca zmeny
  const diffToShift=(nextShift-n)/1000; // Do ďalšieho začiatku zmeny
  const diffLunch=(lunchTime-n)/1000; // Do obeda
  
  const today=n.getDay();
  
  // Dovolenka / Vianoce - vždy zobraz v boxe hore
  if(n>=vacStart && n<=new Date(2026,7,9)){
    vacationTime.innerHTML=`Dovolenka<br><span style="color:#00d4ff;font-weight:bold;">DNES</span>`;
    vacationTime.style.display="block";
  } else if(diffVac>0){
    vacationTime.innerHTML=`Dovolenka<br><span style="color:#aaa;">o ${diffVac} dní</span>`;
    vacationTime.style.display="block";
  } else if(diffChrist>0){
    vacationTime.innerHTML=`Do Vianoc:<br>${diffChrist} dní`;
    vacationTime.style.display="block";
  } else {
    vacationTime.style.display="none";
  }
  
  // Odpočet zmeny a obeda - v strede hore
  const lunchStart=new Date();lunchStart.setHours(10,30,0,0); // Obed 1
  const lunchEnd=new Date();lunchEnd.setHours(11,30,0,0); // Koniec obeda
  const beforeLunch=new Date();beforeLunch.setHours(10,15,0,0); // Zvuk pred obedом
  const soundTime=new Date();soundTime.setHours(11,15,0,0); // Zvuk počas obeda
  const lateAfternoon=new Date();lateAfternoon.setHours(14,45,0,0); // Zvuk o 14:45
  
  // Najbližší obed (10:30-11:30) - funguje 24/7, aj cez víkend/sviatky mimo zmeny
  function getLunchBannerText(){
    if(n<lunchStart && today>=1 && today<=5){
      // Pred obedom dnes (pracovný deň)
      const diffToLunch=(lunchStart-n)/1000;
      return `🍽️ Obed o: ${format(diffToLunch)}`;
    } else if(n>=lunchStart && n<lunchEnd && today>=1 && today<=5){
      // Počas obeda dnes
      const diffToLunchEnd=(lunchEnd-n)/1000;
      return `🍽️ Obed o: ${format(diffToLunchEnd)}`;
    } else {
      // Po obede, alebo víkend - odpočet do ďalšieho pracovného obeda
      const nextLunch=new Date();nextLunch.setHours(10,30,0,0);
      if(n>=lunchStart || today===0 || today===6){
        nextLunch.setDate(nextLunch.getDate()+1);
      }
      while(nextLunch.getDay()===0 || nextLunch.getDay()===6){
        nextLunch.setDate(nextLunch.getDate()+1);
      }
      const diffNextLunch=(nextLunch-n)/1000;
      return `🍽️ Obed o: ${format(diffNextLunch)}`;
    }
  }
  
  if(n>=s&&n<shiftEnd && today>=1 && today<=5){
    // Počas zmeny (7:00-15:00, pondelok-piatok)
    let bannerText = `⏱️ Do konca zmeny: ${format(diffShift)}`;
    bannerText += `<br>${getLunchBannerText()}`;
    
    // Gong v 11:15 (10:15 a 14:45 riešia updateLunch/updateShift)
    if(n>=soundTime && n<new Date(soundTime.getTime()+5*60000) && !lunchEndAlertPlayed){
      playAlert();
      lunchEndAlertPlayed=true;
    } else if(n<soundTime || n>=new Date(soundTime.getTime()+5*60000)){
      lunchEndAlertPlayed=false;
    }
    
    // Zobrazovať banner vždy počas zmeny (s obedom alebo bez)
    document.getElementById('shiftBox').innerHTML = bannerText;
    document.getElementById('shiftBox').style.display="block";
  }
  else {
    // Mimo zmeny - zobrazuj odpočet do ďalšieho začiatku zmeny + odpočet do obeda (24/7)
    if(today>=1 && today<=5){
      // V pracovný deň mimo zmeny
      let bannerText = `⏱️ Do začiatku zmeny: ${format(diffToShift)}`;
      bannerText += `<br>${getLunchBannerText()}`;
      document.getElementById('shiftBox').innerHTML = bannerText;
      document.getElementById('shiftBox').style.display="block";
    } else {
      // Cez víkend - zobraz aspoň odpočet do obeda (ďalší pracovný deň)
      let bannerText = `⏱️ Do začiatku zmeny: ${format(diffToShift)}`;
      bannerText += `<br>${getLunchBannerText()}`;
      document.getElementById('shiftBox').innerHTML = bannerText;
      document.getElementById('shiftBox').style.display="block";
    }
  }
  
  // Výpočet dní do auditov + automatické skrytie udalostí po ich skončení
  const auditCells = document.querySelectorAll('.daysToAudit');
  auditCells.forEach(cell => {
    const startDate = new Date(cell.getAttribute('data-date'));
    const endDate = new Date(cell.getAttribute('data-end') || cell.getAttribute('data-date'));
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    startDate.setHours(0, 0, 0, 0);
    endDate.setHours(0, 0, 0, 0);

    const row = cell.closest('tr');
    const daysAfterEnd = Math.ceil((endDate - today) / (1000 * 60 * 60 * 24));

    // Udalosť už skončila -> riadok automaticky skry
    if (daysAfterEnd < 0) {
      if (row) row.style.display = 'none';
      return;
    }
    if (row) row.style.display = '';

    const daysLeft = Math.ceil((startDate - today) / (1000 * 60 * 60 * 24));

    if (daysLeft <= 0) {
      cell.textContent = 'DNES';
      cell.style.color = '#00d4ff';
    } else if (daysLeft <= 3) {
      cell.textContent = 'o ' + formatDaysSk(daysLeft);
      cell.style.color = '#ff6b6b';
    } else {
      cell.textContent = 'o ' + formatDaysSk(daysLeft);
      cell.style.color = '#aaa';
    }
    // "o X dní" je dlhšie ako pôvodné holé číslo - nech sa font zmenší a nezalomí na 2 riadky
    cell.style.whiteSpace = 'nowrap';
    cell.style.fontSize = '';
    if(typeof shrinkToFit==='function') shrinkToFit(cell, 11);
  });
}

    {date: new Date(2026,11,24), name:"Štedrý deň"},
    {date: new Date(2026,11,25), name:"Prvý sviatok vianočný"},
    {date: new Date(2026,11,26), name:"Druhý sviatok vianočný"}
  ];
  
  // Nájdi najbližší sviatok (bez ohľadu na deň v týždni)
  let nextHoliday=null;
  let minDiff=Infinity;
  
  holidays.forEach(h=>{
    const diff=(h.date-today)/(1000*60*60*24);
    if(diff>=0 && diff<minDiff){
      minDiff=diff;
      nextHoliday=h;
    }
  });
  
  if(nextHoliday){
    const daysLeft=Math.ceil(minDiff);
    const hDisplay=document.getElementById('holidayDisplay');
    const hb=document.getElementById('holidayBox');
    // Zaisti správnu šírku boxu PRED meraním textu (rovnaká min. šírka ako box menín, 380px)
    const sunBox=document.getElementById('sun');
    if(hb && sunBox){
      hb.style.left=sunBox.offsetLeft+'px';

      hb.style.width=Math.max(sunBox.offsetWidth,380)+'px';

      hb.onclick=function(){ window.open('https://kto-ma-meniny.sk/','_blank'); };

    if(daysLeft===0){
      hDisplay.innerHTML=`🎉 ${nextHoliday.name} <span style="color:#00d4ff;font-weight:bold;">DNES</span>`;
    } else if(daysLeft===1){
      hDisplay.innerHTML=`🎉 ${nextHoliday.name} <span style="color:#aaa;">zajtra</span>`;
    } else {
      hDisplay.innerHTML=`🎉 ${nextHoliday.name} <span style="color:#aaa;">o ${daysLeft} dní</span>`;
    }
    hDisplay.style.display="block";
    // Rovnaké písmo ako "Východ slnka" (28px). Text sa môže zalomiť na 2 riadky bez problémov,
    // ale ak by potreboval 3. riadok, font sa postupne zmenší, aby sa zmestil na 2 riadky.
    hDisplay.style.fontSize='28px';
    let safety=0;
    let curSize=parseFloat(getComputedStyle(hDisplay).fontSize);
    let lineHeight=curSize*1.3;
    while(hDisplay.scrollHeight > lineHeight*2 + 4 && safety<20){
      curSize -= 1;
      hDisplay.style.fontSize=curSize+'px';
      lineHeight=curSize*1.3;
      safety++;
    }
  } else {
    document.getElementById('holidayDisplay').style.display="none";
  }
  if(typeof positionLeftColumn==='function') positionLeftColumn();
  if(typeof positionBottomBoxes==='function') positionBottomBoxes();
}

// MINI KALENDÁR CELÉHO MESIACA
function buildMiniCalendar(){
  const cal=document.getElementById('miniCalendar');
  if(!cal) return;
  cal.style.cursor='pointer';
  cal.onclick=function(){ window.open('https://kalendar.sme.sk/','_blank'); };
  cal.title='Zdroj: kalendar.sme.sk';
  const now=new Date();
  const year=now.getFullYear();
  const month=now.getMonth();
  const todayDate=now.getDate();
  const monthNames=["Január","Február","Marec","Apríl","Máj","Jún","Júl","August","September","Október","November","December"];
  const firstDay=new Date(year,month,1);
  // Po=0 ... Ne=6 (JS má Ne=0)
  const startOffset=(firstDay.getDay()+6)%7;
  const daysInMonth=new Date(year,month+1,0).getDate();

  let html=`<div style="font-weight:bold;font-size:16px;margin-bottom:6px;text-align:center;">📅 ${monthNames[month]} ${year}</div>`;
  html+=`<table style="width:100%;border-collapse:collapse;font-size:13px;text-align:center;">`;
  html+=`<tr>`;
  ["Po","Ut","St","Št","Pi","So","Ne"].forEach((d,i)=>{
    const wc=(i>=5)?'#ff8a8a':'#aaa';
    html+=`<th style="padding:2px;color:${wc};font-weight:normal;">${d}</th>`;
  });
  html+=`</tr>`;

  let day=1;
  for(let row=0; row<6; row++){
    html+=`<tr>`;
    for(let col=0; col<7; col++){
      const cellIndex=row*7+col;
      if(cellIndex<startOffset || day>daysInMonth){
        html+=`<td style="padding:2px;"></td>`;
      } else {
        const isToday=(day===todayDate);
        const isWeekend=(col>=5);
        let content=String(day);
        let style="padding:2px;";
        if(isToday){
          content=`<span style="background:#00d4ff;color:#001a33;border-radius:50%;padding:2px 5px;font-weight:bold;">${day}</span>`;
        } else if(isWeekend){
          style+="color:#ff8a8a;";
        }
        html+=`<td style="${style}">${content}</td>`;
        day++;
      }
    }
    html+=`</tr>`;
    if(day>daysInMonth) break;
  }
  html+=`</table>`;
  cal.innerHTML=html;

// Stiahne ceny jednej stanice z hackmath.net (cez CORS proxy)
// Skúša viacero proxy serverov postupne - verejné CORS proxy bývajú nestabilné (výpadky, limity),
// takže viac fallbackov výrazne zvyšuje šancu na úspešné načítanie.
function parseStanicaText(t){
  const b=t.match(/natural\s*95\s*\(benzín\)[^0-9]{0,40}?([0-9][.,][0-9]{2,3})/i);
  const n=t.match(/diesel\s*\(nafta\)[^0-9]{0,40}?([0-9][.,][0-9]{2,3})/i);
  if(!b && !n) return null;
  return { benzin: b ? b[1].replace('.',',') : null, nafta: n ? n[1].replace('.',',') : null };
}

async function fetchStanica(pumpa){
  const url='https://www.hackmath.net/sk/cerpacia-stanica?pumpa='+pumpa;

  // Corsfix má unikátny formát (URL sa pripája priamo, bez encode) - skús ako prvé
  try{
    const r=await fetch('https://proxy.corsfix.com/?'+url,{signal:AbortSignal.timeout(7000)});
    if(r.ok){
      const parsed=parseStanicaText(await r.text());
      if(parsed) return parsed;
    }
  }catch(e){ /* skús ďalšie proxy */ }

  // Zvyšné proxy (spoločná funkcia, URL-encoded parameter)
  const text = await fetchTextViaCorsProxy(url);
  return text ? parseStanicaText(text) : null;
}

}

let leaveData = loadLeave();
function loadLeave(){

  return [];
}
function saveLeave(){
  try{ localStorage.setItem('officeLeave', JSON.stringify(leaveData)); }catch(e){}

}
// Keď sa voľno zmení na inom zariadení/prehliadači, premietne sa to aj sem automaticky.
firebaseListen('officeLeave', data=>{
  leaveData = Array.isArray(data) ? data : [];
  try{ localStorage.setItem('officeLeave', JSON.stringify(leaveData)); }catch(e){}

});
function parseLeaveDate(str){
  const p=String(str).split('-').map(Number);
  return new Date(p[0], (p[1]||1)-1, p[2]||1);
}

let editingLeaveId = null;

window.showLeaveForm=function(){
  const addRow=document.getElementById('leaveAddRow');
  const formRow=document.getElementById('leaveFormRow');
  if(addRow) addRow.style.display='none';
  if(formRow) formRow.style.display='flex';
  if(typeof positionLeaveBox==='function') positionLeaveBox();
  if(typeof positionBottomBoxes==='function') positionBottomBoxes();
};

window.hideLeaveForm=function(){
  const addRow=document.getElementById('leaveAddRow');
  const formRow=document.getElementById('leaveFormRow');
  if(formRow) formRow.style.display='none';
  if(addRow) addRow.style.display='';
  editingLeaveId=null;
  const startEl=document.getElementById('leaveStart');
  const endEl=document.getElementById('leaveEnd');
  document.getElementById('leaveName').value='';
  if(startEl){ startEl.value=''; delete startEl.dataset.year; }
  if(endEl){ endEl.value=''; delete endEl.dataset.year; }
  const btn=document.querySelector('#leaveBox button[onclick="addLeave()"]');
  if(btn) btn.textContent='Pridať';
  const delBtn=document.getElementById('leaveDeleteBtn');
  if(delBtn) delBtn.style.display='none';
  if(typeof positionLeaveBox==='function') positionLeaveBox();
  if(typeof positionBottomBoxes==='function') positionBottomBoxes();
};

window.addLeave=function(){
  const name=document.getElementById('leaveName').value.trim();
  const startEl=document.getElementById('leaveStart');
  const endEl=document.getElementById('leaveEnd');
  const start=parseDDMM(startEl.value, startEl.dataset.year);
  let end=parseDDMM(endEl.value, endEl.dataset.year) || start;
  if(!name || !start){ alert('Zadaj meno aj dátum (dd.mm.).'); return; }
  if(end < start){ alert('Koniec nemôže byť pred začiatkom.'); return; }
  if(editingLeaveId){
    const idx=leaveData.findIndex(x=>x.id===editingLeaveId);
    if(idx!==-1){ leaveData[idx]={...leaveData[idx], name, start, end}; }
  } else {
    leaveData.push({ id: Date.now().toString(), name, start, end });
  }
  saveLeave();
  hideLeaveForm();
  renderLeave();
};

window.editLeave=function(id){
  const x=leaveData.find(it=>it.id===id);
  if(!x) return;
  showLeaveForm();
  editingLeaveId=id;
  const toDDMM=(iso)=>{ if(!iso) return ''; const p=iso.split('-'); return `${parseInt(p[2],10)}.${parseInt(p[1],10)}.`; };
  const toYear=(iso)=>{ if(!iso) return ''; return iso.split('-')[0]; };
  const startEl=document.getElementById('leaveStart');
  const endEl=document.getElementById('leaveEnd');
  document.getElementById('leaveName').value=x.name;
  startEl.value=toDDMM(x.start); startEl.dataset.year=toYear(x.start);
  endEl.value=toDDMM(x.end); endEl.dataset.year=toYear(x.end);
  const btn=document.querySelector('#leaveBox button[onclick="addLeave()"]');
  if(btn) btn.textContent='Uložiť';
  const delBtn=document.getElementById('leaveDeleteBtn');
  if(delBtn) delBtn.style.display='inline-block';
  document.getElementById('leaveName').focus();
};

window.deleteEditingLeave=function(){
  if(!editingLeaveId) return;
  leaveData=leaveData.filter(x=>x.id!==editingLeaveId);
  saveLeave();
  hideLeaveForm();
  renderLeave();
};

function renderLeave(){
  const list=document.getElementById('leaveList');
  if(!list) return;
  const today=new Date(); today.setHours(0,0,0,0);

  // Odstráň skutočne skončené (koniec voľna už prešiel)
  const before=leaveData.length;
  leaveData = leaveData.filter(x=>{
    const e=parseLeaveDate(x.end||x.start); e.setHours(0,0,0,0);
    return Math.ceil((e-today)/86400000) >= 0;
  });
  if(leaveData.length!==before) saveLeave();

  const items = leaveData.map(x=>{
    const s=parseLeaveDate(x.start); s.setHours(0,0,0,0);
    const e=parseLeaveDate(x.end||x.start); e.setHours(0,0,0,0);
    const daysToStart=Math.ceil((s-today)/86400000);
    // Dátum: D.M. alebo rozsah D-D.M. / D.M.-D.M. - rovnaký rozsah = rovnaký kľúč zoskupenia
    let datum;
    if(s.getTime()===e.getTime()){
      datum=`${s.getDate()}.${s.getMonth()+1}.`;
    } else if(s.getMonth()===e.getMonth()){
      datum=`${s.getDate()}-${e.getDate()}.${s.getMonth()+1}.`;
    } else {
      datum=`${s.getDate()}.${s.getMonth()+1}.-${e.getDate()}.${e.getMonth()+1}.`;
    }
    return {...x, s, e, daysToStart, datum};
  });

  // Zlúč všetky osoby s rovnakým dátumom/rozsahom do jedného riadku (zoskupenie podľa termínu,
  // nie podľa mena) - napr. keď majú dvaja-traja ľudia voľno v ten istý deň, sú spolu v 1 riadku.
  const groups={};
  items.forEach(it=>{
    const key=it.start+'|'+(it.end||it.start);
    if(!groups[key]) groups[key]={ datum:it.datum, s:it.s, daysToStart:it.daysToStart, people:[] };
    groups[key].people.push(it);
  });
  // Každému termínu zoraď jeho ľudí abecedne, zoraď termíny chronologicky
  const groupList=Object.values(groups).map(g=>{
    g.people.sort((a,b)=> a.name.localeCompare(b.name,'sk'));
    return g;
  }).sort((a,b)=> a.s - b.s);

  if(groupList.length===0){
    list.innerHTML=`<div style="text-align:center;color:#aaa;padding:8px;font-size:28px;">Žiadne plánované voľno</div>`;
  } else {
    let html=`<table style="width:100%;border-collapse:collapse;font-size:28px;table-layout:fixed;">`;
    html+=`<tr style="border-bottom:1px solid rgba(255,255,255,0.2);color:#fff;">`+
      `<th style="text-align:center;padding:5px 6px;width:30%;">Dátum</th>`+
      `<th style="text-align:center;padding:5px 6px;width:35%;">Meno</th>`+
      `<th style="text-align:center;padding:5px 6px;width:35%;"></th>`+
    `</tr>`;
    groupList.forEach(g=>{
      let dni, color;
      if(g.daysToStart<=0){ dni='DNES'; color='#00d4ff'; }
      else { dni='o '+formatDaysSk(g.daysToStart); color='#aaa'; }
      const namesHtml = g.people.map(p=>
        `<span onclick="event.stopPropagation();editLeave('${p.id}')" title="upraviť" style="cursor:pointer;">${p.name}</span>`
      ).join(', ');
      html+=`<tr style="border-bottom:1px solid rgba(255,255,255,0.1);">`+
        `<td onclick="event.stopPropagation();editLeave('${g.people[0].id}')" title="upraviť" style="padding:5px 6px;text-align:center;white-space:nowrap;overflow:hidden;cursor:pointer;">${g.datum}</td>`+
        `<td class="leaveNamesCell" style="padding:5px 6px;text-align:center;white-space:nowrap;overflow:hidden;">${namesHtml}</td>`+
        `<td onclick="event.stopPropagation();editLeave('${g.people[0].id}')" title="upraviť" style="padding:5px 6px;text-align:center;white-space:nowrap;overflow:hidden;cursor:pointer;color:${color};font-weight:bold;">${dni}</td>`+
      `</tr>`;
    });
    html+=`</table>`;
    list.innerHTML=html;
  }
  // Najprv zaisti aktuálnu šírku boxu (môže sa zmeniť podľa obsahu), AŽ POTOM meraj a zmenšuj font -
  // inak by sa font meral voči starej/nesprávnej šírke a text by mohol pretiecť mimo tabuľky.
  positionLeaveBox();
  if(typeof positionBottomBoxes==='function') positionBottomBoxes();
  if(groupList.length>0){
    // Stĺpec mien môže obsahovať viac mien naraz (keď má viac ľudí voľno v ten istý deň),
    // preto má nižšiu spodnú hranicu fontu než dátum/odpočet, ktoré sú vždy krátke.
    list.querySelectorAll('tr td:not(.leaveNamesCell)').forEach(td=>shrinkToFit(td, 14));
    list.querySelectorAll('tr td.leaveNamesCell').forEach(td=>shrinkToFit(td, 9));
  }
}

// Umiestni kalendár + PHM/kurzy na celú šírku pod tabuľkou auditov (flexibilne - posúva sa
// nadol podľa skutočnej výšky auditov/voľna, nie podľa pevnej vzdialenosti od pásu správ)
function positionBottomBoxes(){
  const a=document.getElementById('auditsTable');
  if(!a) return;
  let S=1.6452230625;
  const tr=getComputedStyle(a).transform;
  const m=tr && tr.match(/matrix\(([^,]+),/);
  if(m){ const v=parseFloat(m[1]); if(v) S=v; }
  const offsetX=-29.4;
  const centerX=a.offsetLeft + offsetX;
  const auditsWidth=a.offsetWidth * S;
  const areaLeft=centerX - auditsWidth/2;
  const auditsBottom=a.offsetTop + a.offsetHeight * S;

  // Zaisti, že leaveBox/world majú aktuálnu pozíciu/výšku bez ohľadu na to, odkiaľ bola
  // táto funkcia zavolaná (defenzívne, aby sa nespoliehalo na poradie volania zvonku).
  if(typeof positionLeaveBox==='function') positionLeaveBox();

  // Spodný bod pravej kolóny = tabuľka voľna (leaveBox). Nepoužívame "world" (svetový čas),
  // pretože ten sa viaže na výšku ľavého panela (meniny/sviatok) a nie je spoľahlivým
  // ukazovateľom toho, kde končí obsah súvisiaci s auditmi/voľnom.
  const lb=document.getElementById('leaveBox');
  const leaveBottom = lb ? (lb.offsetTop + lb.offsetHeight) : 0;
  const leaveLeft = lb ? lb.offsetLeft : (areaLeft+auditsWidth);

  const gap=15;
  // Vždy sa zarovnaj presne pod nižší z oboch bodov (audity / voľno) + medzera
  // (rovnaká medzera 15px ako medzi tabuľkou voľna a svetovým časom, pre konzistentný vzhľad)
  const areaTop = Math.max(auditsBottom, leaveBottom) + gap;

  // Šírka spodnej sekcie (kalendár + PHM/Kurzy/Komodity) je NEZÁVISLÁ od šírky auditov -
  // vyplní celý dostupný priestor od ľavého okraja auditov až po leaveBox/world vpravo,
  // takže zúženie/rozšírenie tabuľky auditov ju neovplyvní.
  const totalWidth = leaveLeft - gap - areaLeft;

  const mc=document.getElementById('miniCalendar');
  const fb=document.getElementById('fuelBox');

  // Kalendár (menší) a PHM/Kurzy/Komodity (väčší) vedľa seba v jednom riadku
  const calWidth=totalWidth*0.34;
  const fuelWidth=totalWidth - gap - calWidth;
  if(mc){
    mc.style.left=areaLeft+'px';
    mc.style.right='auto';
    mc.style.top=areaTop+'px';
    mc.style.width=calWidth+'px';
  }
  if(fb){
    fb.style.left=(areaLeft+calWidth+gap)+'px';
    fb.style.right='auto';
    fb.style.top=areaTop+'px';
    fb.style.width=fuelWidth+'px';
  }
  syncFuelCurrencyHeight();
  if(typeof positionLeftColumn==='function') positionLeftColumn();
}

// Parsuje "dd.mm." alebo "dd.mm" / "dd/mm" na "YYYY-MM-DD". Rok sa doplní automaticky:
// ak by dátum v aktuálnom roku už bol viac ako 30 dní v minulosti, použije sa budúci rok.
function parseDDMM(str, explicitYear){
  if(!str) return '';
  const m=String(str).trim().match(/^(\d{1,2})[.\/](\d{1,2})\.?$/);
  if(!m) return '';
  const day=parseInt(m[1],10), month=parseInt(m[2],10);
  if(day<1||day>31||month<1||month>12) return '';
  let year;
  if(explicitYear){
    year=parseInt(explicitYear,10);
  } else {
    const now=new Date(); now.setHours(0,0,0,0);
    year=now.getFullYear();
    let candidate=new Date(year, month-1, day);
    const diffDays=(now-candidate)/(1000*60*60*24);
    if(diffDays>30){ year+=1; }
  }
  const mm=String(month).padStart(2,'0');
  const dd=String(day).padStart(2,'0');
  return `${year}-${mm}-${dd}`;
}

window.addAudit=function(){
  const dateEl=document.getElementById('auditDate');
  const dateEndEl=document.getElementById('auditDateEnd');
  const date=parseDDMM(dateEl.value, dateEl.dataset.year);
  const dateEnd=parseDDMM(dateEndEl.value, dateEndEl.dataset.year);
  const typ=document.getElementById('auditTyp').value.trim();
  const zak=document.getElementById('auditZak').value.trim();
  if(!date || !typ){ alert('Zadaj aspoň dátum (dd.mm.) a typ.'); return; }
  if(dateEnd && dateEnd<date){ alert('Koniec nemôže byť pred začiatkom.'); return; }
  if(editingAuditId){
    const idx=auditData.findIndex(x=>x.id===editingAuditId);
    if(idx!==-1){ auditData[idx]={...auditData[idx], date, dateEnd, typ, zak}; }
  } else {
    auditData.push({ id:Date.now().toString(), date, dateEnd, typ, zak });
  }
  saveAudits();
  hideAuditForm();
  renderCustomAudits();
};

window.editAudit=function(id){
  const a=auditData.find(x=>x.id===id);
  if(!a) return;
  showAuditForm();
  editingAuditId=id;
  const toDDMM=(iso)=>{ if(!iso) return ''; const p=iso.split('-'); return `${parseInt(p[2],10)}.${parseInt(p[1],10)}.`; };
  const toYear=(iso)=>{ if(!iso) return ''; return iso.split('-')[0]; };
  const dateEl=document.getElementById('auditDate');
  const dateEndEl=document.getElementById('auditDateEnd');
  dateEl.value=toDDMM(a.date); dateEl.dataset.year=toYear(a.date);
  dateEndEl.value=toDDMM(a.dateEnd); dateEndEl.dataset.year=toYear(a.dateEnd);
  document.getElementById('auditTyp').value=a.typ;
  document.getElementById('auditZak').value=a.zak||'';
  const btn=document.querySelector('#auditFormRow button[onclick="addAudit()"]');
  if(btn) btn.textContent='Uložiť';
  const delBtn=document.getElementById('auditDeleteBtn');
  if(delBtn) delBtn.style.display='inline-block';
  document.getElementById('auditTyp').focus();
};

window.deleteEditingAudit=function(){
  if(!editingAuditId) return;
  auditData=auditData.filter(x=>x.id!==editingAuditId);

  renderCustomAudits();
};

// Postupne zmenší font daného elementu, kým sa jeho obsah (text) nezmestí na jeden riadok
// (žiadne zalomenie) v rámci jeho aktuálnej šírky. Element musí mať white-space:nowrap.
function shrinkToFit(el, minFontPx){
  if(!el) return;
  minFontPx = minFontPx || 9;
  let size = parseFloat(getComputedStyle(el).fontSize);
  let safety = 0;
  while(el.scrollWidth > el.clientWidth + 1 && size > minFontPx && safety < 30){
    size -= 1;
    el.style.fontSize = size + 'px';
    safety++;
  }
}

function renderCustomAudits(){
  const formRow=document.getElementById('auditFormRow');
  if(!formRow) return;
  const today=new Date(); today.setHours(0,0,0,0);

  // Odstráň skončené (koniec auditu už prešiel)
  const before=auditData.length;
  auditData=auditData.filter(a=>{
    const e=parseLeaveDate(a.dateEnd||a.date); e.setHours(0,0,0,0);
    return e>=today;
  });
  if(auditData.length!==before) saveAudits();

  // Odstráň staré DOM riadky a vlož nanovo (zoradené čisto podľa dátumu začiatku) pred formulár
  document.querySelectorAll('tr.customAuditRow').forEach(r=>r.remove());
  auditData.slice().sort((a,b)=> parseLeaveDate(a.date)-parseLeaveDate(b.date)).forEach(a=>{
    const d=parseLeaveDate(a.date);
    let datum=`${d.getDate()}.${d.getMonth()+1}.`;
    if(a.dateEnd && a.dateEnd!==a.date){
      const dEnd=parseLeaveDate(a.dateEnd);
      // rovnaký mesiac -> "21-22.7.", inak "30.6.-2.7."
      if(d.getMonth()===dEnd.getMonth()){
        datum=`${d.getDate()}-${dEnd.getDate()}.${d.getMonth()+1}.`;
      } else {
        datum=`${d.getDate()}.${d.getMonth()+1}.-${dEnd.getDate()}.${dEnd.getMonth()+1}.`;
      }
    }
    const tr=document.createElement('tr');
    tr.className='customAuditRow';
    tr.style.borderBottom='1px solid rgba(255,255,255,0.1)';
    tr.style.cursor='pointer';
    tr.title='Kliknutím upraviť';
    tr.onclick=function(e){ e.stopPropagation(); editAudit(a.id); };
    tr.innerHTML=
      `<td style="padding:8px 4px;text-align:center;white-space:nowrap;overflow:hidden;">${datum}</td>`+
      `<td style="padding:8px 4px;text-align:center;white-space:nowrap;overflow:hidden;">${a.typ}</td>`+
      `<td style="padding:8px 4px;text-align:center;white-space:nowrap;overflow:hidden;">${a.zak||''}</td>`+
      `<td style="padding:8px 4px;text-align:center;color:#00d4ff;" class="daysToAudit" data-date="${a.date}"${a.dateEnd?` data-end="${a.dateEnd}"`:''}>-</td>`;
    formRow.parentNode.insertBefore(tr, formRow);
    // Zmenši font v bunkách, ak text nezapadá na jeden riadok (namiesto zalomenia)
    Array.from(tr.children).slice(0,3).forEach(td=>shrinkToFit(td));
  });
  shrinkToFit(document.getElementById('auditsHeaderZak'));
  // poloha tabuľky voľna a spodných boxov sa môže zmeniť (zmena výšky auditov)
  if(typeof positionLeaveBox==='function') positionLeaveBox();
  if(typeof positionBottomBoxes==='function') positionBottomBoxes();
  // Countdown dní (.daysToAudit) sa počíta v updateVacation() - zavolaj ju hneď,
  // aby nové/upravené riadky neukazovali "-" až do najbližšieho minútového tiku.
  if(typeof updateVacation==='function') updateVacation();
}

// ŠKÁLOVANIE PLÁTNA – aby sa dashboard zmestil na akúkoľvek obrazovku (aj mobil na šírku)
function fitStage(){
  const stage=document.getElementById('stage');
  if(!stage) return;
  const sw=1920, sh=1080;
  const scale=Math.min(window.innerWidth/sw, window.innerHeight/sh);
  const x=Math.round((window.innerWidth  - sw*scale)/2);
  const y=Math.round((window.innerHeight - sh*scale)/2);
  stage.style.transform=`translate(${x}px, ${y}px) scale(${scale})`;
  if(typeof positionLeaveBox==='function') positionLeaveBox();
  if(typeof positionBottomBoxes==='function') positionBottomBoxes();
}

// Na mobile spôsobuje pinch-zoom (približovanie prstami) opakované "resize" eventy,
// ktoré pri každom mikro-zmenení vyvolajú fitStage() a prekreslia/posunú celý dashboard -
// to vyzerá ako preblikávanie počas približovania. Riešenie:
// 1) debounce - fitStage() sa zavolá až keď používateľ na chvíľu prestane meniť veľkosť okna,
//    nie pri každom jednotlivom mikro-evente počas gesta.
// 2) ak prehliadač podporuje visualViewport, pinch-zoom mení len jeho scale/width, nie
//    window.innerWidth/innerHeight - takéto zmeny vôbec netreba riešiť cez fitStage().
let fitStageTimer=null;
function scheduleFitStage(){
  if(fitStageTimer) clearTimeout(fitStageTimer);
  fitStageTimer=setTimeout(fitStage, 150);
}
window.addEventListener('resize', scheduleFitStage);
window.addEventListener('orientationchange', scheduleFitStage);
fitStage();

// LIVE FEED SPRÁV Z TERAZ.SK - QUEUE SYSTÉM (posledných 50 správ, najnovšia vpredu)
let newsQueue = [];
const NEWS_QUEUE_MAX = 50;

async function updateNewsQueue() {
  const rssUrl = 'https://www.teraz.sk/rss/vsetky-spravy.rss';
  const xmlText = await fetchTextViaCorsProxy(rssUrl, 5000);
  if(!xmlText) return;

  const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
  const items = xml.querySelectorAll('item');

  let freshNews = [];
  items.forEach(item => {
    const title = item.querySelector('title')?.textContent?.trim();
    if(title && title.length > 10) freshNews.push(title);
  });

  // Spracovanie queue: každá nová správa pridaná na začiatok vytlačí najstaršiu (max 50)
  freshNews.forEach(title => {
    if(!newsQueue.includes(title)) {
      newsQueue.unshift(title); // Nový na začiatok
      if(newsQueue.length > NEWS_QUEUE_MAX) newsQueue.pop(); // Najstarší sa vyhodí
    }
  });

  // Zobraz všetky správy v queue
  if(newsQueue.length > 0) {
    document.getElementById('eventScroll').innerText = newsQueue.join(' • ');
    console.log('✓ Queue: ' + newsQueue.length + ' správ');
  }
}

// ===== MINI DATE PICKER (deň.mesiac, bez roka) =====
let mdpTargetInput = null;
let mdpViewMonth = new Date().getMonth();
let mdpViewYear = new Date().getFullYear();

function mdpOpen(inputEl){
  mdpTargetInput = inputEl;
  const now = new Date();
  // Ak pole už má hodnotu dd.mm., otvor kalendár na tom mesiaci (a roku, ak je známy)
  const m = (inputEl.value||'').trim().match(/^(\d{1,2})[.\/](\d{1,2})\.?$/);
  if(m){
    mdpViewMonth = parseInt(m[2],10)-1;
    mdpViewYear = inputEl.dataset.year ? parseInt(inputEl.dataset.year,10) : now.getFullYear();
  } else {
    mdpViewMonth = now.getMonth();
    mdpViewYear = now.getFullYear();
  }
  mdpRender();
  const picker = document.getElementById('miniDatePicker');
  const rect = inputEl.getBoundingClientRect();
  picker.style.display = 'block';
  let top = rect.bottom + window.scrollY + 6;
  let left = rect.left + window.scrollX;
  // Zabráň pretečeniu mimo obrazovky vpravo
  if(left + 220 > window.innerWidth) left = window.innerWidth - 230;
  picker.style.top = top + 'px';
  picker.style.left = left + 'px';
}

function mdpClose(){
  document.getElementById('miniDatePicker').style.display = 'none';
  mdpTargetInput = null;
}

const MDP_MONTHS = ['Január','Február','Marec','Apríl','Máj','Jún','Júl','August','September','Október','November','December'];
const MDP_DOWS = ['Po','Ut','St','Št','Pi','So','Ne'];

function mdpRender(){
  const picker = document.getElementById('miniDatePicker');
  const firstDay = new Date(mdpViewYear, mdpViewMonth, 1);
  let startDow = firstDay.getDay(); // 0=Ne
  startDow = (startDow+6)%7; // posun na Po=0
  const daysInMonth = new Date(mdpViewYear, mdpViewMonth+1, 0).getDate();
  const now = new Date();

  // Rozsah výberu: od aktuálneho mesiaca, max 12 mesiacov dopredu
  const monthsFromNow = (mdpViewYear - now.getFullYear())*12 + (mdpViewMonth - now.getMonth());
  const canPrev = monthsFromNow > 0;
  const canNext = monthsFromNow < 12;

  let html = `<div class="mdpHeader">
    <span onclick="event.stopPropagation();mdpPrevMonth()" style="${canPrev?'':'visibility:hidden;'}">‹</span>
    <span style="cursor:default;">${MDP_MONTHS[mdpViewMonth]} ${mdpViewYear}</span>
    <span onclick="event.stopPropagation();mdpNextMonth()" style="${canNext?'':'visibility:hidden;'}">›</span>
  </div>`;
  html += `<div class="mdpGrid">`;
  MDP_DOWS.forEach(d=> html += `<div class="mdpDow">${d}</div>`);
  for(let i=0;i<startDow;i++) html += `<div class="mdpDay empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const isToday = (d===now.getDate() && mdpViewMonth===now.getMonth() && mdpViewYear===now.getFullYear());
    html += `<div class="mdpDay${isToday?' today':''}" onclick="event.stopPropagation();mdpSelect(${d})">${d}</div>`;
  }
  html += `</div>`;
  picker.innerHTML = html;
}

function mdpPrevMonth(){
  const now = new Date();
  const monthsFromNow = (mdpViewYear - now.getFullYear())*12 + (mdpViewMonth - now.getMonth());
  if(monthsFromNow <= 0) return;
  mdpViewMonth--;
  if(mdpViewMonth<0){ mdpViewMonth=11; mdpViewYear--; }
  mdpRender();
}
function mdpNextMonth(){
  const now = new Date();
  const monthsFromNow = (mdpViewYear - now.getFullYear())*12 + (mdpViewMonth - now.getMonth());
  if(monthsFromNow >= 12) return;
  mdpViewMonth++;
  if(mdpViewMonth>11){ mdpViewMonth=0; mdpViewYear++; }
  mdpRender();
}
window.mdpPrevMonth = mdpPrevMonth;
window.mdpNextMonth = mdpNextMonth;
window.mdpSelect = function(day){
  if(mdpTargetInput){
    mdpTargetInput.value = `${day}.${mdpViewMonth+1}.`;
    mdpTargetInput.dataset.year = mdpViewYear;
    mdpTargetInput.dispatchEvent(new Event('input'));
  }
  mdpClose();
};
