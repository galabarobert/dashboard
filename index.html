<!DOCTYPE html>
<html lang="sk">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard</title>

<style>
html, body { height:100%; }
body {
    margin:0;
    background: linear-gradient(135deg, #0a0015 0%, #1a0033 25%, #003366 50%, #001a33 75%, #0a0015 100%);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    color:white;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    position: relative;
    overflow: hidden;
    min-height: 100vh;
    padding-top: env(safe-area-inset-top);
}

/* Pevné plátno 1920x1080 - škáluje sa na veľkosť displeja (mobil na šírku ho ukáže celé) */
#stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    transform-origin: top left;
    z-index: 2;
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: 
        radial-gradient(circle at 20% 50%, rgba(138, 43, 226, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0, 255, 200, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(255, 0, 128, 0.1) 0%, transparent 50%);
    pointer-events: none;
    z-index: 1;
}

@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.glass {
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(50px) saturate(200%);
    -webkit-backdrop-filter:blur(50px) saturate(200%);
    border:1.5px solid rgba(255,255,255,0.25);
    border-radius:30px;
    padding:15px;
    box-shadow: 
        0 0 40px rgba(138, 43, 226, 0.3),
        0 8px 32px rgba(0,0,0,0.4),
        inset 0 0 20px rgba(255,255,255,0.1);
}

.glow {text-shadow:0 0 15px rgba(255,255,255,0.4);}

#location {position:absolute;top:1px;left:40px;font-size:109px;}
#tempNow {margin-top:0px;font-size:34px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;font-weight:400;}

#clock-box {position:absolute;top:-37px;right:40px;text-align:right;}
#time {font-size:170px;}
#dateWeek {font-size:34px;margin-top:-38px;}

#weather {position:absolute;top:219px;left:40px;font-size:28px;line-height:1.8;width:auto;white-space:nowrap;height:50px;display:flex;align-items:center;}
#daysSat {position:absolute;top:317px;left:40px;font-size:32px;text-align:center;width:140px;}
#daysSun {position:absolute;top:317px;left:230px;font-size:32px;text-align:center;width:140px;}
#daysMon {position:absolute;top:317px;left:420px;font-size:32px;text-align:center;width:140px;}
#sun {position:absolute;top:556px;left:40px;font-size:28px;text-align:left;line-height:1.5;}
#nameday {position:absolute;top:216px;right:40px;min-width:394px;font-size:31px;text-align:left;padding-left:25px;white-space:nowrap;box-sizing:border-box;}

#world{
    position:absolute;
    top:761px;
    left:40px;
    width:auto;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:15px;
    box-sizing: border-box;
}

.city{
    text-align:center;
    display:flex;
    flex-direction:column;
    gap:5px;
    white-space:nowrap;
    flex-shrink:0;
}

.place{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:18px;
    margin:0;
    justify-content:center;
}

.city-time{
    font-size:28px;
    margin:0;
    display:inline;
}

.city-weather{
    font-size:22px;
    margin:0;
    display:inline;
    margin-left:10px;
}

.time-weather{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
}

.flag{width:20px;height:12px;}

#shiftBox{
    position:absolute;
    top:12px;
    left:605px;
    font-size:28px;
    text-align:center;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(50px) saturate(200%);
    border:1.5px solid rgba(255,255,255,0.25);
    border-radius:30px;
    padding:15px;
    box-shadow: 0 0 40px rgba(138, 43, 226, 0.3), 0 8px 32px rgba(0,0,0,0.4);
}
#lunchTime{font-size:34px;margin-bottom:10px;}

#shiftBanners {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:48px;
    font-weight:bold;
    text-align:center;
    z-index:100;
}

#currentWeatherBox{
    position:absolute;
    top:175px;
    left:40px;
    font-size:28px;
    text-align:left;
    width:auto;
    white-space:nowrap;
    height:34px;
    display:flex;
    align-items:center;
}

#vacationBox{
    position:absolute;
    top:360px;
    right:40px;
    left:auto;
    width:394px;
    transform:none;
    font-size:38px;
    text-align:left;
    padding-left:25px;
    box-sizing:border-box;
}
#vacationTime{font-size:28px;color:white;}

#holidayBox{
    position:absolute;
    top:calc(450px - 1mm);
    right:40px;
    width:394px;
    font-size:28px;
    text-align:left;
    padding-left:25px;
    box-sizing:border-box;
}
#holidayDisplay{font-size:28px;color:white;line-height:1.3;}

#miniCalendar{
    position:absolute;
    top:560px;
    right:40px;
    padding:15px;
}
#fuelBox{
    position:absolute;
    top:780px;
    right:40px;
    padding:15px;
    box-sizing:border-box;
}
#currencyBox{
    position:absolute;
    top:780px;
    right:40px;
    padding:15px;
    box-sizing:border-box;
}
#leaveBox{
    position:absolute;
    top:0;
    left:0;
    box-sizing:border-box;
    background:rgba(190,200,40,0.16) !important;
    border:1.5px solid rgba(200,210,70,0.45) !important;
    box-shadow:
        0 0 30px rgba(190,200,40,0.25),
        0 8px 32px rgba(0,0,0,0.4),
        inset 0 0 18px rgba(210,220,100,0.1) !important;
}

#nhl {position:absolute;top:350px;right:40px;margin-top:0px;font-size:35px;line-height:1.8;width:383px;}

#auditsTable {
    position:absolute;
    top:216px;
    left:50%;
    transform:translateX(calc(-50% + 38px + 10mm)) scale(1.6452230625);
    transform-origin:center top;
    width:auto;
    min-width:400px;
    max-width:500px;
    font-size:14px;
    text-align:center;
}

.nhl-game {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    padding: 8px;
    background: rgba(255,255,255,0.02);
    border-radius: 8px;
}

.game-live {
    animation: pulse 1s infinite;
    color: #ff3b3b;
    font-weight: bold;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
}

#miniDatePicker{
    position:absolute;
    z-index:9999;
    background:rgba(30,20,60,0.97);
    backdrop-filter:blur(20px) saturate(180%);
    border:1.5px solid rgba(255,255,255,0.3);
    border-radius:12px;
    padding:10px;
    box-shadow:0 8px 32px rgba(0,0,0,0.5);
    display:none;
    width:220px;
    font-size:13px;
    color:#fff;
}
#miniDatePicker .mdpHeader{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:bold;}
#miniDatePicker .mdpHeader span{cursor:pointer;padding:2px 8px;border-radius:4px;}
#miniDatePicker .mdpHeader span:hover{background:rgba(255,255,255,0.15);}
#miniDatePicker .mdpGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;}
#miniDatePicker .mdpDow{color:#aaa;font-size:11px;padding:2px 0;}
#miniDatePicker .mdpDay{padding:4px 0;border-radius:6px;cursor:pointer;}
#miniDatePicker .mdpDay:hover{background:#00d4ff;color:#001a33;}
#miniDatePicker .mdpDay.empty{cursor:default;}
#miniDatePicker .mdpDay.empty:hover{background:none;}
#miniDatePicker .mdpDay.today{outline:1px solid #00d4ff;}
</style>
</head>

<div id="stage">

<div id="location" class="glow">
    Vráble
    <div id="tempNow"></div>
</div>

<div id="daysSun" class="glass"></div>
<div id="daysMon" class="glass"></div>
<div id="sun" class="glass"></div>
<div id="nameday" class="glass"></div>

<div id="auditsTable" class="glass">
    <table style="width:100%;font-size:17px;border-collapse:collapse;">
        <tr style="border-bottom:1px solid rgba(255,255,255,0.2);">
            <th style="text-align:center;padding:8px;">Deň</th>
            <th style="text-align:center;padding:8px;">Typ</th>
            <th style="text-align:center;padding:8px;">Zákazník/Proces</th>
            <th style="text-align:center;padding:8px;color:#fff;">Dni</th>
        </tr>
            <tr style="border-bottom:1px solid rgba(255,255,255,0.1);">
            <td style="padding:8px;text-align:center;">23.6.</td>
            <td style="padding:8px;text-align:center;">Návšteva</td>
            <td style="padding:8px;text-align:center;">Hoerbiger</td>
            <td style="padding:8px;text-align:center;color:#00d4ff;" class="daysToAudit" data-date="2026-06-23">-</td>
        </tr>
        <tr id="auditFormRow">
            <td style="padding:6px 4px;text-align:center;">
                <div style="display:flex;gap:3px;align-items:center;justify-content:center;">
                    <input id="auditDate" type="text" placeholder="dd.mm." title="dátum začiatku auditu (deň.mesiac)" maxlength="6" style="background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:6px;padding:3px;font-size:11px;width:48px;box-sizing:border-box;text-align:center;">
                    <span style="font-size:10px;color:#aaa;">-</span>
                    <input id="auditDateEnd" type="text" placeholder="dd.mm." title="dátum konca auditu (nepovinné, pre viacdňový audit)" maxlength="6" style="background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:6px;padding:3px;font-size:11px;width:48px;box-sizing:border-box;text-align:center;">
                </div>
            </td>
            <td style="padding:6px 4px;text-align:center;"><input id="auditTyp" type="text" placeholder="Typ" style="background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:6px;padding:3px;font-size:11px;width:100%;box-sizing:border-box;"></td>
            <td style="padding:6px 4px;text-align:center;"><input id="auditZak" type="text" placeholder="Zákazník" style="background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:6px;padding:3px;font-size:11px;width:100%;box-sizing:border-box;"></td>

        </tr>
    </table>
</div>

<div id="leaveBox" class="glass">
    <div id="leaveList" style="font-size:28px;"></div>
    <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center;justify-content:center;">
        <input id="leaveName" type="text" placeholder="Meno" style="background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:8px;padding:6px 8px;font-size:15px;width:120px;">
        <input id="leaveStart" type="text" placeholder="dd.mm." maxlength="6" style="background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:8px;padding:6px 8px;font-size:15px;width:80px;text-align:center;">
        <input id="leaveEnd" type="text" placeholder="dd.mm." title="koniec voľna (nepovinné)" maxlength="6" style="background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.3);border-radius:8px;padding:6px 8px;font-size:15px;width:80px;text-align:center;">
        <button onclick="addLeave()" style="background:#6b7280;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:15px;font-weight:bold;cursor:pointer;">Pridať</button>

function getNameday(d){
  let key = d.getDate()+"."+(d.getMonth()+1);
  let entry = MENINY[key];
  return entry ? entry[0] : "–";
}

// FORMAT
function format(sec){
  sec=Math.floor(sec);
  let h=Math.floor(sec/3600);
  let m=Math.floor((sec%3600)/60);
  let s=sec%60;
  return `${h}h ${m}m ${s}s`;
}

// IKONY
function icon(code){
  // WMO Weather interpretation codes
  // 0 = Clear, 1-2 = Mainly clear, 3 = Overcast, 45-48 = Fog
  // 51-67 = Drizzle/Rain, 71-77 = Snow, 80-82 = Rain showers
  // 85-86 = Snow showers, 95-99 = Thunderstorm
  
  if (code === 0 || code === 1 || code === 2) return "☀️";      // Clear/Mainly clear
  if (code === 3) return "⛅";                                    // Overcast
  if (code === 45 || code === 48) return "🌫️";                  // Fog/Depositing rime fog
  if (code === 51 || code === 53 || code === 55) return "🌦️";   // Light/Moderate/Dense drizzle
  if (code === 61 || code === 63 || code === 65) return "🌧️";   // Slight/Moderate/Heavy rain
  if (code === 71 || code === 73 || code === 75) return "❄️";    // Slight/Moderate/Heavy snow
  if (code === 77) return "🌨️";                                  // Snow grains
  if (code === 80 || code === 81 || code === 82) return "⛈️";   // Slight/Moderate/Violent rain showers
  if (code === 85 || code === 86) return "🌨️";                  // Slight/Heavy snow showers
  if (code === 95 || code === 96 || code === 99) return "⚡";    // Thunderstorm (slight/moderate/violent)
  
  return "☁️";  // Default fallback
}

function windDir(deg){
  const d=["S","SV","V","JV","J","JZ","Z","SZ"];
  return d[Math.round(deg/45)%8];
}

function getDirection(deg){
  if(deg>=315||deg<45)return"od Nitry";
  if(deg<135)return"od Levíc";
  if(deg<225)return"od Nových Zámkov";
  return"od Zlatých Moraviec";
}

// ISO TÝŽDEŇ
function getISOWeek(d){
  const date=new Date(d);
  date.setDate(date.getDate()+3-(date.getDay()+6)%7);
  const week1=new Date(date.getFullYear(),0,4);
  return 1+Math.round(((date-week1)/86400000)/7);
}

// ČIAS + DÁTUM
function updateTime(){
  const n=new Date();
  time.innerText=n.toLocaleTimeString("sk-SK",{hour12:false});
  let d=n.toLocaleDateString("sk-SK",{weekday:"long"});
  d=d.charAt(0).toUpperCase()+d.slice(1);
  dateWeek.innerText=d+" "+n.toLocaleDateString("sk-SK",{day:"numeric",month:"long",year:"numeric"})+" • týždeň "+getISOWeek(n);
}

// MENINY – aktualizuje každý deň automaticky
let lastNamedayDate = -1;

function updateNameday(){
  const n = new Date();
  const today = n.getDate();
  if(today === lastNamedayDate) return;
  lastNamedayDate = today;

  const tomorrow = new Date(n);
  tomorrow.setDate(tomorrow.getDate()+1);

  const todayName   = getNameday(n);
  const tomorrowName = getNameday(tomorrow);

  nameday.innerHTML = "Dnes má meniny: <span style=\"color:#00d4ff;font-weight:bold;\">" + todayName + "</span><hr style=\"border:none;border-top:1px solid rgba(255,255,255,0.2);margin:6px 0;\">Zajtra má meniny: " + tomorrowName;

  // Ak by sa box pri dlhých menách rozšíril nad bezpečný limit, zmenši font tak,
  // aby ostal vždy presne na 2 riadkoch (Dnes/Zajtra) bez zalomenia a bez nadmerného presahu.
  nameday.style.fontSize = '31px';
  const maxWidth = 410; // bezpečný strop šírky boxu (px) - nesmie zasahovať do tabuľky auditov
  let safety = 0;
  while(nameday.scrollWidth > maxWidth && safety < 15){
    const curSize = parseFloat(getComputedStyle(nameday).fontSize);
    nameday.style.fontSize = (curSize - 1) + 'px';
    safety++;
  }
}

// SLNKO - VÝCHOD/ZÁPAD + MESIAC
async function loadSun(){
  try {
    const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=48.24&longitude=18.32&daily=sunrise,sunset&timezone=Europe%2FBratislava&forecast_days=1");
    const data = await res.json();
    
    const sunrise = new Date(data.daily.sunrise[0]).toLocaleTimeString('sk-SK', {hour: '2-digit', minute: '2-digit'});
    const sunset = new Date(data.daily.sunset[0]).toLocaleTimeString('sk-SK', {hour: '2-digit', minute: '2-digit'});
    
    // Výpočet fázy mesiaca - DO SPLNÉHO MESIACA (30. júna 2026)
    const now = new Date();
    const fullMoonDate = new Date(2026, 5, 30, 1, 57); // 30. jún 2026
    const lunarCycle = 29.53;
    
    // New moon pre tento cyklus (14.765 dní pred full moon)
    let newMoonDate = new Date(fullMoonDate.getTime() - (14.765 * 24 * 60 * 60 * 1000));
    
    // Ak je new moon v budúcnosti, vezmem predchádzajúci cyklus
    while (newMoonDate > now) {
      newMoonDate = new Date(newMoonDate.getTime() - (lunarCycle * 24 * 60 * 60 * 1000));
    }
    
    // Dní od new moonu
    const daysSinceNewMoon = (now - newMoonDate) / (1000 * 60 * 60 * 24);
    
    // Správny piktogram a názov fázy podľa lunárneho veku
    let moonEmoji = '🌑';
    let moonName = 'Nový mesiac';
    
    if (daysSinceNewMoon < 1.84) { moonEmoji = '🌑'; moonName = 'Nov'; }
    else if (daysSinceNewMoon < 7.38) { moonEmoji = '🌒'; moonName = 'Dorastajúci mesiac'; }
    else if (daysSinceNewMoon < 9.23) { moonEmoji = '🌓'; moonName = 'Prvá štvrť'; }
    else if (daysSinceNewMoon < 14.77) { moonEmoji = '🌔'; moonName = 'Dorastajúci mesiac'; }
    else if (daysSinceNewMoon < 16.61) { moonEmoji = '🌕'; moonName = 'Spln'; }
    else if (daysSinceNewMoon < 22.15) { moonEmoji = '🌖'; moonName = 'Ubúdajúci mesiac'; }
    else if (daysSinceNewMoon < 23.99) { moonEmoji = '🌗'; moonName = 'Posledná štvrť'; }
    else { moonEmoji = '🌘'; moonName = 'Ubúdajúci mesiac'; }
    
    // Skontroluj či je dnes new moon alebo full moon
    const today = new Date();
    const isNewMoonDay = today.getDate() === newMoonDate.getDate() && today.getMonth() === newMoonDate.getMonth();
    if (isNewMoonDay) moonName = 'Now';
    
    // Nový formát - tri riadky s názvami
    document.getElementById('sun').innerHTML = `Východ slnka: ☀️ ${sunrise}<hr style="border:none;border-top:1px solid rgba(255,255,255,0.2);margin:6px 0;">Západ slnka: 🌙 ${sunset}<hr style="border:none;border-top:1px solid rgba(255,255,255,0.2);margin:6px 0;">Fáza mesiaca: ${moonEmoji} ${moonName}`;
  } catch (err) {
    document.getElementById('sun').innerHTML = "☀️ Slnko: Chyba";
  }
}

// FIFA MS 2026 - futbalové zápasy
async function loadNHL(){
  try {
    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];
    const tomorrowDate = new Date(today);
    tomorrowDate.setDate(tomorrowDate.getDate() + 1);
    const tomorrowStr = tomorrowDate.toISOString().split('T')[0];
    
    let filaHTML = "";
    
    let hasData = false;
    
    // Skúšame fetch z football-data.org s MS 2026
    try {
      const response = await Promise.race([
        fetch(`https://api.football-data.org/v4/competitions/WC/matches?dateFrom=${todayStr}&dateTo=${tomorrowStr}`),
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 4000))
      ]);
      
      if (response.ok) {
        const data = await response.json();
        if (data.matches && data.matches.length > 0) {
          hasData = true;
          console.log('✓ API Úspešne! Zápasy:', data.matches.length);
          
          // Rozdelí na dnes a zajtra
          const todayMatches = data.matches.filter(m => m.utcDate.includes(todayStr));
          const tomorrowMatches = data.matches.filter(m => m.utcDate.includes(tomorrowStr));
          
          if (todayMatches.length > 0) {
            filaHTML += `<div style='font-weight:bold;margin-bottom:12px;font-size:16px;color:#fff;margin-top:12px;'>Dnešné zápasy:</div>`;
            todayMatches.forEach(match => {
              const home = match.homeTeam.name;
              const away = match.awayTeam.name;
              const status = match.status;
              const time = new Date(match.utcDate).toLocaleTimeString('sk-SK', {hour: '2-digit', minute: '2-digit'});
              
              let score = '-';
              let resultDisplay = '-';
              
              if (status === 'FINISHED') {
                score = `${match.score.fullTime.home}-${match.score.fullTime.away}`;
                resultDisplay = `<span style="color:#00ff88;font-weight:bold;">✓ ${score}</span>`;
              } else if (status === 'LIVE' || status === 'IN_PLAY') {
                score = `${match.score.fullTime.home}-${match.score.fullTime.away}`;
                resultDisplay = `<span style="color:#ffaa00;font-weight:bold;">● LIVE</span>`;
              } else {
                resultDisplay = `<span style="color:#aaa;">-</span>`;
              }
              
              filaHTML += `<div style='background:rgba(30,100,140,0.3);border-radius:8px;padding:10px;margin-bottom:8px;border-left:3px solid #00d4ff;display:flex;justify-content:space-between;align-items:center;gap:10px;'>
                <div style='font-size:15px;color:#aaa;min-width:45px;'>${time}</div>
                <div style='font-size:17px;flex:1.5;text-align:right;'>${away}</div>
                <div style='font-size:17px;color:#00d4ff;font-weight:bold;min-width:35px;text-align:center;'>${resultDisplay}</div>
                <div style='font-size:17px;flex:1.5;text-align:left;'>${home}</div>
              </div>`;
            });
          } else {
            filaHTML += `<div style='font-weight:bold;margin-bottom:12px;font-size:16px;color:#fff;margin-top:12px;'>Dnešné zápasy:</div><div style='padding:12px;color:#aaa;text-align:center;font-size:16px;'>Žiadne zápasy</div>`;
          }
          
          if (tomorrowMatches.length > 0) {
            filaHTML += `<div style='font-weight:bold;margin-bottom:12px;font-size:16px;color:#fff;margin-top:16px;'>Zajtra:</div>`;
            tomorrowMatches.forEach(match => {
              const home = match.homeTeam.name;
              const away = match.awayTeam.name;
              const time = new Date(match.utcDate).toLocaleTimeString('sk-SK', {hour: '2-digit', minute: '2-digit'});
              
              filaHTML += `<div style='background:rgba(30,100,140,0.3);border-radius:8px;padding:10px;margin-bottom:8px;border-left:3px solid #00d4ff;display:flex;justify-content:space-between;align-items:center;gap:10px;'>

                <div style='font-size:17px;color:#00d4ff;font-weight:bold;min-width:35px;text-align:center;'>-</div>

              </div>`;
            });
          }
        }
      }
    } catch (e) {
      console.log('✗ API chyba:', e.message);

    // Ak nemáme dáta z API, zobraz fallback
    if (!hasData) {
      console.log('Zobrazujem fallback dáta');
      getZapasyPodlaDna();
      return;
    }

// GONG - VYRAZNÝ ALERT
// ZVUK NOTIFIKÁCIA - GONG
function playAlert(){
  try {
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    
    // Prvý tón - hlboký gong
    const osc1=ctx.createOscillator();
    const gain1=ctx.createGain();
    osc1.connect(gain1);
    gain1.connect(ctx.destination);
    osc1.frequency.value=180;
    gain1.gain.setValueAtTime(0.6,ctx.currentTime);
    gain1.gain.exponentialRampToValueAtTime(0.05,ctx.currentTime+3.5);
    osc1.start(ctx.currentTime);
    osc1.stop(ctx.currentTime+3.5);
    
    // Druhý tón - vyšší "zvonenie" (harmonický)
    const osc2=ctx.createOscillator();
    const gain2=ctx.createGain();
    osc2.connect(gain2);
    gain2.connect(ctx.destination);
    osc2.frequency.value=360;
    gain2.gain.setValueAtTime(0.4,ctx.currentTime);
    gain2.gain.exponentialRampToValueAtTime(0.02,ctx.currentTime+3.5);
    osc2.start(ctx.currentTime);
    osc2.stop(ctx.currentTime+3.5);
  } catch(e){}
}

// DOVOLENKA + VIANOCE + ZMENA + OBED - BANERY V STREDE
function updateVacation(){
  const n=new Date();
  const s=new Date();s.setHours(7,0,0,0); // Začiatok zmeny dnes
  const shiftEnd=new Date();shiftEnd.setHours(15,0,0,0); // Koniec zmeny
  const lunchTime=new Date();lunchTime.setHours(10,30,0,0); // Obed
  const vacStart=new Date(2026,7,3); // 3.8.2026
  const christmas=new Date(2026,11,25); // 25.12.2026
  
  // Ďalší začiatok zmeny - ak je po 7:00, tak zajtra (preskočí víkend)
  const nextShift=new Date();nextShift.setHours(7,0,0,0);
  while(nextShift<=n || nextShift.getDay()===0 || nextShift.getDay()===6){
    nextShift.setDate(nextShift.getDate()+1);
  }
  
  const diffVac=Math.ceil((vacStart-n)/(1000*60*60*24));
  const diffChrist=Math.ceil((christmas-n)/(1000*60*60*24));
  const diffShift=Math.ceil((shiftEnd-n)/1000); // Do konca zmeny
  const diffToShift=(nextShift-n)/1000; // Do ďalšieho začiatku zmeny
  const diffLunch=(lunchTime-n)/1000; // Do obeda
  
  const today=n.getDay();
  
  // Dovolenka / Vianoce - vždy zobraz v boxe hore
  if(n>=vacStart && n<=new Date(2026,7,9)){
    vacationTime.innerHTML=`🏖️ Dovolenka <span style="color:#00d4ff;font-weight:bold;">DNES</span>`;
    vacationTime.style.display="block";
  } else if(diffVac>0){
    vacationTime.innerHTML=`🏖️ Dovolenka <span style="color:#aaa;">o ${diffVac} dní</span>`;
    vacationTime.style.display="block";
  } else if(diffChrist>0){
    vacationTime.innerHTML=`🏖️ Do Vianoc: ${diffChrist} dní`;
    vacationTime.style.display="block";
  } else {
    vacationTime.style.display="none";
  }
  
  // Odpočet zmeny a obeda - v strede hore
  const lunchStart=new Date();lunchStart.setHours(10,30,0,0); // Obed 1
  const lunchEnd=new Date();lunchEnd.setHours(11,30,0,0); // Koniec obeda
  const beforeLunch=new Date();beforeLunch.setHours(10,15,0,0); // Zvuk pred obedом
  const soundTime=new Date();soundTime.setHours(11,15,0,0); // Zvuk počas obeda
  const lateAfternoon=new Date();lateAfternoon.setHours(14,45,0,0); // Zvuk o 14:45
  
  // Najbližší obed (10:30-11:30) - funguje 24/7, aj cez víkend/sviatky mimo zmeny
  function getLunchBannerText(){
    if(n<lunchStart && today>=1 && today<=5){
      // Pred obedom dnes (pracovný deň)
      const diffToLunch=(lunchStart-n)/1000;
      return `🍽️ Obed o: ${format(diffToLunch)}`;
    } else if(n>=lunchStart && n<lunchEnd && today>=1 && today<=5){
      // Počas obeda dnes
      const diffToLunchEnd=(lunchEnd-n)/1000;
      return `🍽️ Obed o: ${format(diffToLunchEnd)}`;
    } else {
      // Po obede, alebo víkend - odpočet do ďalšieho pracovného obeda
      const nextLunch=new Date();nextLunch.setHours(10,30,0,0);
      if(n>=lunchStart || today===0 || today===6){
        nextLunch.setDate(nextLunch.getDate()+1);
      }
      while(nextLunch.getDay()===0 || nextLunch.getDay()===6){
        nextLunch.setDate(nextLunch.getDate()+1);
      }
      const diffNextLunch=(nextLunch-n)/1000;
      return `🍽️ Obed o: ${format(diffNextLunch)}`;
    }
  }
  
  if(n>=s&&n<shiftEnd && today>=1 && today<=5){
    // Počas zmeny (7:00-15:00, pondelok-piatok)
    let bannerText = `⏱️ Do konca zmeny: ${format(diffShift)}`;
    bannerText += `<br>${getLunchBannerText()}`;
    
    // Gong v 11:15 (10:15 a 14:45 riešia updateLunch/updateShift)
    if(n>=soundTime && n<new Date(soundTime.getTime()+5*60000) && !lunchEndAlertPlayed){
      playAlert();
      lunchEndAlertPlayed=true;
    } else if(n<soundTime || n>=new Date(soundTime.getTime()+5*60000)){
      lunchEndAlertPlayed=false;
    }
    
    // Zobrazovať banner vždy počas zmeny (s obedom alebo bez)
    document.getElementById('shiftBox').innerHTML = bannerText;
    document.getElementById('shiftBox').style.display="block";
  }
  else {
    // Mimo zmeny - zobrazuj odpočet do ďalšieho začiatku zmeny + odpočet do obeda (24/7)
    if(today>=1 && today<=5){
      // V pracovný deň mimo zmeny
      let bannerText = `⏱️ Do začiatku zmeny: ${format(diffToShift)}`;
      bannerText += `<br>${getLunchBannerText()}`;
      document.getElementById('shiftBox').innerHTML = bannerText;
      document.getElementById('shiftBox').style.display="block";
    } else {

      let bannerText = `⏱️ Do začiatku zmeny: ${format(diffToShift)}`;
      bannerText += `<br>${getLunchBannerText()}`;

      document.getElementById('shiftBox').style.display="block";
    }
  }
  
  // Výpočet dní do auditov + automatické skrytie udalostí po ich skončení
  const auditCells = document.querySelectorAll('.daysToAudit');
  auditCells.forEach(cell => {
    const startDate = new Date(cell.getAttribute('data-date'));
    const endDate = new Date(cell.getAttribute('data-end') || cell.getAttribute('data-date'));
    const today = new Date();
    today.setHours(0, 0, 0, 0);

function updateHolidays(){

  const holidays=[

    {date: new Date(2026,0,27), name:"Deň pamiatky obetí holokaustu a rasového násilia"},

    {date: new Date(2026,4,1), name:"Sviatok práce"},
    {date: new Date(2026,4,8), name:"Deň víťazstva nad fašizmom"},
    {date: new Date(2026,6,5), name:"Sviatok svätého Cyrila a svätého Metoda"},
    {date: new Date(2026,7,29), name:"Výročie Slovenského národného povstania"},
    {date: new Date(2026,8,1), name:"Deň Ústavy Slovenskej republiky"},
    {date: new Date(2026,8,15), name:"Sedembolestná Panna Mária"},
    {date: new Date(2026,10,1), name:"Sviatok všetkých svätých"},

    {date: new Date(2026,11,24), name:"Štedrý deň"},
    {date: new Date(2026,11,25), name:"Prvý sviatok vianočný"},
    {date: new Date(2026,11,26), name:"Druhý sviatok vianočný"}
  ];
  
  // Nájdi najbližší sviatok (bez ohľadu na deň v týždni)
  let nextHoliday=null;
  let minDiff=Infinity;
  
  holidays.forEach(h=>{
    const diff=(h.date-today)/(1000*60*60*24);
    if(diff>=0 && diff<minDiff){
      minDiff=diff;
      nextHoliday=h;
    }
  });
  
  if(nextHoliday){
    const daysLeft=Math.ceil(minDiff);
    const hDisplay=document.getElementById('holidayDisplay');
    if(daysLeft===0){
      hDisplay.innerHTML=`🎉 ${nextHoliday.name} <span style="color:#00d4ff;font-weight:bold;">DNES</span>`;
    } else if(daysLeft===1){
      hDisplay.innerHTML=`🎉 ${nextHoliday.name} <span style="color:#aaa;">zajtra</span>`;

      hDisplay.innerHTML=`🎉 ${nextHoliday.name} <span style="color:#aaa;">o ${daysLeft} dní</span>`;
    }
    hDisplay.style.display="block";
    // Šírka boxu = presne šírka boxu s meninami
    const ndBox=document.getElementById('nameday');
    const hBox=document.getElementById('holidayBox');
    if(ndBox && hBox && ndBox.offsetWidth>0){
      hBox.style.boxSizing="border-box";
      hBox.style.width=ndBox.offsetWidth+"px";
    }
    // Ak je text na viac ako 2 riadkoch, postupne zmenši font, kým sa nezmestí na 2 riadky
    hDisplay.style.fontSize='28px';
    const lineHeight=parseFloat(getComputedStyle(hDisplay).fontSize)*1.3;
    let safety=0;
    while(hDisplay.scrollHeight > lineHeight*2 + 4 && safety<15){
      const curSize=parseFloat(getComputedStyle(hDisplay).fontSize);
      hDisplay.style.fontSize=(curSize-1)+'px';
      safety++;
    }
  } else {
    document.getElementById('holidayDisplay').style.display="none";
  }
}

// MINI KALENDÁR CELÉHO MESIACA
function buildMiniCalendar(){
  const cal=document.getElementById('miniCalendar');
  if(!cal) return;
  const now=new Date();
  const year=now.getFullYear();
  const month=now.getMonth();
  const todayDate=now.getDate();
  const monthNames=["Január","Február","Marec","Apríl","Máj","Jún","Júl","August","September","Október","November","December"];
  const firstDay=new Date(year,month,1);
  // Po=0 ... Ne=6 (JS má Ne=0)
  const startOffset=(firstDay.getDay()+6)%7;
  const daysInMonth=new Date(year,month+1,0).getDate();

  let html=`<div style="font-weight:bold;font-size:20px;margin-bottom:8px;text-align:center;">📅 ${monthNames[month]} ${year}</div>`;
  html+=`<table style="width:100%;border-collapse:collapse;font-size:16px;text-align:center;">`;
  html+=`<tr>`;
  ["Po","Ut","St","Št","Pi","So","Ne"].forEach((d,i)=>{
    const wc=(i>=5)?'#ff8a8a':'#aaa';
    html+=`<th style="padding:3px;color:${wc};font-weight:normal;">${d}</th>`;
  });
  html+=`</tr>`;

  let day=1;
  for(let row=0; row<6; row++){
    html+=`<tr>`;
    for(let col=0; col<7; col++){
      const cellIndex=row*7+col;
      if(cellIndex<startOffset || day>daysInMonth){
        html+=`<td style="padding:4px;"></td>`;
      } else {
        const isToday=(day===todayDate);
        const isWeekend=(col>=5);
        let content=String(day);
        let style="padding:4px;";
        if(isToday){
          content=`<span style="background:#00d4ff;color:#001a33;border-radius:50%;padding:3px 7px;font-weight:bold;">${day}</span>`;
        } else if(isWeekend){
          style+="color:#ff8a8a;";
        }
        html+=`<td style="${style}">${content}</td>`;
        day++;
      }
    }
    html+=`</tr>`;
    if(day>daysInMonth) break;
  }
  html+=`</table>`;
  cal.innerHTML=html;

  // Šírka = ako meniny; pozícia tesne pod sviatkom
  const ndBox=document.getElementById('nameday');
  if(ndBox && ndBox.offsetWidth>0){
    cal.style.boxSizing="border-box";
    cal.style.width=ndBox.offsetWidth+"px";
  }
  const hBox=document.getElementById('holidayBox');
  if(hBox && hBox.offsetHeight>0){
    cal.style.top=(hBox.offsetTop + hBox.offsetHeight + 12)+"px";
  }
}

// Stiahne ceny jednej stanice z hackmath.net (cez CORS proxy)
async function fetchStanica(pumpa){
  const url='https://www.hackmath.net/sk/cerpacia-stanica?pumpa='+pumpa;
  const proxies=[
    'https://api.allorigins.win/raw?url=',
    'https://corsproxy.io/?url=',
    'https://api.codetabs.com/v1/proxy/?quest='
  ];
  for(let proxy of proxies){
    try{
      const r=await fetch(proxy+encodeURIComponent(url),{signal:AbortSignal.timeout(7000)});
      if(!r.ok) continue;
      const t=await r.text();
      const b=t.match(/natural\s*95\s*\(benzín\)[^0-9]{0,40}?([0-9][.,][0-9]{2,3})/i);
      const n=t.match(/diesel\s*\(nafta\)[^0-9]{0,40}?([0-9][.,][0-9]{2,3})/i);
      if(b || n){
        return {
          benzin: b ? b[1].replace('.',',') : null,
          nafta:  n ? n[1].replace('.',',') : null
        };
      }
    }catch(e){ /* skús ďalšie proxy */ }
  }
  return null;
}

function parseLeaveDate(str){

function renderLeave(){
  const list=document.getElementById('leaveList');
  if(!list) return;
  const today=new Date(); today.setHours(0,0,0,0);

  // Odstráň skutočne skončené (koniec voľna už prešiel)
  const before=leaveData.length;
  leaveData = leaveData.filter(x=>{
    const e=parseLeaveDate(x.end||x.start); e.setHours(0,0,0,0);
    return Math.ceil((e-today)/86400000) >= 0;
  });
  if(leaveData.length!==before) saveLeave();

  const items = leaveData.map(x=>{
    const s=parseLeaveDate(x.start); s.setHours(0,0,0,0);
    const e=parseLeaveDate(x.end||x.start); e.setHours(0,0,0,0);
    const daysToStart=Math.ceil((s-today)/86400000);
    return {...x, s, e, daysToStart};
  });

  // Zlúč ľudí s rovnakým termínom voľna do jedného riadku
  const groups={};
  items.forEach(it=>{
    const key=it.start+'|'+(it.end||it.start);
    if(!groups[key]) groups[key]={ s:it.s, e:it.e, daysToStart:it.daysToStart, people:[] };
    groups[key].people.push({ name:it.name, id:it.id });
  });
  const groupList=Object.values(groups).sort((a,b)=> a.s - b.s);

  if(groupList.length===0){
    list.innerHTML=`<div style="text-align:center;color:#aaa;padding:8px;">Žiadne plánované voľno</div>`;
  } else {
    let html=`<table style="width:100%;border-collapse:collapse;">`;
    html+=`<tr style="border-bottom:1px solid rgba(255,255,255,0.2);color:#fff;">`+
      `<th style="text-align:left;padding:5px 6px;">Meno</th>`+
      `<th style="text-align:center;padding:5px 6px;">Voľno</th>`+
      `<th style="text-align:center;padding:5px 6px;">Dni</th>`+
    `</tr>`;
    groupList.forEach(g=>{
      // Dátum: D.M. alebo rozsah D-D.M. / D.M.-D.M.
      let datum;
      if(g.s.getTime()===g.e.getTime()){
        datum=`${g.s.getDate()}.${g.s.getMonth()+1}.`;
      } else if(g.s.getMonth()===g.e.getMonth()){
        datum=`${g.s.getDate()}-${g.e.getDate()}.${g.s.getMonth()+1}.`;
      } else {
        datum=`${g.s.getDate()}.${g.s.getMonth()+1}.-${g.e.getDate()}.${g.e.getMonth()+1}.`;
      }
      // Odpočet presne ako v auditoch
      let dni, color;
      if(g.daysToStart<=0){ dni='DNES'; color='#00d4ff'; }
      else { dni=g.daysToStart; color='#aaa'; }
      // Mená v jednom riadku, každé s vlastným ✎ na úpravu a ✕ na zmazanie
      const mena=g.people.map(p=>`<span onclick="editLeave('${p.id}')" title="upraviť" style="cursor:pointer;color:#8ab4ff;font-size:14px;">✎</span> ${p.name}`).join(',&nbsp; ');
      html+=`<tr style="border-bottom:1px solid rgba(255,255,255,0.1);">`+
        `<td style="padding:5px 6px;text-align:left;font-weight:bold;">${mena}</td>`+
        `<td style="padding:5px 6px;text-align:center;">${datum}</td>`+
        `<td style="padding:5px 6px;text-align:center;color:${color};font-weight:bold;">${dni}</td>`+
      `</tr>`;
    });
    html+=`</table>`;
    list.innerHTML=html;
  }
  positionLeaveBox();
}

function positionLeaveBox(){

  let S=1.6452230625;
  const tr=getComputedStyle(a).transform;
  const m=tr && tr.match(/matrix\(([^,]+),/);
  if(m){ const v=parseFloat(m[1]); if(v) S=v; }
  const offsetX=38 + 10*96/25.4;           // translateX(38px + 10mm)
  const centerX=a.offsetLeft + offsetX;     // vodorovný stred auditov
  const width=a.offsetWidth * S;            // vizuálna šírka auditov
  l.style.width=width+'px';
  l.style.left=(centerX - width/2)+'px';
  l.style.top=(a.offsetTop + a.offsetHeight * S + 14)+'px';
}

// Parsuje "dd.mm." alebo "dd.mm" / "dd/mm" na "YYYY-MM-DD". Rok sa doplní automaticky:
// ak by dátum v aktuálnom roku už bol viac ako 30 dní v minulosti, použije sa budúci rok.
function parseDDMM(str, explicitYear){
  if(!str) return '';
  const m=String(str).trim().match(/^(\d{1,2})[.\/](\d{1,2})\.?$/);
  if(!m) return '';
  const day=parseInt(m[1],10), month=parseInt(m[2],10);
  if(day<1||day>31||month<1||month>12) return '';
  let year;
  if(explicitYear){
    year=parseInt(explicitYear,10);
  } else {
    const now=new Date(); now.setHours(0,0,0,0);
    year=now.getFullYear();
    let candidate=new Date(year, month-1, day);
    const diffDays=(now-candidate)/(1000*60*60*24);
    if(diffDays>30){ year+=1; }
  }
  const mm=String(month).padStart(2,'0');
  const dd=String(day).padStart(2,'0');
  return `${year}-${mm}-${dd}`;
}

  if(dateEnd && dateEnd<date){ alert('Koniec nemôže byť pred začiatkom.'); return; }
  if(editingAuditId){
    const idx=auditData.findIndex(x=>x.id===editingAuditId);
    if(idx!==-1){ auditData[idx]={...auditData[idx], date, dateEnd, typ, zak}; }
    editingAuditId=null;
    const btn=document.querySelector('#auditFormRow button[onclick="addAudit()"]');
    if(btn) btn.textContent='Pridať';
    const delBtn=document.getElementById('auditDeleteBtn');
    if(delBtn) delBtn.style.display='none';
  } else {
    auditData.push({ id:Date.now().toString(), date, dateEnd, typ, zak });
  }
  saveAudits();
  dateEl.value=''; delete dateEl.dataset.year;
  dateEndEl.value=''; delete dateEndEl.dataset.year;
  document.getElementById('auditTyp').value='';
  document.getElementById('auditZak').value='';
  renderCustomAudits();
};

window.editAudit=function(id){
  const a=auditData.find(x=>x.id===id);
  if(!a) return;
  editingAuditId=id;
  const toDDMM=(iso)=>{ if(!iso) return ''; const p=iso.split('-'); return `${parseInt(p[2],10)}.${parseInt(p[1],10)}.`; };
  const toYear=(iso)=>{ if(!iso) return ''; return iso.split('-')[0]; };
  const dateEl=document.getElementById('auditDate');
  const dateEndEl=document.getElementById('auditDateEnd');
  dateEl.value=toDDMM(a.date); dateEl.dataset.year=toYear(a.date);
  dateEndEl.value=toDDMM(a.dateEnd); dateEndEl.dataset.year=toYear(a.dateEnd);
  document.getElementById('auditTyp').value=a.typ;
  document.getElementById('auditZak').value=a.zak||'';
  const btn=document.querySelector('#auditFormRow button[onclick="addAudit()"]');
  if(btn) btn.textContent='Uložiť';
  const delBtn=document.getElementById('auditDeleteBtn');
  if(delBtn) delBtn.style.display='inline-block';
  document.getElementById('auditTyp').focus();
};

window.deleteEditingAudit=function(){
  if(!editingAuditId) return;
  auditData=auditData.filter(x=>x.id!==editingAuditId);
  editingAuditId=null;
  saveAudits();
  const dateEl=document.getElementById('auditDate');
  const dateEndEl=document.getElementById('auditDateEnd');
  dateEl.value=''; delete dateEl.dataset.year;
  dateEndEl.value=''; delete dateEndEl.dataset.year;
  document.getElementById('auditTyp').value='';
  document.getElementById('auditZak').value='';
  const btn=document.querySelector('#auditFormRow button[onclick="addAudit()"]');
  if(btn) btn.textContent='Pridať';
  const delBtn=document.getElementById('auditDeleteBtn');
  if(delBtn) delBtn.style.display='none';
  renderCustomAudits();
};

function renderCustomAudits(){
  const formRow=document.getElementById('auditFormRow');
  if(!formRow) return;
  const today=new Date(); today.setHours(0,0,0,0);

  // Odstráň skončené (koniec auditu už prešiel)
  const before=auditData.length;
  auditData=auditData.filter(a=>{
    const e=parseLeaveDate(a.dateEnd||a.date); e.setHours(0,0,0,0);
    return e>=today;
  });
  if(auditData.length!==before) saveAudits();

  // Odstráň staré DOM riadky a vlož nanovo (zoradené čisto podľa dátumu začiatku) pred formulár
  document.querySelectorAll('tr.customAuditRow').forEach(r=>r.remove());
  auditData.slice().sort((a,b)=> parseLeaveDate(a.date)-parseLeaveDate(b.date)).forEach(a=>{
    const d=parseLeaveDate(a.date);
    let datum=`${d.getDate()}.${d.getMonth()+1}.`;
    if(a.dateEnd && a.dateEnd!==a.date){
      const dEnd=parseLeaveDate(a.dateEnd);
      // rovnaký mesiac -> "21-22.7.", inak "30.6.-2.7."
      if(d.getMonth()===dEnd.getMonth()){
        datum=`${d.getDate()}-${dEnd.getDate()}.${d.getMonth()+1}.`;
      } else {
        datum=`${d.getDate()}.${d.getMonth()+1}.-${dEnd.getDate()}.${dEnd.getMonth()+1}.`;
      }
    }
    const tr=document.createElement('tr');
    tr.className='customAuditRow';
    tr.style.borderBottom='1px solid rgba(255,255,255,0.1)';
    tr.innerHTML=
      `<td style="padding:8px;text-align:center;"><span onclick="editAudit('${a.id}')" title="upraviť" style="cursor:pointer;color:#8ab4ff;font-size:13px;">✎</span> ${datum}</td>`+
      `<td style="padding:8px;text-align:center;">${a.typ}</td>`+
      `<td style="padding:8px;text-align:center;">${a.zak||''}</td>`+
      `<td style="padding:8px;text-align:center;color:#00d4ff;" class="daysToAudit" data-date="${a.date}"${a.dateEnd?` data-end="${a.dateEnd}"`:''}>-</td>`;
    formRow.parentNode.insertBefore(tr, formRow);
  });
  // poloha tabuľky voľna sa môže zmeniť (zmena výšky auditov)
  if(typeof positionLeaveBox==='function') positionLeaveBox();
}

// PARSOVANIE ČLÁNKOV Z TERAZ.SK - PRIAME FETCHOVANIE
let newsArticles = [];
let newsCurrentIndex = 0;

function rotateNews() {
  if(newsArticles.length > 0) {
    document.getElementById('eventScroll').innerText = newsArticles[newsCurrentIndex];
    newsCurrentIndex = (newsCurrentIndex + 1) % newsArticles.length;
  }
}

async function loadRSSFeeds(){
  // RSS feedy teraz.sk (TASR) - viac kanálov pre 20 správ
  const rssUrls = [
    'https://www.teraz.sk/rss/vsetky-spravy.rss',
    'https://www.teraz.sk/rss/slovensko.rss',
    'https://www.teraz.sk/rss/zahranicie.rss'
  ];
  
  // CORS proxy servery (skúšame postupne kým jeden nezafunguje)
  const proxies = [
    'https://api.allorigins.win/raw?url=',
    'https://corsproxy.io/?url=',
    'https://api.codetabs.com/v1/proxy/?quest='
  ];
  
  // Funkcia na načítanie jedného feedu cez prvý fungujúci proxy
  async function nacitajFeed(rssUrl) {
    for(let proxy of proxies) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);
        const response = await fetch(proxy + encodeURIComponent(rssUrl), { signal: controller.signal });
        clearTimeout(timeoutId);
        if(response.ok) {
          const xmlText = await response.text();
          const xml = new DOMParser().parseFromString(xmlText, "text/xml");
          const items = xml.querySelectorAll('item');
          let titulky = [];
          items.forEach(item => {
            const titleEl = item.querySelector('title');
            if(titleEl) titulky.push(titleEl.textContent.trim());
          });
          if(titulky.length > 0) return titulky;
        }
      } catch(e) {
        console.log('Proxy zlyhalo: ' + proxy);
      }
    }
    return [];
  }
  
  // Načítaj všetky feedy a spoj ich (bez duplikátov)
  let newArticles = [];
  for(let url of rssUrls) {
    const titulky = await nacitajFeed(url);
    titulky.forEach(t => {
      if(t.length > 8 && !newArticles.includes(t)) {
        newArticles.push(t);
      }
    });
    if(newArticles.length >= 20) break; // máme dosť
  }
  
  // Ak máme aspoň nejaké články, ulož ich do globálneho poľa
  if(newArticles.length >= 3) {
    newsArticles = newArticles.slice(0, 30);
    newsCurrentIndex = 0;
    console.log('✓ Načítaných ' + newsArticles.length + ' správ z teraz.sk');
    rotateNews();
    return;
  }
  
  // Ak všetko zlyhalo - fallback
  console.log('Všetky feedy zlyhali, používam fallback');
  loadFallbackNews();
}

function loadFallbackNews(){
  const newsItems = [
    "Trump: Putin aj Zelenskyj sú otvorení riešeniu vojny na Ukrajine",
    "Európska únia začala oficiálne prístupové rokovania s Ukrajinou",
    "Španielski futbalisti prekvapivo remizovali s Kapverdami",
    "Europoslanci odobrili dohodu o právach cestujúcich v leteckej doprave",
    "Von der Leyenová: Ak Irán neurobí trvalé zmeny, sankcie EÚ sa nezrušia",
    "Orbán označil za smiešne obmedzenie funkčného obdobia premiéra",
    "PCA zamietol veľkú časť žaloby Kyjeva na Moskvu pre Kerčský prieliv"
  ];
  
  newsArticles = newsItems;
  newsCurrentIndex = 0;
  rotateNews();
}

// LIVE FEED 20 SPRÁV Z TERAZ.SK - QUEUE SYSTÉM
let newsQueue = [];

async function updateNewsQueue() {
  const rssUrl = 'https://www.teraz.sk/rss/vsetky-spravy.rss';
  const proxies = [
    'https://api.allorigins.win/raw?url=',
    'https://corsproxy.io/?url=',
    'https://api.codetabs.com/v1/proxy/?quest='
  ];
  
  for(let proxy of proxies) {
    try {
      const response = await fetch(proxy + encodeURIComponent(rssUrl), { signal: AbortSignal.timeout(5000) });
      if(response.ok) {
        const xmlText = await response.text();
        const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
        const items = xml.querySelectorAll('item');
        
        let freshNews = [];
        items.forEach(item => {
          const title = item.querySelector('title')?.textContent?.trim();
          if(title && title.length > 10) freshNews.push(title);
        });
        
        // Spracovanie queue: pridaj nové, odstráň staré
        freshNews.forEach(title => {
          if(!newsQueue.includes(title)) {
            newsQueue.unshift(title); // Nový na začiatok
            if(newsQueue.length > 20) newsQueue.pop(); // Najstarší sa vyhodí
          }
        });
        
        // Zobraz všetkých 20
        if(newsQueue.length > 0) {
          document.getElementById('eventScroll').innerText = newsQueue.join(' • ');
          console.log('✓ Queue: ' + newsQueue.length + ' správ');
        }
        return;
      }
    } catch(e) {}
  }
}

// ===== MINI DATE PICKER (deň.mesiac, bez roka) =====
let mdpTargetInput = null;
let mdpViewMonth = new Date().getMonth();
let mdpViewYear = new Date().getFullYear();

function mdpOpen(inputEl){
  mdpTargetInput = inputEl;
  const now = new Date();
  // Ak pole už má hodnotu dd.mm., otvor kalendár na tom mesiaci (a roku, ak je známy)
  const m = (inputEl.value||'').trim().match(/^(\d{1,2})[.\/](\d{1,2})\.?$/);
  if(m){
    mdpViewMonth = parseInt(m[2],10)-1;
    mdpViewYear = inputEl.dataset.year ? parseInt(inputEl.dataset.year,10) : now.getFullYear();
  } else {
    mdpViewMonth = now.getMonth();
    mdpViewYear = now.getFullYear();
  }
  mdpRender();
  const picker = document.getElementById('miniDatePicker');
  const rect = inputEl.getBoundingClientRect();
  picker.style.display = 'block';
  let top = rect.bottom + window.scrollY + 6;
  let left = rect.left + window.scrollX;
  // Zabráň pretečeniu mimo obrazovky vpravo
  if(left + 220 > window.innerWidth) left = window.innerWidth - 230;
  picker.style.top = top + 'px';
  picker.style.left = left + 'px';
}

function mdpClose(){
  document.getElementById('miniDatePicker').style.display = 'none';
  mdpTargetInput = null;
}

const MDP_MONTHS = ['Január','Február','Marec','Apríl','Máj','Jún','Júl','August','September','Október','November','December'];
const MDP_DOWS = ['Po','Ut','St','Št','Pi','So','Ne'];

function mdpRender(){
  const picker = document.getElementById('miniDatePicker');
  const firstDay = new Date(mdpViewYear, mdpViewMonth, 1);
  let startDow = firstDay.getDay(); // 0=Ne
  startDow = (startDow+6)%7; // posun na Po=0
  const daysInMonth = new Date(mdpViewYear, mdpViewMonth+1, 0).getDate();
  const now = new Date();

  // Rozsah výberu: od aktuálneho mesiaca, max 12 mesiacov dopredu
  const monthsFromNow = (mdpViewYear - now.getFullYear())*12 + (mdpViewMonth - now.getMonth());
  const canPrev = monthsFromNow > 0;
  const canNext = monthsFromNow < 12;

  let html = `<div class="mdpHeader">
    <span onclick="event.stopPropagation();mdpPrevMonth()" style="${canPrev?'':'visibility:hidden;'}">‹</span>
    <span style="cursor:default;">${MDP_MONTHS[mdpViewMonth]} ${mdpViewYear}</span>
    <span onclick="event.stopPropagation();mdpNextMonth()" style="${canNext?'':'visibility:hidden;'}">›</span>
  </div>`;
  html += `<div class="mdpGrid">`;
  MDP_DOWS.forEach(d=> html += `<div class="mdpDow">${d}</div>`);
  for(let i=0;i<startDow;i++) html += `<div class="mdpDay empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const isToday = (d===now.getDate() && mdpViewMonth===now.getMonth() && mdpViewYear===now.getFullYear());
    html += `<div class="mdpDay${isToday?' today':''}" onclick="event.stopPropagation();mdpSelect(${d})">${d}</div>`;
  }
  html += `</div>`;
  picker.innerHTML = html;
}

function mdpPrevMonth(){
  const now = new Date();
  const monthsFromNow = (mdpViewYear - now.getFullYear())*12 + (mdpViewMonth - now.getMonth());
  if(monthsFromNow <= 0) return;
  mdpViewMonth--;
  if(mdpViewMonth<0){ mdpViewMonth=11; mdpViewYear--; }
  mdpRender();
}
function mdpNextMonth(){
  const now = new Date();
  const monthsFromNow = (mdpViewYear - now.getFullYear())*12 + (mdpViewMonth - now.getMonth());
  if(monthsFromNow >= 12) return;
  mdpViewMonth++;
  if(mdpViewMonth>11){ mdpViewMonth=0; mdpViewYear++; }
  mdpRender();
}
window.mdpPrevMonth = mdpPrevMonth;
window.mdpNextMonth = mdpNextMonth;
window.mdpSelect = function(day){
  if(mdpTargetInput){
    mdpTargetInput.value = `${day}.${mdpViewMonth+1}.`;
    mdpTargetInput.dataset.year = mdpViewYear;
    mdpTargetInput.dispatchEvent(new Event('input'));
  }
  mdpClose();
};

// Zatvor picker pri kliknutí mimo neho
document.addEventListener('click', (e)=>{
  const picker = document.getElementById('miniDatePicker');
  if(picker.style.display==='block' && !picker.contains(e.target) && e.target!==mdpTargetInput){
    mdpClose();
  }
});

['auditDate','auditDateEnd','leaveStart','leaveEnd'].forEach(id=>{
