<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap" rel="stylesheet">

<style>
html, body { height:100%; }
body {
    margin:0;
    /* Neutrálny sivý podklad – bez zelenej z referenčného obrázka. */
    background: #30343a;
    background-image:
        radial-gradient(ellipse at 12% 15%, rgba(255,255,255,0.075), transparent 45%),
        radial-gradient(ellipse at 88% 82%, rgba(0,0,0,0.14), transparent 48%),
        linear-gradient(145deg, #383c42 0%, #30343a 55%, #282c32 100%);
    color:white;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    position: relative;
    overflow: hidden;
    min-height: 100vh;
    padding-top: env(safe-area-inset-top);
}

#stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    transform-origin: top left;
    z-index: 2;
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: none;
    pointer-events: none;
    z-index: 1;
}

@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Mliečne sivé sklo podľa referencie: bez zeleného tónovania. */
.glass {
    background: linear-gradient(135deg,
        rgba(255,255,255,0.22) 0%,
        rgba(232,235,240,0.13) 52%,
        rgba(255,255,255,0.16) 100%);
    backdrop-filter:blur(38px) saturate(125%);
    -webkit-backdrop-filter:blur(38px) saturate(125%);
    border:1px solid rgba(255,255,255,0.27);
    border-radius:24px;
    padding:15px;
    box-shadow:
        0 12px 30px rgba(0,0,0,0.27),
        0 0 24px rgba(255,255,255,0.045),
        inset 0 1px 1px rgba(255,255,255,0.23),
        inset 0 -1px 0 rgba(255,255,255,0.055);
}

.glow {text-shadow:0 0 15px rgba(255,255,255,0.4);}

#location {position:absolute;top:1px;left:40px;font-size:109px;}
#tempNow {display:none!important;margin-top:0px;font-size:34px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;font-weight:400;}

#clock-box {position:absolute;top:-37px;right:40px;text-align:right;}
#time {font-size:170px;}
#dateWeek {font-size:40px;margin-top:-38px;white-space:nowrap;}

#weather {position:absolute;top:219px;left:40px;font-size:28px;line-height:1.8;width:auto;white-space:nowrap;height:50px;display:flex;align-items:center;display:none;}
#forecast3days {position:absolute;top:147px;left:40px;width:501px;box-sizing:border-box;}
#sun {position:absolute;top:516px;left:40px;width:501px;box-sizing:border-box;font-size:28px;text-align:left;line-height:1.5;}
#nameday {position:absolute;width:501px;min-width:0;font-size:28px;text-align:left;padding-left:25px;white-space:nowrap;box-sizing:border-box;}

#world{
    position:absolute;
    width:auto;
    box-sizing: border-box;
}

/* Kompaktný pracovný časovač vo veľkosti približne bloku hodín */
#shiftBox{
    position:absolute;top:21px;left:605px;width:580px;
    box-sizing:border-box;padding:6px 9px !important;
    text-align:left;backdrop-filter:none;-webkit-backdrop-filter:none;
}
#shiftBox .workdayHeader{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;}
#shiftBox .workdayTitle{font-size:16px;font-weight:700;color:#fff;white-space:nowrap;}
#shiftBox .workdayHours{font-size:14px;font-weight:600;color:#fff;white-space:nowrap;}
#shiftBox .workdayGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;}
#shiftBox .workCard{box-sizing:border-box;min-width:0;min-height:112px;position:relative;
    background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.06));
    border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 30px 13px 10px;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10);}
#shiftBox .workIcon{font-size:23px;line-height:1;opacity:.95;flex-shrink:0;}
#shiftBox .workLabel{font-size:17px;line-height:1.12;color:#fff;opacity:.95;text-align:center;min-height:15px;}
#shiftBox .workValue{font-size:34px;line-height:1.05;font-weight:700;color:#fff;margin-top:4px;letter-spacing:.3px;white-space:nowrap;}
#shiftBox .workHint{font-size:14px;line-height:1.25;color:#fff;opacity:.9;margin-top:5px;margin-bottom:12px;min-height:18px;text-align:center;white-space:normal;overflow-wrap:break-word;}
#shiftBox .workBar{position:absolute;top:12px;right:10px;bottom:12px;width:7px;height:auto;box-sizing:border-box;border-radius:99px;background:rgba(0,0,0,.48);overflow:hidden;margin:0;}
#shiftBox .workBarFill{position:absolute;bottom:0;left:0;right:0;display:block;width:100%;border-radius:99px;background:#63a9ff;transition:height .4s ease;}
#shiftBox .workBarFill.lunch{background:#f0be62;}
#shiftBox .workBarFill.warn{background:#ff9b57 !important;}
#shiftBox .workValue.warn{color:#ffd2ad;}
#shiftBox .workdayFooter{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px;font-size:13px;font-weight:600;color:#fff;white-space:nowrap;}
#shiftBox .workdayFooter .right{color:#7dff98;}
#shiftBox .workdayFooter .muted{opacity:.9;}
#shiftBox .workCard.done .workValue{font-size:27px;}
#shiftBox .workCard.done .workHint{opacity:.88;}
#shiftBox .workMain{display:flex;justify-content:center;align-items:center;gap:9px;min-height:45px;margin-top:5px;width:100%;}
#shiftBox .workMain .workValue{margin-top:0;min-width:0;}

#shiftBanners {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:48px;
    font-weight:bold;
    text-align:center;
    z-index:100;
}

#currentWeatherBox{
    position:absolute;
    top:175px;
    left:40px;
    font-size:28px;
    text-align:left;
    width:auto;
    white-space:nowrap;
    height:34px;
    display:flex;
    align-items:center;
}

#vacationBox{
    position:absolute;
    top:12px;
    left:1080px;
    width:144px;
    font-size:28px;
    text-align:center;
    padding:11px 6px;
    box-sizing:border-box;
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
}
#vacationTime{font-size:28px;color:white;line-height:1.3;}

#holidayBox{
    position:absolute;
    width:501px;
    font-size:42px;
    text-align:left;
    padding-left:25px;
    box-sizing:border-box;
}
#holidayDisplay{font-size:28px;color:white;line-height:1.3;}

#leaveBox{
    position:absolute;
    top:0;
    left:0;
    box-sizing:border-box;
}

#auditsTable {
    position:absolute;
    top:210px;
    left:50%;
    transform:translateX(calc(-50% - 29.4px)) scale(1.6452230625);
    transform-origin:center top;
    width:auto;
    min-width:300px;
    max-width:419px;
    font-size:14px;
    text-align:center;
}

#miniDatePicker{
    position:absolute;
    z-index:9999;
    background:rgba(30,20,60,0.97);
    backdrop-filter:blur(20px) saturate(180%);
    border:1.5px solid rgba(255,255,255,0.3);
    border-radius:12px;
    padding:10px;
    box-shadow:0 8px 32px rgba(0,0,0,0.5);
    display:none;
    width:220px;
    font-size:13px;
    color:#fff;
}
#miniDatePicker .mdpHeader{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:bold;}
#miniDatePicker .mdpHeader span{cursor:pointer;padding:2px 8px;border-radius:4px;}
#miniDatePicker .mdpHeader span:hover{background:rgba(255,255,255,0.15);}
#miniDatePicker .mdpGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;}
#miniDatePicker .mdpDow{color:#aaa;font-size:11px;padding:2px 0;}
#miniDatePicker .mdpDay{padding:4px 0;border-radius:6px;cursor:pointer;}
#miniDatePicker .mdpDay:hover{background:#00d4ff;color:#001a33;}
#miniDatePicker .mdpDay.empty{cursor:default;}
#miniDatePicker .mdpDay.empty:hover{background:none;}
#miniDatePicker .mdpDay.today{outline:1px solid #00d4ff;}
/* Radio inherits the same glass surface as all dashboard panels. */
#radioPanel{position:absolute;box-sizing:border-box;padding:15px;color:#fff;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 12px;overflow:auto;scrollbar-width:thin;}
#radioPanel button,#radioPanel input{font:inherit;box-sizing:border-box;}
.radioHeading{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;font-size:18px;line-height:22px;}.radioHeading span{font-size:11px;letter-spacing:1px;color:#aaa;}
#radioStations{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;}
#radioPanel button{cursor:pointer;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.10);color:#fff;border-radius:8px;padding:6px 4px;font-size:14px;font-weight:600;line-height:18px;}
#radioPanel button:hover{background:rgba(255,255,255,.22);}#radioPanel button:focus-visible,#radioPanel input:focus-visible{outline:2px solid #00d4ff;outline-offset:2px;}
#radioStations button{font-size:13px;white-space:nowrap;}
#radioStations button[aria-pressed="true"]{background:rgba(75,155,255,.27);color:#d2e8ff;border-color:#60a8ff;box-shadow:inset 0 1px 0 rgba(255,255,255,.15);} 
.radioRotation{
    grid-column:1/-1;
    display:flex;
    flex-direction:row;
    flex-wrap:nowrap; /* Nastavenia a hodinový odpočet sú v jednom riadku. */
    align-items:center;
    gap:12px;
    min-width:0;
    font-size:12px;
    line-height:18px;
    padding:5px 7px;
    border:1px solid rgba(255,255,255,0.10);
    border-radius:12px;
    background:rgba(255,255,255,0.045);
}
.radioRotation label{display:inline-flex;flex:0 0 auto;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;}
.radioRotation input{accent-color:#4b9bff;margin:0;width:16px;height:16px;flex:none;}
.radioRotation small{
    display:block;
    margin-left:auto;
    min-width:0;
    flex:0 1 auto;
    font-size:12px;
    font-variant-numeric:tabular-nums;
    color:#d1e3ff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-align:right;
}
.radioControls{grid-column:1/-1;display:flex;align-items:center;gap:7px;min-width:0;}#radioPlay{border-radius:50%!important;width:34px;height:34px;flex-shrink:0;background:rgba(75,155,255,.27)!important;color:#d2e8ff!important;font-size:17px!important;padding:0!important;}#radioMute{background:transparent!important;border:0!important;font-size:16px!important;padding:2px!important;}#radioVolume{flex:1;width:0;min-width:0;accent-color:#4b9bff;}#radioVolumeLabel{width:37px;flex-shrink:0;font-size:12px;}
.radioFooter{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#aaa;line-height:16px;}#radioStatus{flex:1;min-width:0;}#radioWebsite{color:#8ab4ff;white-space:nowrap;}


/* ===== Motív bližší referenčnému obrázku ===== */
:root{
    --glass-fill-1: rgba(234,241,241,0.18);
    --glass-fill-2: rgba(88,111,118,0.17);
    --glass-fill-3: rgba(128,108,95,0.15);
    --glass-border: rgba(255,255,255,0.18);
    --glass-highlight: rgba(255,255,255,0.18);
    --soft-text: rgba(255,255,255,0.92);
    --muted-text: rgba(229,232,236,0.72);
    --accent-blue: #4e97ff;
    --accent-blue-soft: rgba(78,151,255,0.24);
}
body{
    background:
      radial-gradient(ellipse at 15% 20%, rgba(27,110,94,0.48) 0%, rgba(27,110,94,0.18) 20%, transparent 42%),
      radial-gradient(ellipse at 48% 18%, rgba(8,46,55,0.78) 0%, rgba(8,46,55,0.35) 28%, transparent 56%),
      radial-gradient(ellipse at 92% 18%, rgba(90,66,48,0.42) 0%, rgba(90,66,48,0.20) 22%, transparent 48%),
      linear-gradient(180deg, #071215 0%, #183740 14%, #24434a 28%, #434449 54%, #76675f 76%, #5d4a41 100%) !important;
    color: var(--soft-text) !important;
}
body::before{
    background:
      radial-gradient(circle at 11% 54%, rgba(123,188,111,0.26) 0%, rgba(123,188,111,0.12) 10%, transparent 24%),
      radial-gradient(circle at 48% 73%, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.05) 10%, transparent 21%),
      linear-gradient(90deg, transparent 0%, transparent 73%, rgba(54,32,22,0.34) 73.5%, rgba(54,32,22,0.34) 74.6%, transparent 74.6%, transparent 100%);
    opacity: 1;
}
body::after{
    content:'';
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:32%;
    pointer-events:none;
    z-index:0;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.00) 0%, rgba(255,255,255,0.06) 8%, rgba(0,0,0,0.10) 100%),
      repeating-linear-gradient(90deg,
        rgba(103,77,61,0.88) 0px, rgba(103,77,61,0.88) 118px,
        rgba(83,60,48,0.90) 118px, rgba(83,60,48,0.90) 124px,
        rgba(128,100,80,0.86) 124px, rgba(128,100,80,0.86) 242px,
        rgba(95,71,57,0.88) 242px, rgba(95,71,57,0.88) 248px);
    box-shadow: inset 0 18px 55px rgba(255,255,255,0.05);
}
#stage{ z-index:2; }
#stage::before{
    content:'';
    position:absolute;
    inset:18px;
    border-radius:34px;
    background: linear-gradient(145deg, rgba(238,243,244,0.08), rgba(66,86,95,0.12) 45%, rgba(110,92,80,0.08));
    filter: blur(2px);
    pointer-events:none;
    z-index:-1;
}
.glass,
#currentWeatherBox,
#apiStatusPanel{
    background: linear-gradient(145deg,
      rgba(234,241,241,0.17) 0%,
      rgba(73,92,98,0.20) 44%,
      rgba(118,101,90,0.18) 100%) !important;
    backdrop-filter: blur(34px) saturate(120%) !important;
    -webkit-backdrop-filter: blur(34px) saturate(120%) !important;
    border: 1px solid var(--glass-border) !important;
    box-shadow:
      0 16px 34px rgba(6,13,17,0.28),
      inset 0 1px 0 rgba(255,255,255,0.20),
      inset 0 -1px 0 rgba(255,255,255,0.05),
      0 0 0 1px rgba(255,255,255,0.03) !important;
    color: var(--soft-text);
}
.glass{ border-radius:28px !important; }
#forecast3days, #sun, #nameday, #holidayBox, #world, #radioPanel, #leaveBox, #auditsTable, #shiftBox, #vacationBox{
    overflow:hidden;
}
#currentWeatherBox{
    padding: 8px 18px !important;
    height:auto !important;
    min-height:34px;
    border-radius:18px !important;
}
#location, #time, .radioHeading strong{ color:#f4f7f8; }
#tempNow, #dateWeek, #holidayDisplay, #vacationTime, #currentWeatherDisplay,
#world td, #forecast3days td, #nameday, #sun, #leaveList, #radioStatus, #radioVolumeLabel{
    color:var(--soft-text) !important;
}
#radioPanel .radioHeading span,
#radioRotationStatus,
.radioFooter,
#world td:last-child,
#forecast3days td:last-child,
#dateWeek,
#auditsTable th,
#auditsTable td,
#leaveAddRow,
#auditAddRow,
#vacationTime span,
#holidayDisplay span,
#nameday hr + *{
    color: var(--muted-text) !important;
}
#radioPanel button,
#radioPanel a,
#leaveBox button,
#auditsTable button,
#miniDatePicker .mdpHeader span,
#miniDatePicker .mdpDay,
#apiStatusPanel button{
    background: linear-gradient(145deg, rgba(255,255,255,0.16), rgba(255,255,255,0.07)) !important;
    border: 1px solid rgba(255,255,255,0.17) !important;
    color: #f4f7f8 !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 8px 20px rgba(0,0,0,0.18) !important;
}
#radioPanel button:hover,
#leaveBox button:hover,
#auditsTable button:hover,
#miniDatePicker .mdpHeader span:hover,
#miniDatePicker .mdpDay:hover,
#apiStatusPanel button:hover{
    background: linear-gradient(145deg, rgba(255,255,255,0.21), rgba(255,255,255,0.10)) !important;
}
#radioStations button[aria-pressed="true"],
#radioPlay,
#auditAddRow,
#leaveAddRow{
    background: linear-gradient(145deg, rgba(78,151,255,0.42), rgba(78,151,255,0.19)) !important;
    border-color: rgba(129,186,255,0.55) !important;
    color:#f9fcff !important;
}
#radioMute{ background: linear-gradient(145deg, rgba(255,255,255,0.16), rgba(255,255,255,0.08)) !important; border:1px solid rgba(255,255,255,0.17) !important; border-radius:50% !important; }
#radioVolume{ accent-color: var(--accent-blue); }
#radioRotate, #radioSchedule{ accent-color: var(--accent-blue); }
#radioWebsite{ color:#d7e7ff !important; }
#apiStatusIndicator{
    background: linear-gradient(145deg, rgba(255,255,255,0.38), rgba(255,255,255,0.14)) !important;
    border:1px solid rgba(255,255,255,0.26) !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), 0 8px 20px rgba(0,0,0,0.25) !important;
    backdrop-filter: blur(18px) saturate(120%);
    -webkit-backdrop-filter: blur(18px) saturate(120%);
}
#apiStatusPanel{
    border-radius:16px !important;
    color:#f3f6f7 !important;
}
#miniDatePicker{
    background: linear-gradient(145deg, rgba(47,63,69,0.94), rgba(91,82,79,0.92)) !important;
    border:1px solid rgba(255,255,255,0.18) !important;
}
#miniDatePicker .mdpDay.today{ outline:1px solid rgba(129,186,255,0.9) !important; }
#auditsTable table,
#world table,
#forecast3days table{
    color:var(--soft-text);
}
#auditsTable tr,
#world tr,
#forecast3days tr,
#nameday hr,
#sun hr{
    border-color: rgba(255,255,255,0.12) !important;
}
/* Jemný mliečny vzhľad ikon/ovládania aj mimo panelov */
img, canvas {
    border-radius: 12px;
}


/* Jemne modré pozadie bez plota alebo drevenej podlahy. */
body {
    background:
      radial-gradient(ellipse at 12% 21%, rgba(37, 115, 158, 0.45) 0%, transparent 42%),
      radial-gradient(ellipse at 87% 22%, rgba(41, 83, 150, 0.35) 0%, transparent 49%),
      radial-gradient(ellipse at 54% 73%, rgba(102, 155, 202, 0.20) 0%, transparent 52%),
      linear-gradient(155deg, #0b1c32 0%, #153c61 30%, #27577e 59%, #496b8e 100%) !important;
}
body::before {
    background:
      radial-gradient(ellipse at 19% 54%, rgba(180, 213, 245, 0.08) 0%, transparent 47%),
      radial-gradient(ellipse at 82% 78%, rgba(179, 214, 255, 0.09) 0%, transparent 45%) !important;
    opacity: 1;
}
body::after { display:none !important; content:none !important; }
#stage::before {
    background: linear-gradient(145deg, rgba(219,237,255,0.09), rgba(80,125,164,0.09) 45%, rgba(154,184,215,0.06)) !important;
}
/* Rovnaké mliečne sklo, ale s chladným modrastým nádychom. */
.glass, #apiStatusPanel {
    background: linear-gradient(145deg,
        rgba(223,239,253,0.19) 0%,
        rgba(86,124,165,0.22) 45%,
        rgba(129,161,199,0.16) 100%) !important;
}
/* Prázdne okienko pri aktuálnej teplote vytváralo osamotenú guľôčku. */
#currentWeatherBox { display:none !important; }


/* Rádio: kratší posuvník a viac miesta pre stanicu / aktuálnu skladbu. */
#radioVolume{flex:0 0 138px !important;width:138px !important;max-width:138px !important;}
#radioVolumeLabel{width:34px !important;}
.radioFooter{align-items:center;min-width:0;gap:10px;flex-wrap:nowrap;}
#radioStatus{flex:0 1 auto !important;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;}
#radioNowPlaying{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:#dceaff !important;}
#radioNowPlaying:not([hidden])::before{content:'♪ ';color:#8dbfff;}
#radioNowPlaying[hidden]{display:none !important;}
#radioWebsite{flex:0 0 auto;font-size:12px;}


/* Aktuálna skladba je priamo za ovládaním hlasitosti; spodný riadok je skrytý,
   pričom stavové prvky ostávajú v DOM pre pôvodnú logiku prehrávača. */
#radioPanel .radioFooter{display:none !important;}
#radioPanel .radioControls{display:flex;min-width:0;gap:8px;}
#radioPanel #radioVolume{flex:0 0 138px !important;width:138px !important;min-width:0;}
#radioPanel #radioVolumeLabel{flex:0 0 36px !important;width:36px !important;white-space:nowrap;}
#radioPanel #radioNowPlaying{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;font-size:13px;color:#e6f1ff !important;}
#radioPanel #radioNowPlaying[hidden]{display:none !important;}


/* Jednotné nadpisy panelov v štýle hlavičky rádia. */
.dashboardSectionTitle {
    display:flex;align-items:center;min-height:22px;
    margin:0 0 10px 0; font-size:18px;line-height:22px;
    font-weight:700;color:#f4f7f8;letter-spacing:0;justify-content:center;text-align:center;
}
.radioHeading{justify-content:center !important;position:relative;text-align:center;}
.radioHeading strong{display:block;width:100%;text-align:center;}
.radioHeading span{position:absolute;right:0;top:50%;transform:translateY(-50%);}
/* Všetky hlavičky stĺpcov auditov sú výrazne tučné. */
#auditsTable table tr:first-child th {font-weight:800 !important; color:#fff !important;}
/* Auditový panel je zväčšovaný cez transform(scale), preto menšie základné písmo. */
.auditSectionTitle {font-size:12px;line-height:15px;min-height:15px;margin-bottom:8px;}

/* Jemné červené zvýraznenie celého riadku pri udalostiach do 24 hodín. */
#stage tr.event-soon > td {
  background-color: rgba(255, 128, 140, 0.20) !important;
  border-top: 1px solid rgba(255, 175, 183, 0.24);
  border-bottom: 1px solid rgba(255, 175, 183, 0.24);
}
#stage tr.event-soon > td:first-child { border-radius: 9px 0 0 9px; }
#stage tr.event-soon > td:last-child { border-radius: 0 9px 9px 0; }

/* Lepšia čitateľnosť rádia – bez zmeny pozícií ostatných panelov. */
#radioPanel .radioHeading { font-size:21px !important; line-height:27px !important; }
#radioPanel .radioHeading span { font-size:13px !important; }
#radioPanel #radioStations { gap:8px !important; }
#radioPanel #radioStations button {
  font-size:16px !important;
  line-height:21px !important;
  padding:8px 3px !important;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
#radioPanel .radioRotation {
  font-size:15px !important;
  line-height:22px !important;
  gap:10px !important;
  padding:7px 8px !important;
}
#radioPanel .radioRotation label { gap:6px !important; }
#radioPanel .radioRotation input { width:18px !important; height:18px !important; }
#radioPanel #radioRotationStatus { font-size:15px !important; line-height:22px !important; }
#radioPanel .radioControls { gap:10px !important; min-height:40px; }
#radioPanel #radioPlay { width:39px !important; height:39px !important; font-size:19px !important; }
#radioPanel #radioMute { font-size:20px !important; }
#radioPanel #radioVolume { flex:0 0 112px !important; width:112px !important; max-width:112px !important; }
#radioPanel #radioVolumeLabel { flex:0 0 47px !important; width:47px !important; font-size:16px !important; }
#radioPanel #radioNowPlaying {
  flex:1 1 0 !important;
  min-width:0;
  font-size:18px !important;
  line-height:25px !important;
  font-weight:500;
  letter-spacing:0.1px;
  color:#f2f7ff !important;
}


/* Tri nasledujúce sviatky + Vianoce v spoločnom paneli */
#holidayBox{padding:14px 18px!important;}
#holidayDisplay{font-size:20px!important;line-height:1.35!important;}
.holidayHeading{text-align:center;font-size:21px;font-weight:700;margin-bottom:8px;}
.holidayRow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.12);}
.holidayName{min-width:0;flex:1;font-size:19px;overflow-wrap:break-word;}
.holidayWhen{font-size:18px;white-space:nowrap;flex-shrink:0;color:#e4eaf0;}
.holidayChristmas{margin-top:7px;border-top:1px solid rgba(255,255,255,.20);}
.holidayChristmas .holidayRow{border-bottom:0;}
.holidayChristmas .holidayName{font-weight:600;}


/* Sviatky: dátum | názov | zostávajúci čas */
#holidayBox .holidayRow{
    display:grid !important;
    grid-template-columns:108px minmax(0,1fr) 84px;
    align-items:center;
    column-gap:10px;
}
#holidayBox .holidayName{font-size:clamp(14px,1.0vw,19px);min-width:0;overflow-wrap:anywhere;}
#holidayBox .holidayDate{font-size:clamp(13px,.94vw,18px);white-space:nowrap;text-align:center;font-variant-numeric:tabular-nums;}
#holidayBox .holidayWhen{font-size:clamp(13px,.94vw,18px);text-align:right;white-space:nowrap;}
/* Celý text dashboardu biely; priehľadné plochy a stavové bodky nemeníme. */
#stage :is(h1,h2,h3,h4,h5,h6,p,span,small,div,table,thead,tbody,tr,th,td,label,button,a,output,input,select,option){
    color:#fff !important;
}
#stage input[type=range], #stage input[type=checkbox]{accent-color:#4e97ff;}


/* Adaptívne tabuľky, bez prekrývania pri dlhých názvoch a dátumoch. */
#forecast3days table,#world table,#auditsTable table,#leaveList table {width:100%;table-layout:fixed;}
#forecast3days td,#world td,#auditsTable td,#leaveList td {min-width:0;white-space:nowrap;overflow:hidden;text-overflow:clip;box-sizing:border-box;}
#holidayBox .holidayRow {min-width:0;}
#holidayBox .holidayRow > span {min-width:0;white-space:nowrap;overflow:hidden;}

/* Čitateľné a konzistentné tabuľky: pevné stĺpce, individuálne prispôsobenie obsahu */
#auditsTable table, #leaveList table {table-layout:fixed;width:100%;}
#auditsTable td, #leaveList td {box-sizing:border-box;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:clip;font-weight:400;}
#auditsTable tr:not(#auditFormRow) td {padding-left:5px!important;padding-right:5px!important;}
#leaveList td {padding-left:3px!important;padding-right:3px!important;}
#leaveList .leaveNamesCell span{font-size:inherit!important;}

/* Dnešná karta + tri dni pod ňou */
#sun{display:none!important;}
#forecast3days{padding:15px!important;overflow:hidden;}
#forecast3days .weatherToday,#forecast3days .weatherDayCard{color:white;box-sizing:border-box;min-width:0;}
#forecast3days .weatherToday{border-radius:21px;padding:16px 18px;background:linear-gradient(135deg,rgba(99,164,218,.48),rgba(85,146,199,.26));border:1px solid rgba(255,255,255,.20);}
.weatherTodayTop{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:19px;}
.weatherTodayTop span{font-size:15px;}
.weatherTodayMain{display:flex;justify-content:space-between;align-items:center;gap:6px;min-width:0;margin:9px 0;}
.weatherMainTemp{font-size:83px;line-height:1;font-weight:650;letter-spacing:-3px;}
.weatherTempLine{display:flex;align-items:center;gap:14px;min-width:0;}
.weatherTempLine .weatherTempRange{font-size:32px;line-height:1.18;white-space:nowrap;font-weight:750;letter-spacing:-1px;}
.weatherMainIcon{font-size:68px;line-height:1.25;flex:none;}
.weatherTempRange{font-size:16px;line-height:1.45;white-space:nowrap;}
.weatherTodayDetails{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;border-top:1px solid rgba(255,255,255,.2);padding-top:12px;font-size:16px;}
.weatherTodayDetails span{min-width:0;white-space:nowrap;}
.weatherTodayDetails b{font-weight:600;}
.weatherNextDays{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px;}
.weatherDayCard{border-radius:18px;padding:12px 4px 13px;text-align:center;background:rgba(19,36,57,.37);border:1px solid rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;gap:8px;overflow:hidden;}
.weatherDayName{font-weight:650;font-size:16px;white-space:nowrap;}
.weatherDayIcon{font-size:38px;line-height:1.2;}
.weatherDayTemp{font-size:24px;font-weight:700;white-space:nowrap;}
.weatherDayTemp span{font-size:15px;font-weight:400;}
.weatherDayRain,.weatherDayWind,.weatherDayMm{font-size:15px;white-space:nowrap;}
@media(max-width:700px){.weatherMainTemp{font-size:70px;}}


/* Karty svetových miest: mriežka 2 × 2, čas a teplota stále viditeľné */
#world{padding:14px!important;box-sizing:border-box;}
.worldSectionTitle{margin-bottom:12px!important;}
.worldTiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;}
.worldTile{cursor:pointer;min-width:0;min-height:116px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;padding:12px 14px;border-radius:19px;background:linear-gradient(145deg,rgba(16,27,43,.52),rgba(32,45,62,.40));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px rgba(255,255,255,.08);}
.worldTile:hover{background:linear-gradient(145deg,rgba(44,71,102,.7),rgba(39,56,79,.55));}
.worldTileTop{display:flex;align-items:center;justify-content:space-between;gap:5px;min-width:0;}
.worldCountry{font-size:13px;color:white;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.worldClock{font-size:17px;font-weight:700;color:white;white-space:nowrap;}
.worldCity{font-size:22px;font-weight:650;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.worldTileBottom{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.worldWeatherIcon{font-size:29px;line-height:1;}
.worldTemperature{font-size:29px;font-weight:700;color:white;white-space:nowrap;}
.weatherTempLine .weatherTempRange{font-size:32px!important;line-height:1.16!important;font-weight:750!important;}
#forecast3days{top:147px!important;}


/* Usporiadanie dneška: piktogram | max/min | aktuálna teplota */
#forecast3days .weatherTodayMain{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.18fr) minmax(0,1.28fr);gap:7px;align-items:center;justify-content:initial;}
#forecast3days .weatherMainIcon{font-size:60px;text-align:center;white-space:nowrap;min-width:0;}
#forecast3days .weatherTodayMain>.weatherTempRange{font-size:27px!important;font-weight:740!important;line-height:1.24!important;letter-spacing:-.7px;white-space:nowrap;text-align:center;min-width:0;}
#forecast3days .weatherCurrentBlock{min-width:0;text-align:right;}
#forecast3days .weatherMainTemp{font-size:74px;letter-spacing:-3px;white-space:nowrap;}
#forecast3days .weatherFeels{font-size:13px;font-weight:400;white-space:nowrap;}
/* Svetové časy: štát/mesto/veľký čas vľavo, ikona nad menšou teplotou vpravo */
.worldTile{display:grid;grid-template-columns:minmax(0,1fr) 62px;align-items:center;gap:5px;min-height:128px;}
.worldTileInfo{min-width:0;display:flex;flex-direction:column;gap:5px;align-items:flex-start;}
.worldCountry{font-size:14px;}
.worldCity{font-size:19px;max-width:100%;}
.worldClock{font-size:27px;font-weight:750;letter-spacing:-.7px;line-height:1.18;}
.worldTileBottom{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;}
.worldWeatherIcon{font-size:32px;line-height:1.2;}
.worldTemperature{font-size:21px;font-weight:650;}


/* Dnešná teplota znova vľavo, max/min uprostred, piktogram vpravo. */
#forecast3days .weatherTodayMain{
    display:grid;
    grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) minmax(0,.9fr);
    align-items:center;
    column-gap:7px;
}
#forecast3days .weatherCurrentBlock{text-align:left;grid-column:1;grid-row:1;}
#forecast3days .weatherTodayMain>.weatherTempRange{grid-column:2;grid-row:1;font-size:26px!important;}
#forecast3days .weatherMainIcon{grid-column:3;grid-row:1;font-size:59px;text-align:center;}
/* Kompaktnejšie svetové časy, bez straty výrazných hodín. */
#world{padding:10px 12px!important;}
#world .worldSectionTitle{margin-bottom:7px!important;}
#world .worldTiles{gap:7px;}
#world .worldTile{min-height:91px;padding:7px 10px;border-radius:16px;gap:3px;grid-template-columns:minmax(0,1fr) 49px;}
#world .worldTileInfo{gap:2px;}
#world .worldCountry{font-size:12px;}
#world .worldCity{font-size:17px;}
#world .worldClock{font-size:25px;line-height:1.05;}
#world .worldTileBottom{gap:3px;}
#world .worldWeatherIcon{font-size:25px;line-height:1;}
#world .worldTemperature{font-size:18px;}
#world.worldCompact .worldTile{min-height:78px;padding:5px 8px;}
#world.worldCompact .worldClock{font-size:22px;}
#world.worldCompact .worldCity{font-size:15px;}
#world.worldCompact .worldWeatherIcon{font-size:22px;}
#world.worldCompact .worldTemperature{font-size:16px;}


/* Pracovne casovace: bez horizontálneho prelínania pozadia a mimo dátumu. */
#shiftBox{
    top:25px !important;
    left:605px !important;
    width:490px !important;
    padding:5px 7px !important;
    background:#356c9c !important;
    backdrop-filter:none !important;
    -webkit-backdrop-filter:none !important;
    isolation:isolate;
    box-shadow:0 8px 20px rgba(0,0,0,.18), inset 0 1px rgba(255,255,255,.17) !important;
    border:1px solid rgba(255,255,255,.28) !important;
    z-index:8;
}
#shiftBox .workdayGrid{gap:7px;}
#shiftBox .workCard{
    background:#4279aa !important;
    background-image:none !important;
    backdrop-filter:none !important;
    -webkit-backdrop-filter:none !important;
    border-color:rgba(255,255,255,.15) !important;
    min-height:102px !important;
    padding:9px 20px 10px 6px !important;
    overflow:hidden;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12) !important;
}
#shiftBox .workLabel{font-size:14px !important;white-space:normal;}
#shiftBox .workValue{font-size:29px !important;letter-spacing:0 !important;}
#shiftBox .workCard.done .workValue{font-size:24px !important;}
#shiftBox .workMain{gap:5px !important;min-height:38px !important;margin-top:3px !important;}
#shiftBox .workIcon{font-size:20px !important;}
#shiftBox .workHint{font-size:12px !important;margin-top:2px !important;margin-bottom:2px !important;min-height:16px !important;}
#shiftBox .workBar{right:7px !important;top:10px !important;bottom:10px !important;}
#shiftBox, #shiftBox *{animation:none !important;}


#holidayAddRow{cursor:pointer;color:#fff;text-align:center;padding:7px 3px 2px;font-size:17px;}
#holidayFormRow{display:none;flex-wrap:wrap;align-items:center;gap:7px;margin-top:8px;}
#holidayFormRow input,#holidayFormRow button{box-sizing:border-box;min-width:0;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:6px 8px;font-size:15px;}
#holidayCustomName{flex:2 1 175px;}
#holidayCustomDate{flex:1 1 155px;color-scheme:dark;}
#holidayFormRow button{flex:1 1 auto;cursor:pointer;}
#holidayBox .holidayRow[onclick]:hover{background:rgba(255,255,255,.10);}


/* Jednotné sklenené formuláre – Audity a Neprítomnosť */
#leaveFormRow.panelEntryForm{display:none;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:9px;margin:10px 0 0;}
.panelEntryForm{box-sizing:border-box;width:100%;padding:9px;border-radius:13px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);}
.panelEntryForm .formFields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;min-width:0;}
.leaveEntryForm .formFields{grid-template-columns:repeat(3,minmax(0,1fr));}
.panelEntryForm label{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:12px;color:#fff;}
.panelEntryForm label span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.panelEntryForm input{width:100%!important;min-width:0;max-width:100%!important;box-sizing:border-box;background:rgba(255,255,255,.11)!important;border:1px solid rgba(255,255,255,.25)!important;border-radius:8px!important;color:#fff!important;padding:7px 8px!important;font-size:14px!important;text-align:left!important;}
.panelEntryForm input::placeholder{color:rgba(255,255,255,.7);}
.panelEntryForm .formActions{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;}
.panelEntryForm .formActions button{cursor:pointer;flex:1 1 0;min-width:0;white-space:nowrap;border-radius:8px!important;padding:7px 9px!important;font-size:14px!important;color:#fff!important;background:rgba(255,255,255,.15)!important;border:1px solid rgba(255,255,255,.24)!important;}
.panelEntryForm .formActions button:hover{background:rgba(255,255,255,.25)!important;}
.panelEntryForm .formActions button[id$="DeleteBtn"]{background:rgba(210,70,70,.4)!important;}
#auditFormRow td{overflow:visible!important;white-space:normal!important;}
#auditFormRow .panelEntryForm{font-weight:400;}

/* Zjednotené jemnejšie a kompaktnejšie formuláre */
.panelEntryForm{padding:6px!important;border-radius:11px!important;gap:5px!important;background:rgba(255,255,255,.035)!important;border-color:rgba(255,255,255,.12)!important;box-shadow:none!important;}
.panelEntryForm .formFields{gap:5px!important;}
.panelEntryForm label{font-size:10px!important;gap:2px!important;}
.panelEntryForm input{font-size:12px!important;padding:5px 6px!important;border-radius:7px!important;background:rgba(255,255,255,.055)!important;border-color:rgba(255,255,255,.15)!important;}
.panelEntryForm .formActions{gap:5px!important;margin-top:5px!important;}
.panelEntryForm .formActions button{padding:5px 6px!important;font-size:12px!important;border-radius:7px!important;background:rgba(255,255,255,.065)!important;border-color:rgba(255,255,255,.17)!important;box-shadow:none!important;}
.panelEntryForm .formActions button[id$="DeleteBtn"]{background:rgba(170,65,65,.18)!important;}
#leaveFormRow.panelEntryForm{margin-top:6px!important;}

/* Jednotné nenápadné pridávacie riadky – bez modrej výplne */
#auditAddRow, #leaveAddRow, #holidayAddRow {
  background:transparent !important;
  background-image:none !important;
  box-shadow:none !important;
  border:0 !important;
  color:#fff !important;
  font-size:17px !important;
  font-weight:400 !important;
  text-align:center !important;
}
#auditAddRow td {
  background:transparent !important;
  background-image:none !important;
  box-shadow:none !important;
  border:0 !important;
  padding:7px 4px !important;
  font-size:17px !important;
  font-weight:400 !important;
  color:#fff !important;
}
#leaveAddRow{padding:7px 3px 2px !important;}
#auditAddRow:hover, #auditAddRow:hover td, #leaveAddRow:hover, #holidayAddRow:hover{
  background:rgba(255,255,255,.04) !important;
}

/* Jemné zvislé oddeľovače stĺpcov – rovnaké ako deliace čiary riadkov. */
#auditsTable table tr:not(#auditFormRow):not(#auditAddRow) > td:not(:last-child),
#leaveList table tr > td:not(:last-child) {
  border-right:1px solid rgba(255,255,255,0.10) !important;
}
/* Sviatky sú vykreslené pomocou CSS grid, nie HTML tabuľky. */
#holidayBox .holidayRow > span:not(:last-child) {
  border-right:1px solid rgba(255,255,255,0.10);
  padding-right:8px;
  box-sizing:border-box;
}
#holidayBox .holidayRow {
  column-gap:7px;
}


/* Sviatky môžu obsahovať ľubovoľný počet ručne pridaných riadkov.
   Posúva sa iba zoznam, ovládanie pridania zostáva vždy dostupné. */
#holidayDisplay{
  max-height:245px;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.30) transparent;
}
#holidayDisplay::-webkit-scrollbar{width:6px;}
#holidayDisplay::-webkit-scrollbar-thumb{background:rgba(255,255,255,.30);border-radius:6px;}
#holidayAddRow{position:relative;z-index:1;}
/* Piktogramy sviatkov pred názvom */
#holidayBox .holidayName{display:flex;align-items:center;gap:7px;}
#holidayBox .holidayIcon{flex:0 0 auto;font-size:18px;line-height:1.1;}
#holidayBox .holidayLabel{min-width:0;overflow-wrap:anywhere;}

/* Dnešné maximum a minimum + animovaná fáza Mesiaca. */
#forecast3days .weatherTodayMain>.weatherTempRange{font-size:31px!important;line-height:1.2!important;letter-spacing:-.6px!important;}
/* Východ a západ v jednom riadku; zrážky pod nimi; Mesiac pod názvom Vráble. */
#forecast3days .weatherTodayDetails{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 83px;
  grid-template-rows:23px 23px;column-gap:7px;row-gap:6px;
  align-items:center;padding-top:10px;font-size:13px;
}
#forecast3days .weatherTodayDetails .sunriseInfo{grid-column:1;grid-row:1;}
#forecast3days .weatherTodayDetails .sunsetInfo{grid-column:2;grid-row:1;}
#forecast3days .weatherTodayDetails .rainPercentInfo{grid-column:1;grid-row:2;}
#forecast3days .weatherTodayDetails .rainMmInfo{grid-column:2;grid-row:2;}
#forecast3days .weatherTodayDetails .sunriseInfo,
#forecast3days .weatherTodayDetails .sunsetInfo,
#forecast3days .weatherTodayDetails .rainPercentInfo,
#forecast3days .weatherTodayDetails .rainMmInfo{
  min-width:0;white-space:nowrap;letter-spacing:-.25px;
}
#forecast3days .moonInfo{
  grid-column:3;grid-row:1 / 3;display:flex;flex-direction:column;
  align-items:flex-end;justify-content:center;gap:1px;min-width:0;
}
#forecast3days .moonPhaseIcon{
  display:block;width:43px;height:43px;border-radius:50%;
  filter:drop-shadow(0 0 8px rgba(207,227,255,.30));
  animation:moonGlow 7s ease-in-out infinite;
}
#forecast3days .moonPhaseName{
  width:83px;font-size:10px;line-height:1.15;text-align:right;
  white-space:normal;overflow-wrap:normal;color:rgba(255,255,255,.9);
}
@keyframes moonGlow{
  0%,100%{filter:drop-shadow(0 0 5px rgba(207,227,255,.20));}
  50%{filter:drop-shadow(0 0 10px rgba(207,227,255,.43));}
}
@media(prefers-reduced-motion:reduce){#forecast3days .moonPhaseIcon{animation:none;}}

/* Tesnejšie nadväzujúce tabuľky a čitateľnejšie detaily dnešného počasia. */
#forecast3days .weatherTodayTop{justify-content:flex-start;}
#forecast3days .weatherTodayDetails{
  grid-template-columns:minmax(0,1fr) minmax(0,1fr) 100px;
  grid-template-rows:28px 28px;column-gap:5px;row-gap:4px;
  font-size:15.5px;padding-top:10px;
}
#forecast3days .weatherTodayDetails .sunriseInfo,
#forecast3days .weatherTodayDetails .sunsetInfo,
#forecast3days .weatherTodayDetails .rainPercentInfo,
#forecast3days .weatherTodayDetails .rainMmInfo{display:flex;align-items:center;gap:3px;letter-spacing:-.45px;}

// Spoločný odpočet auditov a neprítomnosti k 7:00 v deň začiatku.
function countdownToSeven(isoDate, now=new Date()){
  const parts=String(isoDate).split('-').map(Number);
  if(parts.length!==3 || parts.some(x=>!Number.isFinite(x))) return {text:'–',color:'#aaa'};
  const target=new Date(parts[0],parts[1]-1,parts[2],7,0,0,0);
  const dayStart=new Date(parts[0],parts[1]-1,parts[2]);
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const calendarDays=Math.round((Date.UTC(parts[0],parts[1]-1,parts[2])-Date.UTC(today.getFullYear(),today.getMonth(),today.getDate()))/86400000);
  if(calendarDays<0 || (calendarDays===0 && now>=target)) return {text:'Dnes',color:'#4b9bff'};
  // Odpočet k 7:00: pri jednom kalendárnom dni alebo menej len celé hodiny, zaokrúhlené nahor.
  if(calendarDays<=1){
    const h=Math.max(1,Math.ceil((target-now)/3600000));
    return {text:'o '+h+' h',color:'#4b9bff'};
  }
  return {text:'o '+formatDaysSk(calendarDays),color:'#fff'};
}

function isEventWithin24h(isoDate, now=new Date()) {
  const parts=String(isoDate).split('-').map(Number);
  if(parts.length!==3 || parts.some(x=>!Number.isFinite(x))) return false;
  const start=new Date(parts[0], parts[1]-1, parts[2], 7, 0, 0, 0);
  const todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  // Po 7:00 v deň udalosti zostáva zvýraznenie počas celého dnešného dňa.
  return (start-now>0 && start-now<=86400000) ||
         (start>=todayStart && start<new Date(todayStart.getTime()+86400000) && now>=start);
}

function formatDaysSk(n){
  if(n===1) return '1 deň';
  if(n>=2 && n<=4) return n+' dni';
  return n+' dní';
}

  if(!firebaseDb) return;

  firebaseDb.ref(path).on('value', snapshot=>{
    const val = snapshot.val();
    if(val !== null && val !== undefined) callback(val);
  }, e=>console.warn('Firebase počúvanie zlyhalo ('+path+'):', e));

// ========== SPOLOČNÉ CORS PROXY ==========
const CORS_PROXIES = [
  'https://api.allorigins.win/raw?url=',
  'https://corsproxy.io/?url=',
  'https://api.codetabs.com/v1/proxy/?quest=',
  'https://thingproxy.freeboard.io/fetch/'
];

async function fetchTextViaCorsProxy(targetUrl, timeoutMs){
  for(const proxy of CORS_PROXIES){
    try{
      const proxyUrl = proxy.includes('thingproxy') ? (proxy+targetUrl) : (proxy+encodeURIComponent(targetUrl));
      const r=await fetch(proxyUrl,{signal:AbortSignal.timeout(timeoutMs||7000)});
      if(r.ok) return await r.text();
    }catch(e){ /* skús ďalšie proxy */ }
  }
  return null;
}

function getNameday(d){
  const key=d.getDate()+"."+(d.getMonth()+1);
  const entry=MENINY[key];
  // V informačnom riadku sa zobrazujú nanajvýš dve mená.
  return entry && entry !== "–" ? entry.split(/[,;/]+/).map(x=>x.trim()).filter(Boolean).slice(0,2).join(', ') : 'nikto';
}

function format(sec){
  sec=Math.floor(sec);
  let h=Math.floor(sec/3600);
  let m=Math.floor((sec%3600)/60);
  return `${h}h ${m}m`;
}

function formatClock(sec){
  sec=Math.max(0,Math.ceil(sec));
  const mins=Math.ceil(sec/60);
  const h=Math.floor(mins/60);
  const m=mins%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function formatHoursMins(sec){
  sec=Math.max(0,Math.floor(sec));
  const mins=Math.floor(sec/60);
  const h=Math.floor(mins/60);
  const m=mins%60;
  return `${h} h ${m} min`;
}

function clamp01(v){
  return Math.max(0, Math.min(1, v));
}

function nextWeekdayTime(from, hour, minute){
  const d=new Date(from);
  d.setSeconds(0,0);
  d.setHours(hour,minute,0,0);
  if(d<=from) d.setDate(d.getDate()+1);
  while(d.getDay()===0 || d.getDay()===6){
    d.setDate(d.getDate()+1);
  }
  d.setHours(hour,minute,0,0);
  return d;
}

function icon(code){
  if (code === 0) return "☀️";
  if (code === 1 || code === 2) return "🌤️";
  if (code === 3) return "⛅";
  if (code === 45 || code === 48) return "🌫️";
  if (code === 51 || code === 53 || code === 55) return "🌦️";
  if (code === 61 || code === 63 || code === 65) return "🌧️";
  if (code === 71 || code === 73 || code === 75) return "❄️";
  if (code === 77) return "🌨️";
  if (code === 80 || code === 81 || code === 82) return "⛈️";
  if (code === 85 || code === 86) return "🌨️";
  if (code === 95 || code === 96 || code === 99) return "⚡";
  return "☁️";
}

function windDir(deg){
  const d=["S","SV","V","JV","J","JZ","Z","SZ"];
  return d[Math.round(deg/45)%8];
}

function getISOWeek(d){
  const date=new Date(d);
  date.setDate(date.getDate()+3-(date.getDay()+6)%7);
  const week1=new Date(date.getFullYear(),0,4);
  return 1+Math.round(((date-week1)/86400000)/7);
}

function updateTime(){
  const n=new Date();
  time.innerText=n.toLocaleTimeString("sk-SK",{hour12:false});
  let d=n.toLocaleDateString("sk-SK",{weekday:"long"});
  d=d.charAt(0).toUpperCase()+d.slice(1);
  const datePart=d+" • "+n.toLocaleDateString("sk-SK",{day:"numeric",month:"long",year:"numeric"})+" • týždeň "+getISOWeek(n);
  const names=getNameday(n);
  const el=document.getElementById('dateWeek');
  el.replaceChildren();
  const fixed=document.createElement('span');fixed.className='dateWeekFixed';fixed.textContent=datePart;
  const flexible=document.createElement('span');flexible.className='dateWeekNameday';flexible.textContent=' • Meniny má: '+names;
  el.append(fixed,flexible);
  fitDateWeekText();
}

function fitDateWeekText(){
  const el=document.getElementById('dateWeek');
  if(!el)return;
  const fixed=el.querySelector('.dateWeekFixed');
  const names=el.querySelector('.dateWeekNameday');
  if(!fixed||!names)return;
  // Horný dátum a číslo týždňa ostávajú veľké; zmenšujú sa len dlhé meniny.
  const stage=document.getElementById('stage');
  const weather=document.getElementById('forecast3days');
  const right=stage?stage.getBoundingClientRect().right:window.innerWidth;
  const left=weather?weather.getBoundingClientRect().right+18:0;
  const scale=stage?stage.getBoundingClientRect().width/1920:1;
  const maxWidth=Math.max(480,(right-left-35*scale)/Math.max(scale,.01));
  el.style.maxWidth=maxWidth+'px';
  fixed.style.fontSize='40px';
  names.style.fontSize='40px';
  let size=40;
  while(fixed.scrollWidth+names.scrollWidth+10>maxWidth&&size>23){
    size--;names.style.fontSize=size+'px';
  }
  // Výnimočne na malej dostupnej šírke nenecháme pretiecť ani dátum.
  let fixedSize=40;
  while(fixed.scrollWidth+names.scrollWidth+10>maxWidth&&fixedSize>35){
    fixedSize--;fixed.style.fontSize=fixedSize+'px';
  }
}
window.addEventListener('resize',fitDateWeekText);
// Meniny sa zobrazujú pri dátume a čísle týždňa; updateTime() ich obnoví po polnoci.
function updateNameday(){
  updateTime();
}

function setApiStatus(key, ok){
  apiStatus[key]=ok;

}

function updateApiStatusIndicator(){
  const el=document.getElementById('apiStatusIndicator');
  if(!el) return;
  const values=Object.values(apiStatus);
  const failures=values.filter(v=>v===false).length;
  const unknown=values.filter(v=>v==='unknown').length;
  const pending=values.filter(v=>v===null).length;
  const color=failures?'#ff4d4d':(unknown?'#ffbf47':pending?'#888':'#4caf50');
  const heading=failures?'Niektorá služba nefunguje':unknown?'Niektoré služby sa nepodarilo overiť':pending?'Kontrolujem služby…':'Všetky sledované služby sú OK';
  el.style.background=color;
  el.style.boxShadow='0 0 8px '+color;
  el.title=heading+' (klikni pre detail)';
  const names={
    weather:'Počasie Vráble (aktuálne + predpoveď)',
    sun:'Východ a západ slnka',
    worldWeather:'Svetové počasie',
    firebase:'Zdieľaná databáza Firebase',
    news:'Správy Teraz.sk (RSS)',
    radio:'Online rádiá (spolu 10)'
  };
  const panel=document.getElementById('apiStatusPanel');
  if(!panel) return;
  const header=document.createElement('div');
  header.textContent=heading;
  header.style.cssText='font-weight:bold;margin-bottom:7px;color:'+color+';';
  panel.replaceChildren(header);
  Object.keys(names).forEach(key=>{
    const v=apiStatus[key];
    const mark=v===true?'✓':v===false?'✗':v==='unknown'?'?':'…';
    const markColor=v===true?'#77df8d':v===false?'#ff7272':v==='unknown'?'#ffbf47':'#ccc';
    const line=document.createElement('div');
    line.style.cssText='margin:4px 0;white-space:nowrap;';
    const symbol=document.createElement('span');
    symbol.textContent=mark+' ';
    symbol.style.color=markColor;
    symbol.style.fontWeight='bold';
    line.append(symbol,document.createTextNode(names[key]));
    panel.appendChild(line);
  });
  // Rádiá sú jeden spoločný stav; nesypeme sem zoznam staníc.
  if(radioHealth.length){
    const summary=document.createElement('div');
    const checked=radioHealth.filter(r=>r.state!==null).length;
    summary.textContent='Rádiá: overené '+checked+'/'+radioHealth.length+' • kontrola raz za hodinu';
    summary.style.cssText='margin-top:7px;font-size:11px;color:#fff;';
    panel.appendChild(summary);
    const button=document.createElement('button');
    button.type='button';
    button.textContent=radioHealthRunning?'Kontrolujem…':'Znova skontrolovať rádiá';
    button.disabled=radioHealthRunning;
    button.style.cssText='cursor:pointer;background:rgba(255,255,255,.15);color:white;border:1px solid #777;border-radius:6px;padding:5px 8px;margin-top:6px;';
    button.onclick=()=>window.checkRadioHealth?.();
    panel.appendChild(button);
  }
}

function toggleApiStatusPanel(){
  const panel=document.getElementById('apiStatusPanel');
  if(!panel) return;
  panel.style.display = (panel.style.display==='none' || !panel.style.display) ? 'block' : 'none';
}

async function loadSun(){
  try {
    const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=48.24&longitude=18.32&daily=sunrise,sunset&timezone=Europe%2FBratislava&forecast_days=1");
    const data = await res.json();
    
    const sunrise = new Date(data.daily.sunrise[0]).toLocaleTimeString('sk-SK', {hour: '2-digit', minute: '2-digit'});
    const sunset = new Date(data.daily.sunset[0]).toLocaleTimeString('sk-SK', {hour: '2-digit', minute: '2-digit'});
    
    const now = new Date();
    const fullMoonDate = new Date(2026, 5, 30, 1, 57);
    const lunarCycle = 29.53;
    
    let newMoonDate = new Date(fullMoonDate.getTime() - (14.765 * 24 * 60 * 60 * 1000));
    
    while (newMoonDate > now) {
      newMoonDate = new Date(newMoonDate.getTime() - (lunarCycle * 24 * 60 * 60 * 1000));
    }
    
    const daysSinceNewMoon = (now - newMoonDate) / (1000 * 60 * 60 * 24);
    
    let moonEmoji = '🌑';
    let moonName = 'Nový mesiac';
    
    if (daysSinceNewMoon < 1.84) { moonEmoji = '🌑'; moonName = 'Nov'; }
    else if (daysSinceNewMoon < 7.38) { moonEmoji = '🌒'; moonName = 'Dorastajúci mesiac'; }
    else if (daysSinceNewMoon < 9.23) { moonEmoji = '🌓'; moonName = 'Prvá štvrť'; }
    else if (daysSinceNewMoon < 14.77) { moonEmoji = '🌔'; moonName = 'Dorastajúci mesiac'; }
    else if (daysSinceNewMoon < 16.61) { moonEmoji = '🌕'; moonName = 'Spln'; }
    else if (daysSinceNewMoon < 22.15) { moonEmoji = '🌖'; moonName = 'Ubúdajúci mesiac'; }
    else if (daysSinceNewMoon < 23.99) { moonEmoji = '🌗'; moonName = 'Posledná štvrť'; }
    else { moonEmoji = '🌘'; moonName = 'Ubúdajúci mesiac'; }
    
    const today = new Date();
    const isNewMoonDay = today.getDate() === newMoonDate.getDate() && today.getMonth() === newMoonDate.getMonth();
    if (isNewMoonDay) moonName = 'Now';
    
    window.dashboardSunTimes={sunrise,sunset};
    saveWeatherCache(DASHBOARD_SUN_CACHE_KEY,{sunrise,sunset,savedAt:Date.now()});
    const sunriseNode=document.querySelector('[data-sunrise]');
    const sunsetNode=document.querySelector('[data-sunset]');
    if(sunriseNode) sunriseNode.textContent=sunrise;
    if(sunsetNode) sunsetNode.textContent=sunset;
    document.getElementById('sun').innerHTML = `Východ slnka: ☀️ ${sunrise}<hr style="border:none;border-top:1px solid rgba(255,255,255,0.2);margin:6px 0;">Západ slnka: 🌙 ${sunset}<hr style="border:none;border-top:1px solid rgba(255,255,255,0.2);margin:6px 0;">Fáza mesiaca: ${moonEmoji} ${moonName}`;
    document.getElementById('sun').style.cursor='pointer';
    document.getElementById('sun').onclick=function(){ window.open('https://www.timeanddate.com/astronomy/slovakia/nitra','_blank'); };
    document.getElementById('sun').title='Zdroj: timeanddate.com';
    setApiStatus('sun', true);
  } catch (err) {
    document.getElementById('sun').innerHTML = "☀️ Slnko: Chyba";
    setApiStatus('sun', false);
  }
}

function readWeatherCache(key){
  try { const raw=localStorage.getItem(key); return raw?JSON.parse(raw):null; }
  catch(e){ return null; }
}
function saveWeatherCache(key,value){
  try {localStorage.setItem(key,JSON.stringify(value));}catch(e){console.warn('Počasie: zálohu nemožno uložiť',e);}
}
function validVrábleWeather(data){
  return !!(data && data.current && Number.isFinite(data.current.temperature_2m) &&

    Array.isArray(data.daily.temperature_2m_max) && data.daily.temperature_2m_max.length>=4 &&
    Array.isArray(data.daily.weather_code) && data.daily.weather_code.length>=4);
}

// Animovaná fáza Mesiaca bez ďalšieho API (orientačný astronomický výpočet).
// Referenčný nov: 6. januára 2000 o 18:14 UTC; synodický mesiac 29,530588853 dňa.
function drawDashboardMoonPhase(){
  const canvas=document.querySelector('#forecast3days .moonPhaseIcon');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  if(!ctx)return;
  // Denné zobrazenie sa vypočítava na lokálne poludnie, aby sa menilo každý deň.
  const now=new Date();
  const localNoon=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12);
  const cycle=29.530588853;
  const age=(((localNoon.getTime()-Date.UTC(2000,0,6,18,14))/86400000)%cycle+cycle)%cycle;
  const phase=age/cycle;
  const angle=phase*2*Math.PI;
  const illumination=(1-Math.cos(angle))/2;
  // Smer svetla: nov zozadu, prvá štvrť zprava, spln spredu.
  const lx=Math.sin(angle), lz=-Math.cos(angle), ly=.11;
  const w=canvas.width,h=canvas.height,cx=w/2,cy=h/2,r=w*.435;
  const img=ctx.createImageData(w,h);
  const smooth=(a,b,x)=>{const v=Math.max(0,Math.min(1,(x-a)/(b-a)));return v*v*(3-2*v);};
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const nx=(x+.5-cx)/r,ny=(y+.5-cy)/r;
    const rr=nx*nx+ny*ny;
    if(rr>1.07)continue;
    const z=Math.sqrt(Math.max(0,1-Math.min(1,rr)));
    const dot=nx*lx-ny*ly+z*lz;
    // Hladký prechod medzi osvetlenou a tmavou časťou.
    const light=smooth(-.042,.065,dot);
    // Nepravidelné bazaltové moria, krátery s okrajovým valom a jemná zrnitosť.
    // Textúra je procedurálna: pracuje aj offline a nemení sa náhodne pri prekreslení.
    const basins=[[-.32,-.32,.33,.25],[-.07,-.08,.25,.31],[.22,-.26,.20,.23],[-.43,.18,.22,.20],[.34,.24,.16,.19]];
    let maria=0;
    for(const [mx,my,rx,ry] of basins){const dist=((nx-mx)/rx)**2+((ny-my)/ry)**2;maria+=.26/(1+Math.exp((dist-1)*8));}
    let craters=0;
    const craterMap=[[-.58,-.04,.115],[.53,.40,.16],[-.19,.51,.13],[.45,-.55,.09],[-.52,-.49,.095],[.05,.67,.085],[.64,-.09,.07],[-.05,-.68,.08],[-.72,.21,.07],[.23,.04,.078]];
    for(const [px,py,cr] of craterMap){
      const dd=Math.hypot(nx-px,ny-py)/cr;
      craters+=-.13*Math.exp(-dd*dd*2.0)+.14*Math.exp(-(((dd-1)/.22)**2));
    }
    const grain=Math.sin(nx*137+ny*47)*Math.cos(ny*119-nx*37)*.018+Math.sin(nx*59-ny*111)*.012;
    const detail=Math.sin(nx*27+ny*17)*Math.cos(nx*42-ny*23)*.038;
    const albedo=Math.max(.22,Math.min(1.14,.88-maria+craters+grain+detail));
    const level=Math.max(0,Math.min(255, 10+(218*albedo)*light));
    const edge=1-smooth(.965,1.04,Math.sqrt(rr));
    const idx=(y*w+x)*4;
    img.data[idx]=Math.round(level*.92);
    img.data[idx+1]=Math.round(level*.96);
    img.data[idx+2]=Math.round(Math.min(255,level*1.05+7));
    img.data[idx+3]=Math.round(255*edge);
  }
  ctx.clearRect(0,0,w,h);
  ctx.putImageData(img,0,0);
  let name='Nov';
  if(phase>=.035&&phase<.22)name='Dorastajúci kosáčik';
  else if(phase>=.22&&phase<.28)name='Prvá štvrť';
  else if(phase>=.28&&phase<.465)name='Dorastajúci Mesiac';
  else if(phase>=.465&&phase<.535)name='Spln';
  else if(phase>=.535&&phase<.72)name='Ubúdajúci Mesiac';
  else if(phase>=.72&&phase<.78)name='Posledná štvrť';
  else if(phase>=.78&&phase<.965)name='Ubúdajúci kosáčik';
  canvas.title=`${name} · približne ${Math.round(illumination*100)} % osvetlenia`;
  canvas.setAttribute('aria-label',canvas.title);
  const phaseLabel=document.querySelector('#forecast3days .moonPhaseName');
  if(phaseLabel) phaseLabel.textContent=name;
}

// ZVUK NOTIFIKÁCIA - GONG
function playAlert(){
  try {
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    
    const osc1=ctx.createOscillator();
    const gain1=ctx.createGain();
    osc1.connect(gain1);
    gain1.connect(ctx.destination);
    osc1.frequency.value=180;
    gain1.gain.setValueAtTime(0.6,ctx.currentTime);
    gain1.gain.exponentialRampToValueAtTime(0.05,ctx.currentTime+3.5);
    osc1.start(ctx.currentTime);
    osc1.stop(ctx.currentTime+3.5);
    
    const osc2=ctx.createOscillator();
    const gain2=ctx.createGain();
    osc2.connect(gain2);
    gain2.connect(ctx.destination);
    osc2.frequency.value=360;
    gain2.gain.setValueAtTime(0.4,ctx.currentTime);
    gain2.gain.exponentialRampToValueAtTime(0.02,ctx.currentTime+3.5);
    osc2.start(ctx.currentTime);
    osc2.stop(ctx.currentTime+3.5);
  } catch(e){}
}

// DOVOLENKA + VIANOCE + ZMENA + OBED
function updateVacation(){
  const n=new Date();
  const day=n.getDay();
  const isWeekday=day>=1 && day<=5;
  const shiftStart=new Date(n); shiftStart.setHours(7,0,0,0);
  const shiftEnd=new Date(n); shiftEnd.setHours(15,0,0,0);
  const lunchStart=new Date(n); lunchStart.setHours(10,30,0,0);
  const lunchEnd=new Date(n); lunchEnd.setHours(11,30,0,0);

  const nextShift=nextWeekdayTime(n,7,0);
  const nextLunch=nextWeekdayTime(n,10,30);
  const shiftDuration=8*3600;
  const lunchDuration=60*60;

  const shiftBox=document.getElementById('shiftBox');
  if(shiftBox){
    let shiftTitle='Do začiatku zmeny';
    let shiftValue=formatClock((nextShift-n)/1000);
    let shiftHint='Najbližšia zmena';
    let shiftProgress=0;
    let shiftWarn=false;
    let shiftDone=false;

    let lunchTitle='Do obeda';
    let lunchValue=formatClock((nextLunch-n)/1000);
    let lunchHint='Najbližší obed';
    let lunchProgress=0;
    let lunchWarn=false;
    let lunchDone=false;

    let workedSec=0;
    let workedPct=0;

    if(isWeekday && n < shiftStart){
      shiftTitle='Do začiatku zmeny';
      const sec=(shiftStart-n)/1000;
      shiftValue=formatClock(sec);
      shiftHint='Začiatok dnes o 07:00';
      shiftProgress=clamp01(1 - sec/(7*3600));
      shiftWarn=sec<=15*60;

      const secLunch=(lunchStart-n)/1000;
      lunchTitle='Do obeda';
      lunchValue=formatClock(secLunch);
      lunchHint='Dnešná obedná prestávka';
      lunchProgress=clamp01(1 - secLunch/(10.5*3600));
      lunchWarn=secLunch<=15*60;
    } else if(isWeekday && n >= shiftStart && n < lunchStart){
      const shiftSec=(shiftEnd-n)/1000;
      shiftTitle='Koniec zmeny';
      shiftValue=formatClock(shiftSec);
      shiftHint='Zmena prebieha';
      shiftProgress=clamp01((n-shiftStart)/1000 / shiftDuration);
      shiftWarn=shiftSec<=15*60;

      const lunchSec=(lunchStart-n)/1000;
      lunchTitle='Do obeda';
      lunchValue=formatClock(lunchSec);
      lunchHint='Obed začne o 10:30';
      lunchProgress=clamp01((n-shiftStart)/1000 / (3.5*3600));
      lunchWarn=lunchSec<=15*60;

      workedSec=(n-shiftStart)/1000;
      workedPct=clamp01(workedSec/shiftDuration);
    } else if(isWeekday && n >= lunchStart && n < lunchEnd){
      const shiftSec=(shiftEnd-n)/1000;
      shiftTitle='Koniec zmeny';
      shiftValue=formatClock(shiftSec);
      shiftHint='Zmena prebieha';
      shiftProgress=clamp01((n-shiftStart)/1000 / shiftDuration);
      shiftWarn=shiftSec<=15*60;

      const lunchSec=(lunchEnd-n)/1000;
      lunchTitle='Obedná prestávka';
      lunchValue=formatClock(lunchSec);
      lunchHint='Obed prebieha';
      lunchProgress=clamp01((n-lunchStart)/1000 / lunchDuration);
      lunchWarn=lunchSec<=15*60;

      workedSec=(n-shiftStart)/1000;
      workedPct=clamp01(workedSec/shiftDuration);
    } else if(isWeekday && n >= lunchEnd && n < shiftEnd){
      const shiftSec=(shiftEnd-n)/1000;
      shiftTitle='Koniec zmeny';
      shiftValue=formatClock(shiftSec);
      shiftHint='Zmena prebieha';
      shiftProgress=clamp01((n-shiftStart)/1000 / shiftDuration);
      shiftWarn=shiftSec<=15*60;

      lunchTitle='Po obede';
      lunchValue='Hotovo';
      lunchHint='Obed už prebehol';
      lunchProgress=1;
      lunchDone=true;

      workedSec=(n-shiftStart)/1000;
      workedPct=clamp01(workedSec/shiftDuration);
    } else if(isWeekday && n >= shiftEnd){
      shiftTitle='Zmena ukončená';
      shiftValue='Hotovo';
      shiftHint='Dnešná zmena skončila';
      shiftProgress=1;
      shiftDone=true;

      lunchTitle='Po obede';
      lunchValue='Hotovo';
      lunchHint='Obed už prebehol';
      lunchProgress=1;
      lunchDone=true;

      workedSec=shiftDuration;
      workedPct=1;
    } else {
      const shiftSec=(nextShift-n)/1000;
      shiftTitle='Do začiatku zmeny';
      shiftValue=formatClock(shiftSec);
      shiftHint='Víkend – najbližšia zmena';
      shiftProgress=0;

      const lunchSec=(nextLunch-n)/1000;
      lunchTitle='Do obeda';
      lunchValue=formatClock(lunchSec);
      lunchHint='Najbližší obed';
      lunchProgress=0;

      workedSec=0;
      workedPct=0;
    }

    const leftClass = lunchDone ? 'workCard done' : 'workCard';
    const rightClass = shiftDone ? 'workCard done' : 'workCard';
    const workdayMarkup = `
      <div class="workdayGrid">
        <div class="${leftClass}">
          <div class="workLabel">${lunchTitle}</div>
          <div class="workMain"><div class="workIcon">🍽️</div><div class="workValue ${lunchWarn ? 'warn' : ''}">${lunchValue}</div></div>
          <div class="workHint">${lunchHint}</div>
          <div class="workBar"><span class="workBarFill lunch ${lunchWarn ? 'warn' : ''}" style="height:${Math.round(lunchProgress*100)}%"></span></div>
        </div>
        <div class="${rightClass}">
          <div class="workLabel">${shiftTitle}</div>
          <div class="workMain"><div class="workIcon">💼</div><div class="workValue ${shiftWarn ? 'warn' : ''}">${shiftValue}</div></div>
          <div class="workHint">${shiftHint}</div>
          <div class="workBar"><span class="workBarFill ${shiftWarn ? 'warn' : ''}" style="height:${Math.round(shiftProgress*100)}%"></span></div>
        </div>
      </div>
`;
    // Pri každej aktualizácii nevytvárať panel odznova: to spôsobovalo
    // prebliknutie priehľadného skla aj animácie výplne odspodu.
    if(!shiftBox.querySelector('.workdayGrid')){
      shiftBox.innerHTML=workdayMarkup;
    } else {
      const holder=document.createElement('div');
      holder.innerHTML=workdayMarkup;
      const oldCards=shiftBox.querySelectorAll('.workCard');
      const newCards=holder.querySelectorAll('.workCard');
      oldCards.forEach((card,i)=>{
        const next=newCards[i];
        if(!next) return;
        if(card.className!==next.className) card.className=next.className;
        for(const selector of ['.workLabel','.workValue','.workHint']){
          const oldEl=card.querySelector(selector);
          const nextEl=next.querySelector(selector);
          if(oldEl && nextEl){
            if(oldEl.textContent!==nextEl.textContent) oldEl.textContent=nextEl.textContent;
            if(oldEl.className!==nextEl.className) oldEl.className=nextEl.className;
          }
        }
        const bar=card.querySelector('.workBarFill');
        const nextBar=next.querySelector('.workBarFill');
        if(bar && nextBar){
          if(bar.className!==nextBar.className) bar.className=nextBar.className;
          if(bar.style.height!==nextBar.style.height) bar.style.height=nextBar.style.height;
        }
      });
    }
    shiftBox.style.display='block';
  }

  const auditCells = document.querySelectorAll('.daysToAudit');
  auditCells.forEach(cell => {
    const startDate = new Date(cell.getAttribute('data-date'));
    const endDate = new Date(cell.getAttribute('data-end') || cell.getAttribute('data-date'));
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    startDate.setHours(0, 0, 0, 0);
    endDate.setHours(0, 0, 0, 0);

    const row = cell.closest('tr');
    const daysAfterEnd = Math.ceil((endDate - today) / (1000 * 60 * 60 * 24));

    if (daysAfterEnd < 0) {
      if (row) row.style.display = 'none';
      return;
    }
    if (row) {
      row.style.display = '';
      row.classList.remove('event-soon','currentCountdownRow');
    }

    const left = countdownToSeven(cell.getAttribute('data-date'));
    cell.textContent = left.text;
    cell.style.color = '#ffffff';
    cell.style.whiteSpace = 'nowrap';
    cell.style.fontSize = '';
    const eventParts = cell.getAttribute('data-date').split('-').map(Number);
    const eventStart = new Date(eventParts[0],eventParts[1]-1,eventParts[2],7,0,0,0);
    const msUntilStart = eventStart.getTime()-Date.now();
    const isCurrent = left.text==='Dnes' || (msUntilStart>=0 && msUntilStart<=23*3600000);
    cell.classList.toggle('currentCountdownText', isCurrent);
    if (row) row.classList.toggle('currentCountdownRow', isCurrent);
    if(typeof shrinkToFit==='function') shrinkToFit(cell, 11);
  });
}

// SVIATKY: tri najbližšie, plus odpočet do Štedrého dňa
function easterSunday(year){
  const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4;
  const f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k+7)%7,m=Math.floor((a+11*h+22*l)/451);
  return new Date(year,Math.floor((h+l-7*m+114)/31)-1,((h+l-7*m+114)%31)+1);
}
function holidaysForYear(y){
  const easter=easterSunday(y);
  const fromEaster=(offset)=>{const d=new Date(easter);d.setDate(d.getDate()+offset);return d;};
  return [
    {date:new Date(y,0,1),name:'Nový rok'},
    {date:new Date(y,0,6),name:'Zjavenie Pána'},
    {date:new Date(y,0,27),name:'Deň pamiatky obetí holokaustu a rasového násilia'},
    {date:fromEaster(-2),name:'Veľký piatok'},
    {date:fromEaster(1),name:'Veľkonočný pondelok'},
    {date:new Date(y,4,1),name:'Sviatok práce'},
    {date:new Date(y,4,8),name:'Deň víťazstva nad fašizmom'},
    {date:new Date(y,6,5),name:'Sviatok svätého Cyrila a svätého Metoda'},
    {date:new Date(y,7,29),name:'Výročie Slovenského národného povstania'},
    {date:new Date(y,8,1),name:'Deň Ústavy Slovenskej republiky'},
    {date:new Date(y,8,15),name:'Sedembolestná Panna Mária'},
    {date:new Date(y,10,1),name:'Sviatok všetkých svätých'},
    {date:new Date(y,10,17),name:'Deň boja za slobodu a demokraciu'},
    {date:new Date(y,11,24),name:'Štedrý deň'},
    {date:new Date(y,11,25),name:'Prvý sviatok vianočný'},
    {date:new Date(y,11,26),name:'Druhý sviatok vianočný'}
  ];
}

function parseCustomHolidayDate(iso){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||''))return null;
  const [year,month,day]=iso.split('-').map(Number);
  const d=new Date(year,month-1,day);
  return d.getFullYear()===year && d.getMonth()===month-1 && d.getDate()===day?d:null;
}

// Symboly priradené k významu sviatku; fungujú bez externých obrázkov.
function holidayPictogram(name){
  const key=String(name||'').toLocaleLowerCase('sk-SK').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const rules=[
    [/vianoc|stedr|jezisk|mikul|christmas|advent/, '🎄'],
    [/velkonoc|easter|velk[y ] piatok/, '🐣'],
    [/troch kral|traja kral|zjavenie pana/, '⭐'],
    [/novy rok|silvest|vznik slovenskej republiky/, '🎆'],
    [/snp|slovenske narodn[eé] povstanie|osloboden|vitazstv.*fasiz|vojnov/, '🕊️'],
    [/ustav|slobodu a demokraciu|nezavisl|cesko.slovenskeho statu|statn[y ] sviat/, '🇸🇰'],
    [/cyril|metod|sedembolestn|panny mar|panna maria/, '⛪'],
    [/vsetkych svat|dusick|zosnul|pamiatk/, '🕯️'],
    [/sviatok prace|prace|pracujuc/, '🛠️'],
    [/narodenin|narodky|vyroci[e ]|jubileum/, '🎂'],
    [/meniny/, '💐'],
    [/svadb|vyroc.*svadb/, '💍'],
    [/dovolen|volno|prazdnin/, '🏖️'],
    [/den deti|deti/, '🧸'],
    [/valentin|lask/, '❤️'],
    [/halloween/, '🎃'],
    [/den matiek|mamin/, '💐'],
    [/den otcov|otcov/, '👔'],
    [/november|oktober|september|august/, '📅']
  ];
  for(const [pattern,icon] of rules){if(pattern.test(key))return icon;}
  return '📅';
}
function isManuallyAddedChristmasHoliday(item){
  if(!item || typeof item!=='object')return false;
  const date=parseCustomHolidayDate(item.date);
  if(!date || date.getMonth()!==11 || ![24,25,26].includes(date.getDate()))return false;
  return /vianoc|štedr|stedr|christmas/i.test(String(item.name||''));
}
function removeManuallyAddedChristmasHolidays(){
  const filtered=customHolidayData.filter(item=>!isManuallyAddedChristmasHoliday(item));
  if(filtered.length!==customHolidayData.length){
    customHolidayData=filtered;
    persistCustomHolidays();
  }
}
function updateHolidays(){
  // Odstrániť iba ručne pridané Vianoce, nie iné vlastné sviatky.
  removeManuallyAddedChristmasHolidays();
  const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const oneDay=86400000;
  const automatic=[...holidaysForYear(today.getFullYear()),...holidaysForYear(today.getFullYear()+1)]
    // Oficiálne vianočné sviatky sú súčasťou kalendára; neodfiltrovať ich.
    .map(h=>{
      const key=isoLocalDate(h.date);
      const isOfficialChristmas=h.date.getMonth()===11 && [24,25,26].includes(h.date.getDate());
      const edited=isOfficialChristmas?null:holidayOverrides[key];
      return {date:edited?parseCustomHolidayDate(edited.date):h.date,name:edited?edited.name:h.name,automaticKey:key};
    }).filter(h=>h.date && h.date>=today);
  const own=customHolidayData.map(item=>({...item,parsedDate:parseCustomHolidayDate(item.date)}))
    .filter(item=>item.parsedDate && item.parsedDate>=today)
    .map(item=>({date:item.parsedDate,name:item.name,id:item.id,custom:true}));
  // Vždy len tri najbližšie udalosti vrátane vlastných a upravených automatických.
  const upcoming=[...automatic,...own].sort((a,b)=>a.date-b.date).slice(0,3);
  const display=document.getElementById('holidayDisplay');
  if(!display)return;
  const when=(date)=>{
    const days=Math.round((date-today)/oneDay);
    return days===0?'Dnes':days===1?'Zajtra':'o '+days+' dní';
  };
  const row=(item)=>{
    const date=item.date;
    const editId=item.custom?item.id:'auto:'+item.automaticKey;
    const attrs=' title="Sviatok v kalendári"';
    const whenLabel=when(date);
    const isCurrent=date.getFullYear()===today.getFullYear() && date.getMonth()===today.getMonth() && date.getDate()===today.getDate();
    return `<div class="holidayRow ${isCurrent?'currentCountdownRow':''}"${attrs}><span class="holidayDate">${['Ne','Po','Ut','St','Št','Pi','So'][date.getDay()]} ${String(date.getDate()).padStart(2,'0')}.${String(date.getMonth()+1).padStart(2,'0')}.</span><span class="holidayName"><span class="holidayIcon" aria-hidden="true">${holidayPictogram(item.name)}</span><span class="holidayLabel">${escapeHolidayText(item.name)}</span></span><span class="holidayWhen ${isCurrent?'currentCountdownText':''}">${whenLabel}</span></div>`;
  };
  display.innerHTML=upcoming.map(row).join('');
  display.style.display='block';
  if(typeof positionLeaveBox==='function')positionLeaveBox();
  if(typeof positionBottomBoxes==='function')positionBottomBoxes();
}

function uniqueArchiveEntries(items){
 const map=new Map();
 items.forEach(item=>{if(item&&item.id!=null)map.set(String(item.id),item);});
 return Array.from(map.values());

function archiveExpiredRecords(type,items,dateField){
 const today=new Date();today.setHours(0,0,0,0);
 const past=[],upcoming=[];
 items.forEach(item=>{
   const d=parseLeaveDate(item[dateField]||item.start||item.date);
   if(Number.isFinite(d.getTime()) && d<today)past.push(item);
   else upcoming.push(item);
 });
 if(past.length){
   expiredEventArchives[type]=uniqueArchiveEntries([...expiredEventArchives[type],...past.map(item=>({...item,archivedAt:new Date().toISOString()}))]);
   saveExpiredArchives();
 }

function leaveDateCardParts(startDate,endDate){
  const same = !endDate || startDate.getTime()===endDate.getTime();
  const dow = SHORT_SK_DAYS[startDate.getDay()];
  const main = `${String(startDate.getDate()).padStart(2,'0')}.${String(startDate.getMonth()+1).padStart(2,'0')}.`;
  let range='';
  if(!same){
    range = `${String(startDate.getDate()).padStart(2,'0')}.${String(startDate.getMonth()+1).padStart(2,'0')}. – ${String(endDate.getDate()).padStart(2,'0')}.${String(endDate.getMonth()+1).padStart(2,'0')}.`;
  }
  return { dow, main };
}

// Skratka dňa podľa slovenského kalendára.
const SHORT_SK_DAYS=['Ne','Po','Ut','St','Št','Pi','So'];
function dayDateShort(date){
  return SHORT_SK_DAYS[date.getDay()]+' '+String(date.getDate()).padStart(2,'0')+'.'+String(date.getMonth()+1).padStart(2,'0')+'.';
}
function eventDateRangeShort(start,end){
  const first=dayDateShort(start);
  if(!end || start.getTime()===end.getTime()) return first;
  return first+' – '+dayDateShort(end);
}

function renderLeave(){
  const list=document.getElementById('leaveList');
  if(!list) return;
  const today=new Date(); today.setHours(0,0,0,0);

  const before=leaveData.length;
  leaveData = archiveExpiredRecords('leave',leaveData,'end');
  if(leaveData.length!==before) saveLeave();

  const items = leaveData.map(x=>{
    const s=parseLeaveDate(x.start); s.setHours(0,0,0,0);
    const e=parseLeaveDate(x.end||x.start); e.setHours(0,0,0,0);
    const daysToStart=Math.ceil((s-today)/86400000);
    const datum=eventDateRangeShort(s,e);
    return {...x, s, e, daysToStart, datum};
  });

  const groups={};
  items.forEach(it=>{
    const key=it.start+'|'+(it.end||it.start);
    if(!groups[key]) groups[key]={ datum:it.datum, s:it.s, e:it.e, daysToStart:it.daysToStart, people:[] };
    groups[key].people.push(it);
  });
  const groupList=Object.values(groups).map(g=>{
    g.people.sort((a,b)=> a.name.localeCompare(b.name,'sk'));
    return g;
  }).sort((a,b)=> a.s - b.s);

  if(groupList.length===0){
    list.innerHTML=`<div class="leaveEmptyState">Žiadne plánované voľno</div>`;
  } else {
    let html=`<table class="leaveAuditStyleTable" style="width:100%;border-collapse:collapse;table-layout:fixed;">`
      + `<colgroup><col style="width:39%"><col style="width:38%"><col style="width:23%"></colgroup>`;
    groupList.forEach(g=>{
      const countdown=countdownToSeven(g.people[0].start);
      const dni=countdown.text;
      const isCurrent=dni==='Dnes' || /\bh\b/.test(dni);
      const editFirst=g.people[0].id;
      const namesHtml=g.people.map(p=>
        `<span class="leaveTablePerson" onclick="event.stopPropagation();editLeave('${p.id}')" title="Upraviť">${escapeHolidayText(p.name)}</span>`
      ).join(', ');
      html += `<tr class="${isCurrent?'currentCountdownRow':''}">`
        + `<td class="eventDateCell" onclick="event.stopPropagation();editLeave('${editFirst}')" title="Upraviť" style="cursor:pointer;">${g.datum}</td>`
        + `<td class="leaveNamesCell">${namesHtml}</td>`
        + `<td onclick="event.stopPropagation();editLeave('${editFirst}')" title="Upraviť" style="cursor:pointer;">${dni}</td>`
      + `</tr>`;
    });
    html += `</table>`;
    list.innerHTML=html;
  }
  positionLeaveBox();
  if(typeof positionBottomBoxes==='function') positionBottomBoxes();
  fitAllDashboardTables();
}

function positionLeaveBox(){

  const gap=11,startX=551,right=40,total=1920-right-startX;
  const namedayWidth=310,auditWidth=total-namedayWidth-gap;
  const firstTop=210;

  );

  const secondTop=Math.max(audits.offsetTop+audits.offsetHeight,nameday.offsetTop+nameday.offsetHeight)+gap;
  const leftWidth=Math.floor((total-gap)/2);

function parseDDMM(str, explicitYear){
  if(!str) return '';
  const m=String(str).trim().match(/^(\d{1,2})[.\/](\d{1,2})\.?$/);
  if(!m) return '';
  const day=parseInt(m[1],10), month=parseInt(m[2],10);
  if(day<1||day>31||month<1||month>12) return '';
  let year;
  if(explicitYear){
    year=parseInt(explicitYear,10);
  } else {
    const now=new Date(); now.setHours(0,0,0,0);
    year=now.getFullYear();
    let candidate=new Date(year, month-1, day);
    const diffDays=(now-candidate)/(1000*60*60*24);
    if(diffDays>30){ year+=1; }
  }
  const mm=String(month).padStart(2,'0');
  const dd=String(day).padStart(2,'0');
  return `${year}-${mm}-${dd}`;
}
