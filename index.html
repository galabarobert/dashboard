<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap" rel="stylesheet">

<style>
html, body { height:100%; }
body {
    margin:0;
    /* Neutrálny sivý podklad – bez zelenej z referenčného obrázka. */
    background: #30343a;
    background-image:
        radial-gradient(ellipse at 12% 15%, rgba(255,255,255,0.075), transparent 45%),
        radial-gradient(ellipse at 88% 82%, rgba(0,0,0,0.14), transparent 48%),
        linear-gradient(145deg, #383c42 0%, #30343a 55%, #282c32 100%);
    color:white;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    position: relative;
    overflow: hidden;
    min-height: 100vh;
    padding-top: env(safe-area-inset-top);
}

#stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    transform-origin: top left;
    z-index: 2;
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: none;
    pointer-events: none;
    z-index: 1;
}

@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Mliečne sivé sklo podľa referencie: bez zeleného tónovania. */
.glass {
    background: linear-gradient(135deg,
        rgba(255,255,255,0.22) 0%,
        rgba(232,235,240,0.13) 52%,
        rgba(255,255,255,0.16) 100%);
    backdrop-filter:blur(38px) saturate(125%);
    -webkit-backdrop-filter:blur(38px) saturate(125%);
    border:1px solid rgba(255,255,255,0.27);
    border-radius:24px;
    padding:15px;
    box-shadow:
        0 12px 30px rgba(0,0,0,0.27),
        0 0 24px rgba(255,255,255,0.045),
        inset 0 1px 1px rgba(255,255,255,0.23),
        inset 0 -1px 0 rgba(255,255,255,0.055);
}

.glow {text-shadow:0 0 15px rgba(255,255,255,0.4);}

#location {position:absolute;top:1px;left:40px;font-size:109px;}
#tempNow {display:none!important;margin-top:0px;font-size:34px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;font-weight:400;}

#clock-box {position:absolute;top:-37px;right:40px;text-align:right;}
#time {font-size:170px;}
#dateWeek {font-size:34px;margin-top:-38px;white-space:nowrap;}

#weather {position:absolute;top:219px;left:40px;font-size:28px;line-height:1.8;width:auto;white-space:nowrap;height:50px;display:flex;align-items:center;display:none;}
#forecast3days {position:absolute;top:147px;left:40px;width:501px;box-sizing:border-box;}
#sun {position:absolute;top:516px;left:40px;width:501px;box-sizing:border-box;font-size:28px;text-align:left;line-height:1.5;}
#nameday {position:absolute;width:501px;min-width:0;font-size:28px;text-align:left;padding-left:25px;white-space:nowrap;box-sizing:border-box;}

#world{
    position:absolute;
    width:auto;
    box-sizing: border-box;
}

#shiftBox{
    position:absolute;
    top:12px;
    left:605px;
    font-size:28px;
    text-align:center;
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
}
#lunchTime{font-size:34px;margin-bottom:10px;}

#shiftBanners {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:48px;
    font-weight:bold;
    text-align:center;
    z-index:100;
}

#currentWeatherBox{
    position:absolute;
    top:175px;
    left:40px;
    font-size:28px;
    text-align:left;
    width:auto;
    white-space:nowrap;
    height:34px;
    display:flex;
    align-items:center;
}

#vacationBox{
    position:absolute;
    top:12px;
    left:1080px;
    width:144px;
    font-size:28px;
    text-align:center;
    padding:11px 6px;
    box-sizing:border-box;
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
}
#vacationTime{font-size:28px;color:white;line-height:1.3;}

#holidayBox{
    position:absolute;
    width:501px;
    font-size:42px;
    text-align:left;
    padding-left:25px;
    box-sizing:border-box;
}
#holidayDisplay{font-size:28px;color:white;line-height:1.3;}

#leaveBox{
    position:absolute;
    top:0;
    left:0;
    box-sizing:border-box;
}

#auditsTable {
    position:absolute;
    top:216px;
    left:50%;
    transform:translateX(calc(-50% - 29.4px)) scale(1.6452230625);
    transform-origin:center top;
    width:auto;
    min-width:300px;
    max-width:419px;
    font-size:14px;
    text-align:center;
}

#miniDatePicker{
    position:absolute;
    z-index:9999;
    background:rgba(30,20,60,0.97);
    backdrop-filter:blur(20px) saturate(180%);
    border:1.5px solid rgba(255,255,255,0.3);
    border-radius:12px;
    padding:10px;
    box-shadow:0 8px 32px rgba(0,0,0,0.5);
    display:none;
    width:220px;
    font-size:13px;
    color:#fff;
}
#miniDatePicker .mdpHeader{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:bold;}
#miniDatePicker .mdpHeader span{cursor:pointer;padding:2px 8px;border-radius:4px;}
#miniDatePicker .mdpHeader span:hover{background:rgba(255,255,255,0.15);}
#miniDatePicker .mdpGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;}
#miniDatePicker .mdpDow{color:#aaa;font-size:11px;padding:2px 0;}
#miniDatePicker .mdpDay{padding:4px 0;border-radius:6px;cursor:pointer;}
#miniDatePicker .mdpDay:hover{background:#00d4ff;color:#001a33;}
#miniDatePicker .mdpDay.empty{cursor:default;}
#miniDatePicker .mdpDay.empty:hover{background:none;}
#miniDatePicker .mdpDay.today{outline:1px solid #00d4ff;}
/* Radio inherits the same glass surface as all dashboard panels. */
#radioPanel{position:absolute;box-sizing:border-box;padding:15px;color:#fff;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 12px;overflow:auto;scrollbar-width:thin;}
#radioPanel button,#radioPanel input{font:inherit;box-sizing:border-box;}
.radioHeading{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;font-size:18px;line-height:22px;}.radioHeading span{font-size:11px;letter-spacing:1px;color:#aaa;}
#radioStations{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;}
#radioPanel button{cursor:pointer;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.10);color:#fff;border-radius:8px;padding:6px 4px;font-size:14px;font-weight:600;line-height:18px;}
#radioPanel button:hover{background:rgba(255,255,255,.22);}#radioPanel button:focus-visible,#radioPanel input:focus-visible{outline:2px solid #00d4ff;outline-offset:2px;}
#radioStations button{font-size:13px;white-space:nowrap;}
#radioStations button[aria-pressed="true"]{background:rgba(75,155,255,.27);color:#d2e8ff;border-color:#60a8ff;box-shadow:inset 0 1px 0 rgba(255,255,255,.15);} 
.radioRotation{
    grid-column:1/-1;
    display:flex;
    flex-direction:row;
    flex-wrap:nowrap; /* Nastavenia a hodinový odpočet sú v jednom riadku. */
    align-items:center;
    gap:12px;
    min-width:0;
    font-size:12px;
    line-height:18px;
    padding:5px 7px;
    border:1px solid rgba(255,255,255,0.10);
    border-radius:12px;
    background:rgba(255,255,255,0.045);
}
.radioRotation label{display:inline-flex;flex:0 0 auto;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;}
.radioRotation input{accent-color:#4b9bff;margin:0;width:16px;height:16px;flex:none;}
.radioRotation small{
    display:block;
    margin-left:auto;
    min-width:0;
    flex:0 1 auto;
    font-size:12px;
    font-variant-numeric:tabular-nums;
    color:#d1e3ff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-align:right;
}
.radioControls{grid-column:1/-1;display:flex;align-items:center;gap:7px;min-width:0;}#radioPlay{border-radius:50%!important;width:34px;height:34px;flex-shrink:0;background:rgba(75,155,255,.27)!important;color:#d2e8ff!important;font-size:17px!important;padding:0!important;}#radioMute{background:transparent!important;border:0!important;font-size:16px!important;padding:2px!important;}#radioVolume{flex:1;width:0;min-width:0;accent-color:#4b9bff;}#radioVolumeLabel{width:37px;flex-shrink:0;font-size:12px;}
.radioFooter{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#aaa;line-height:16px;}#radioStatus{flex:1;min-width:0;}#radioWebsite{color:#8ab4ff;white-space:nowrap;}


/* ===== Motív bližší referenčnému obrázku ===== */
:root{
    --glass-fill-1: rgba(234,241,241,0.18);
    --glass-fill-2: rgba(88,111,118,0.17);
    --glass-fill-3: rgba(128,108,95,0.15);
    --glass-border: rgba(255,255,255,0.18);
    --glass-highlight: rgba(255,255,255,0.18);
    --soft-text: rgba(255,255,255,0.92);
    --muted-text: rgba(229,232,236,0.72);
    --accent-blue: #4e97ff;
    --accent-blue-soft: rgba(78,151,255,0.24);
}
body{
    background:
      radial-gradient(ellipse at 15% 20%, rgba(27,110,94,0.48) 0%, rgba(27,110,94,0.18) 20%, transparent 42%),
      radial-gradient(ellipse at 48% 18%, rgba(8,46,55,0.78) 0%, rgba(8,46,55,0.35) 28%, transparent 56%),
      radial-gradient(ellipse at 92% 18%, rgba(90,66,48,0.42) 0%, rgba(90,66,48,0.20) 22%, transparent 48%),
      linear-gradient(180deg, #071215 0%, #183740 14%, #24434a 28%, #434449 54%, #76675f 76%, #5d4a41 100%) !important;
    color: var(--soft-text) !important;
}
body::before{
    background:
      radial-gradient(circle at 11% 54%, rgba(123,188,111,0.26) 0%, rgba(123,188,111,0.12) 10%, transparent 24%),
      radial-gradient(circle at 48% 73%, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.05) 10%, transparent 21%),
      linear-gradient(90deg, transparent 0%, transparent 73%, rgba(54,32,22,0.34) 73.5%, rgba(54,32,22,0.34) 74.6%, transparent 74.6%, transparent 100%);
    opacity: 1;
}
body::after{
    content:'';
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:32%;
    pointer-events:none;
    z-index:0;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.00) 0%, rgba(255,255,255,0.06) 8%, rgba(0,0,0,0.10) 100%),
      repeating-linear-gradient(90deg,
        rgba(103,77,61,0.88) 0px, rgba(103,77,61,0.88) 118px,
        rgba(83,60,48,0.90) 118px, rgba(83,60,48,0.90) 124px,
        rgba(128,100,80,0.86) 124px, rgba(128,100,80,0.86) 242px,
        rgba(95,71,57,0.88) 242px, rgba(95,71,57,0.88) 248px);
    box-shadow: inset 0 18px 55px rgba(255,255,255,0.05);
}
#stage{ z-index:2; }
#stage::before{
    content:'';
    position:absolute;
    inset:18px;
    border-radius:34px;
    background: linear-gradient(145deg, rgba(238,243,244,0.08), rgba(66,86,95,0.12) 45%, rgba(110,92,80,0.08));
    filter: blur(2px);
    pointer-events:none;
    z-index:-1;
}
.glass,
#currentWeatherBox,
#apiStatusPanel{
    background: linear-gradient(145deg,
      rgba(234,241,241,0.17) 0%,
      rgba(73,92,98,0.20) 44%,
      rgba(118,101,90,0.18) 100%) !important;
    backdrop-filter: blur(34px) saturate(120%) !important;
    -webkit-backdrop-filter: blur(34px) saturate(120%) !important;
    border: 1px solid var(--glass-border) !important;
    box-shadow:
      0 16px 34px rgba(6,13,17,0.28),
      inset 0 1px 0 rgba(255,255,255,0.20),
      inset 0 -1px 0 rgba(255,255,255,0.05),
      0 0 0 1px rgba(255,255,255,0.03) !important;
    color: var(--soft-text);
}
.glass{ border-radius:28px !important; }
#forecast3days, #sun, #nameday, #holidayBox, #world, #radioPanel, #leaveBox, #auditsTable, #shiftBox, #vacationBox{
    overflow:hidden;
}
#currentWeatherBox{
    padding: 8px 18px !important;
    height:auto !important;
    min-height:34px;
    border-radius:18px !important;
}
#location, #time, .radioHeading strong{ color:#f4f7f8; }
#tempNow, #dateWeek, #holidayDisplay, #vacationTime, #currentWeatherDisplay,
#world td, #forecast3days td, #nameday, #sun, #leaveList, #radioStatus, #radioVolumeLabel{
    color:var(--soft-text) !important;
}
#radioPanel .radioHeading span,
#radioRotationStatus,
.radioFooter,
#world td:last-child,
#forecast3days td:last-child,
#dateWeek,
#auditsTable th,
#auditsTable td,
#leaveAddRow,
#auditAddRow,
#vacationTime span,
#holidayDisplay span,
#nameday hr + *{
    color: var(--muted-text) !important;
}
#radioPanel button,
#radioPanel a,
#leaveBox button,
#auditsTable button,
#miniDatePicker .mdpHeader span,
#miniDatePicker .mdpDay,
#apiStatusPanel button{
    background: linear-gradient(145deg, rgba(255,255,255,0.16), rgba(255,255,255,0.07)) !important;
    border: 1px solid rgba(255,255,255,0.17) !important;
    color: #f4f7f8 !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 8px 20px rgba(0,0,0,0.18) !important;
}
#radioPanel button:hover,
#leaveBox button:hover,
#auditsTable button:hover,
#miniDatePicker .mdpHeader span:hover,
#miniDatePicker .mdpDay:hover,
#apiStatusPanel button:hover{
    background: linear-gradient(145deg, rgba(255,255,255,0.21), rgba(255,255,255,0.10)) !important;
}
#radioStations button[aria-pressed="true"],
#radioPlay,
#auditAddRow,
#leaveAddRow{
    background: linear-gradient(145deg, rgba(78,151,255,0.42), rgba(78,151,255,0.19)) !important;
    border-color: rgba(129,186,255,0.55) !important;
    color:#f9fcff !important;
}
#radioMute{ background: linear-gradient(145deg, rgba(255,255,255,0.16), rgba(255,255,255,0.08)) !important; border:1px solid rgba(255,255,255,0.17) !important; border-radius:50% !important; }
#radioVolume{ accent-color: var(--accent-blue); }
#radioRotate, #radioSchedule{ accent-color: var(--accent-blue); }
#radioWebsite{ color:#d7e7ff !important; }
#apiStatusIndicator{
    background: linear-gradient(145deg, rgba(255,255,255,0.38), rgba(255,255,255,0.14)) !important;
    border:1px solid rgba(255,255,255,0.26) !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), 0 8px 20px rgba(0,0,0,0.25) !important;
    backdrop-filter: blur(18px) saturate(120%);
    -webkit-backdrop-filter: blur(18px) saturate(120%);
}
#apiStatusPanel{
    border-radius:16px !important;
    color:#f3f6f7 !important;
}
#miniDatePicker{
    background: linear-gradient(145deg, rgba(47,63,69,0.94), rgba(91,82,79,0.92)) !important;
    border:1px solid rgba(255,255,255,0.18) !important;
}
#miniDatePicker .mdpDay.today{ outline:1px solid rgba(129,186,255,0.9) !important; }
#auditsTable table,
#world table,
#forecast3days table{
    color:var(--soft-text);
}
#auditsTable tr,
#world tr,
#forecast3days tr,
#nameday hr,
#sun hr{
    border-color: rgba(255,255,255,0.12) !important;
}
/* Jemný mliečny vzhľad ikon/ovládania aj mimo panelov */
img, canvas {
    border-radius: 12px;
}


/* Jemne modré pozadie bez plota alebo drevenej podlahy. */
body {
    background:
      radial-gradient(ellipse at 12% 21%, rgba(37, 115, 158, 0.45) 0%, transparent 42%),
      radial-gradient(ellipse at 87% 22%, rgba(41, 83, 150, 0.35) 0%, transparent 49%),
      radial-gradient(ellipse at 54% 73%, rgba(102, 155, 202, 0.20) 0%, transparent 52%),
      linear-gradient(155deg, #0b1c32 0%, #153c61 30%, #27577e 59%, #496b8e 100%) !important;
}
body::before {
    background:
      radial-gradient(ellipse at 19% 54%, rgba(180, 213, 245, 0.08) 0%, transparent 47%),
      radial-gradient(ellipse at 82% 78%, rgba(179, 214, 255, 0.09) 0%, transparent 45%) !important;
    opacity: 1;
}
body::after { display:none !important; content:none !important; }
#stage::before {
    background: linear-gradient(145deg, rgba(219,237,255,0.09), rgba(80,125,164,0.09) 45%, rgba(154,184,215,0.06)) !important;
}
/* Rovnaké mliečne sklo, ale s chladným modrastým nádychom. */
.glass, #apiStatusPanel {
    background: linear-gradient(145deg,
        rgba(223,239,253,0.19) 0%,
        rgba(86,124,165,0.22) 45%,
        rgba(129,161,199,0.16) 100%) !important;
}
/* Prázdne okienko pri aktuálnej teplote vytváralo osamotenú guľôčku. */
#currentWeatherBox { display:none !important; }


/* Rádio: kratší posuvník a viac miesta pre stanicu / aktuálnu skladbu. */
#radioVolume{flex:0 0 138px !important;width:138px !important;max-width:138px !important;}
#radioVolumeLabel{width:34px !important;}
.radioFooter{align-items:center;min-width:0;gap:10px;flex-wrap:nowrap;}
#radioStatus{flex:0 1 auto !important;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;}
#radioNowPlaying{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:#dceaff !important;}
#radioNowPlaying:not([hidden])::before{content:'♪ ';color:#8dbfff;}
#radioNowPlaying[hidden]{display:none !important;}
#radioWebsite{flex:0 0 auto;font-size:12px;}


/* Aktuálna skladba je priamo za ovládaním hlasitosti; spodný riadok je skrytý,
   pričom stavové prvky ostávajú v DOM pre pôvodnú logiku prehrávača. */
#radioPanel .radioFooter{display:none !important;}
#radioPanel .radioControls{display:flex;min-width:0;gap:8px;}
#radioPanel #radioVolume{flex:0 0 138px !important;width:138px !important;min-width:0;}
#radioPanel #radioVolumeLabel{flex:0 0 36px !important;width:36px !important;white-space:nowrap;}
#radioPanel #radioNowPlaying{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;font-size:13px;color:#e6f1ff !important;}
#radioPanel #radioNowPlaying[hidden]{display:none !important;}


/* Jednotné nadpisy panelov v štýle hlavičky rádia. */
.dashboardSectionTitle {
    display:flex;align-items:center;min-height:22px;
    margin:0 0 10px 0; font-size:18px;line-height:22px;
    font-weight:700;color:#f4f7f8;letter-spacing:0;justify-content:center;text-align:center;
}
.radioHeading{justify-content:center !important;position:relative;text-align:center;}
.radioHeading strong{display:block;width:100%;text-align:center;}
.radioHeading span{position:absolute;right:0;top:50%;transform:translateY(-50%);}
/* Všetky hlavičky stĺpcov auditov sú výrazne tučné. */
#auditsTable table tr:first-child th {font-weight:800 !important; color:#fff !important;}
/* Auditový panel je zväčšovaný cez transform(scale), preto menšie základné písmo. */
.auditSectionTitle {font-size:12px;line-height:15px;min-height:15px;margin-bottom:8px;}

/* Jemné červené zvýraznenie celého riadku pri udalostiach do 24 hodín. */
#stage tr.event-soon > td {
  background-color: rgba(255, 128, 140, 0.20) !important;
  border-top: 1px solid rgba(255, 175, 183, 0.24);
  border-bottom: 1px solid rgba(255, 175, 183, 0.24);
}
#stage tr.event-soon > td:first-child { border-radius: 9px 0 0 9px; }
#stage tr.event-soon > td:last-child { border-radius: 0 9px 9px 0; }

/* Lepšia čitateľnosť rádia – bez zmeny pozícií ostatných panelov. */
#radioPanel .radioHeading { font-size:21px !important; line-height:27px !important; }
#radioPanel .radioHeading span { font-size:13px !important; }
#radioPanel #radioStations { gap:8px !important; }
#radioPanel #radioStations button {
  font-size:16px !important;
  line-height:21px !important;
  padding:8px 3px !important;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
#radioPanel .radioRotation {
  font-size:15px !important;
  line-height:22px !important;
  gap:10px !important;
  padding:7px 8px !important;
}
#radioPanel .radioRotation label { gap:6px !important; }
#radioPanel .radioRotation input { width:18px !important; height:18px !important; }
#radioPanel #radioRotationStatus { font-size:15px !important; line-height:22px !important; }
#radioPanel .radioControls { gap:10px !important; min-height:40px; }
#radioPanel #radioPlay { width:39px !important; height:39px !important; font-size:19px !important; }
#radioPanel #radioMute { font-size:20px !important; }
#radioPanel #radioVolume { flex:0 0 112px !important; width:112px !important; max-width:112px !important; }
#radioPanel #radioVolumeLabel { flex:0 0 47px !important; width:47px !important; font-size:16px !important; }

// Spoločný odpočet auditov a neprítomnosti k 7:00 v deň začiatku.
function countdownToSeven(isoDate, now=new Date()){
  const parts=String(isoDate).split('-').map(Number);
  if(parts.length!==3 || parts.some(x=>!Number.isFinite(x))) return {text:'–',color:'#aaa'};
  const target=new Date(parts[0],parts[1]-1,parts[2],7,0,0,0);
  const dayStart=new Date(parts[0],parts[1]-1,parts[2]);
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const calendarDays=Math.round((Date.UTC(parts[0],parts[1]-1,parts[2])-Date.UTC(today.getFullYear(),today.getMonth(),today.getDate()))/86400000);
  if(calendarDays<0 || (calendarDays===0 && now>=target)) return {text:'Dnes',color:'#00d4ff'};
  // Odpočet k 7:00: pri jednom kalendárnom dni alebo menej len celé hodiny, zaokrúhlené nahor.
  if(calendarDays<=1){
    const h=Math.max(1,Math.ceil((target-now)/3600000));
    return {text:'o '+h+' h',color:'#ff6b6b'};
  }
  return {text:'o '+formatDaysSk(calendarDays),color:calendarDays<=3?'#ff6b6b':'#aaa'};
}

function isEventWithin24h(isoDate, now=new Date()) {
  const parts=String(isoDate).split('-').map(Number);
  if(parts.length!==3 || parts.some(x=>!Number.isFinite(x))) return false;
  const start=new Date(parts[0], parts[1]-1, parts[2], 7, 0, 0, 0);
  const todayStart=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  // Po 7:00 v deň udalosti zostáva zvýraznenie počas celého dnešného dňa.
  return (start-now>0 && start-now<=86400000) ||
         (start>=todayStart && start<new Date(todayStart.getTime()+86400000) && now>=start);
}

function formatDaysSk(n){
  if(n===1) return '1 deň';
  if(n>=2 && n<=4) return n+' dni';
  return n+' dní';
}

async function fetchTextViaCorsProxy(targetUrl, timeoutMs){
  for(const proxy of CORS_PROXIES){
    try{
      const proxyUrl = proxy.includes('thingproxy') ? (proxy+targetUrl) : (proxy+encodeURIComponent(targetUrl));
      const r=await fetch(proxyUrl,{signal:AbortSignal.timeout(timeoutMs||7000)});
      if(r.ok) return await r.text();
    }catch(e){ /* skús ďalšie proxy */ }
  }
  return null;
}

function getNameday(d){
  let key = d.getDate()+"."+(d.getMonth()+1);
  let entry = MENINY[key];
  return entry && entry !== "–" ? entry : "nikto";
}

function format(sec){
  sec=Math.floor(sec);
  let h=Math.floor(sec/3600);
  let m=Math.floor((sec%3600)/60);
  return `${h}h ${m}m`;
}

function icon(code){
  if (code === 0 || code === 1 || code === 2) return "☀️";
  if (code === 3) return "⛅";
  if (code === 45 || code === 48) return "🌫️";
  if (code === 51 || code === 53 || code === 55) return "🌦️";
  if (code === 61 || code === 63 || code === 65) return "🌧️";
  if (code === 71 || code === 73 || code === 75) return "❄️";
  if (code === 77) return "🌨️";
  if (code === 80 || code === 81 || code === 82) return "⛈️";
  if (code === 85 || code === 86) return "🌨️";
  if (code === 95 || code === 96 || code === 99) return "⚡";
  return "☁️";
}

function windDir(deg){
  const d=["S","SV","V","JV","J","JZ","Z","SZ"];
  return d[Math.round(deg/45)%8];
}

function getISOWeek(d){
  const date=new Date(d);
  date.setDate(date.getDate()+3-(date.getDay()+6)%7);
  const week1=new Date(date.getFullYear(),0,4);
  return 1+Math.round(((date-week1)/86400000)/7);
}

function updateTime(){
  const n=new Date();
  time.innerText=n.toLocaleTimeString("sk-SK",{hour12:false});
  let d=n.toLocaleDateString("sk-SK",{weekday:"long"});
  d=d.charAt(0).toUpperCase()+d.slice(1);
  dateWeek.innerText=d+" • "+n.toLocaleDateString("sk-SK",{day:"numeric",month:"long",year:"numeric"})+" • týždeň "+getISOWeek(n)+" • Meniny má: "+getNameday(n);
}

// Meniny sa zobrazujú pri dátume a čísle týždňa; updateTime() ich obnoví po polnoci.
function updateNameday(){
  updateTime();
}

const apiStatus = {
  sun: null,
  weather: null,
  worldWeather: null,
  firebase: null,
  radio: null
};
const radioHealth=[];
let radioHealthRunning=false;

function setApiStatus(key, ok){
  apiStatus[key]=ok;
  updateApiStatusIndicator();
}

function updateApiStatusIndicator(){
  const el=document.getElementById('apiStatusIndicator');
  if(!el) return;
  const values=Object.values(apiStatus);
  const allKnown=values.every(v=>v!==null);
  const allOk=values.every(v=>v===true);
  const anyFail=values.some(v=>v===false);
  const anyUnknown=values.some(v=>v==='unknown');

  let color, label;
  if(anyFail){
    color='#ff4d4d';
    label='Niektorá služba alebo rádio má chybu';
  } else if(anyUnknown){
    color='#ffbf47';label='Niektoré služby sa nepodarilo overiť';
  } else if(allKnown && allOk){
    color='#4caf50';
    label='Všetky služby a rádiá sú OK';
  } else {
    color='#888';
    label='Načítavam a kontrolujem služby…';
  }
  el.style.background=color;
  el.style.boxShadow='0 0 8px '+color;

  const names={sun:'Slnko/mesiac', weather:'Počasie Vráble', worldWeather:'Svetové počasie', firebase:'Zdieľaná databáza', radio:'Online rádiá (10 staníc)'};
  const lines=Object.keys(apiStatus).map(k=>{
    const v=apiStatus[k];
    const mark = v===true ? '✓' : (v===false ? '✗' : v==='unknown' ? '?' : '…');
    const markColor = v===true ? '#4caf50' : (v===false ? '#ff4d4d' : v==='unknown' ? '#ffbf47' : '#888');
    return `<div style="margin:2px 0;"><span style="color:${markColor};font-weight:bold;">${mark}</span> ${names[k]}</div>`;
  });
  const panel=document.getElementById('apiStatusPanel');
  if(panel){
    panel.innerHTML=`<div style="font-weight:bold;margin-bottom:6px;color:${color};">${label}</div>`+lines.join('');
    if(radioHealth.length){
      const details=document.createElement('div');
      details.style.cssText='border-top:1px solid #555;margin-top:8px;padding-top:6px;';
      for(const item of radioHealth){
        const row=document.createElement('div');
        row.style.cssText='margin:3px 0;font-size:12px;';
        row.style.color=item.state===true?'#82d487':item.state===false?'#ff8282':item.state==='unknown'?'#ffbf47':'#aaa';
        row.textContent=(item.state===true?'✓ ':item.state===false?'✗ ':item.state==='unknown'?'? ':'… ')+item.name+' — '+item.message;
        if(item.checkedAt)row.title='Overené: '+new Date(item.checkedAt).toLocaleString('sk-SK');
        details.appendChild(row);
      }
      const note=document.createElement('div');note.textContent='Kontrola načítania zvuku • každých 15 minút';note.style.cssText='font-size:11px;color:#aaa;margin:7px 0;';details.appendChild(note);
      const button=document.createElement('button');button.textContent=radioHealthRunning?'Kontrolujem…':'Znova skontrolovať rádiá';button.disabled=radioHealthRunning;button.style.cssText='cursor:pointer;background:#444;color:white;border:1px solid #777;border-radius:5px;padding:5px 8px;';button.onclick=()=>window.checkRadioHealth?.();details.appendChild(button);panel.appendChild(details);
    }
  }
  el.title=label+' (klikni pre detail)';
}

function toggleApiStatusPanel(){
  const panel=document.getElementById('apiStatusPanel');
  if(!panel) return;
  panel.style.display = (panel.style.display==='none' || !panel.style.display) ? 'block' : 'none';
}

// SLNKO - VÝCHOD/ZÁPAD + MESIAC
async function loadSun(){
  try {
    const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=48.24&longitude=18.32&daily=sunrise,sunset&timezone=Europe%2FBratislava&forecast_days=1");
    const data = await res.json();
    
    const sunrise = new Date(data.daily.sunrise[0]).toLocaleTimeString('sk-SK', {hour: '2-digit', minute: '2-digit'});
    const sunset = new Date(data.daily.sunset[0]).toLocaleTimeString('sk-SK', {hour: '2-digit', minute: '2-digit'});
    
    const now = new Date();
    const fullMoonDate = new Date(2026, 5, 30, 1, 57);
    const lunarCycle = 29.53;
    
    let newMoonDate = new Date(fullMoonDate.getTime() - (14.765 * 24 * 60 * 60 * 1000));
    
    while (newMoonDate > now) {
      newMoonDate = new Date(newMoonDate.getTime() - (lunarCycle * 24 * 60 * 60 * 1000));
    }
    
    const daysSinceNewMoon = (now - newMoonDate) / (1000 * 60 * 60 * 24);
    
    let moonEmoji = '🌑';
    let moonName = 'Nový mesiac';
    
    if (daysSinceNewMoon < 1.84) { moonEmoji = '🌑'; moonName = 'Nov'; }
    else if (daysSinceNewMoon < 7.38) { moonEmoji = '🌒'; moonName = 'Dorastajúci mesiac'; }
    else if (daysSinceNewMoon < 9.23) { moonEmoji = '🌓'; moonName = 'Prvá štvrť'; }
    else if (daysSinceNewMoon < 14.77) { moonEmoji = '🌔'; moonName = 'Dorastajúci mesiac'; }
    else if (daysSinceNewMoon < 16.61) { moonEmoji = '🌕'; moonName = 'Spln'; }
    else if (daysSinceNewMoon < 22.15) { moonEmoji = '🌖'; moonName = 'Ubúdajúci mesiac'; }
    else if (daysSinceNewMoon < 23.99) { moonEmoji = '🌗'; moonName = 'Posledná štvrť'; }
    else { moonEmoji = '🌘'; moonName = 'Ubúdajúci mesiac'; }
    
    const today = new Date();
    const isNewMoonDay = today.getDate() === newMoonDate.getDate() && today.getMonth() === newMoonDate.getMonth();
    if (isNewMoonDay) moonName = 'Now';
    
    window.dashboardSunTimes={sunrise,sunset};
    const sunriseNode=document.querySelector('[data-sunrise]');
    const sunsetNode=document.querySelector('[data-sunset]');
    if(sunriseNode) sunriseNode.textContent=sunrise;
    if(sunsetNode) sunsetNode.textContent=sunset;
    document.getElementById('sun').innerHTML = `Východ slnka: ☀️ ${sunrise}<hr style="border:none;border-top:1px solid rgba(255,255,255,0.2);margin:6px 0;">Západ slnka: 🌙 ${sunset}<hr style="border:none;border-top:1px solid rgba(255,255,255,0.2);margin:6px 0;">Fáza mesiaca: ${moonEmoji} ${moonName}`;
    document.getElementById('sun').style.cursor='pointer';
    document.getElementById('sun').onclick=function(){ window.open('https://www.timeanddate.com/astronomy/slovakia/nitra','_blank'); };
    document.getElementById('sun').title='Zdroj: timeanddate.com';
    setApiStatus('sun', true);
  } catch (err) {
    document.getElementById('sun').innerHTML = "☀️ Slnko: Chyba";
    setApiStatus('sun', false);
  }
}

  const data=await res.json();

  function weatherIcon(code){
    if([0].includes(code)) return "🌞";
    if([1,2].includes(code)) return "⛅";

// ZVUK NOTIFIKÁCIA - GONG
function playAlert(){
  try {
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    
    const osc1=ctx.createOscillator();
    const gain1=ctx.createGain();
    osc1.connect(gain1);
    gain1.connect(ctx.destination);
    osc1.frequency.value=180;
    gain1.gain.setValueAtTime(0.6,ctx.currentTime);
    gain1.gain.exponentialRampToValueAtTime(0.05,ctx.currentTime+3.5);
    osc1.start(ctx.currentTime);
    osc1.stop(ctx.currentTime+3.5);
    
    const osc2=ctx.createOscillator();
    const gain2=ctx.createGain();
    osc2.connect(gain2);
    gain2.connect(ctx.destination);
    osc2.frequency.value=360;
    gain2.gain.setValueAtTime(0.4,ctx.currentTime);
    gain2.gain.exponentialRampToValueAtTime(0.02,ctx.currentTime+3.5);
    osc2.start(ctx.currentTime);
    osc2.stop(ctx.currentTime+3.5);
  } catch(e){}
}

// DOVOLENKA + VIANOCE + ZMENA + OBED
function updateVacation(){
  const n=new Date();
  const s=new Date();s.setHours(7,0,0,0);
  const shiftEnd=new Date();shiftEnd.setHours(15,0,0,0);
  const lunchTime=new Date();lunchTime.setHours(10,30,0,0);
  const nextShift=new Date();nextShift.setHours(7,0,0,0);
  while(nextShift<=n || nextShift.getDay()===0 || nextShift.getDay()===6) nextShift.setDate(nextShift.getDate()+1);
  const diffShift=Math.ceil((shiftEnd-n)/1000);
  const diffToShift=(nextShift-n)/1000;
  const today=n.getDay();

  const lunchStart=new Date();lunchStart.setHours(10,30,0,0);
  const lunchEnd=new Date();lunchEnd.setHours(11,30,0,0);
  const beforeLunch=new Date();beforeLunch.setHours(10,15,0,0);
  const soundTime=new Date();soundTime.setHours(11,15,0,0);
  const lateAfternoon=new Date();lateAfternoon.setHours(14,45,0,0);
  
  function getLunchBannerText(){
    if(n<lunchStart && today>=1 && today<=5){
      const diffToLunch=(lunchStart-n)/1000;
      return `🍽️ Obed o: ${format(diffToLunch)}`;
    } else if(n>=lunchStart && n<lunchEnd && today>=1 && today<=5){
      const diffToLunchEnd=(lunchEnd-n)/1000;
      return `🍽️ Obed o: ${format(diffToLunchEnd)}`;
    } else {
      const nextLunch=new Date();nextLunch.setHours(10,30,0,0);
      if(n>=lunchStart || today===0 || today===6){
        nextLunch.setDate(nextLunch.getDate()+1);
      }
      while(nextLunch.getDay()===0 || nextLunch.getDay()===6){
        nextLunch.setDate(nextLunch.getDate()+1);
      }
      const diffNextLunch=(nextLunch-n)/1000;
      return `🍽️ Obed o: ${format(diffNextLunch)}`;
    }
  }
  
  if(n>=s&&n<shiftEnd && today>=1 && today<=5){
    let bannerText = `⏱️ Do konca zmeny: ${format(diffShift)}`;
    bannerText += `<br>${getLunchBannerText()}`;
    
    if(n>=soundTime && n<new Date(soundTime.getTime()+5*60000) && !lunchEndAlertPlayed){
      playAlert();
      lunchEndAlertPlayed=true;
    } else if(n<soundTime || n>=new Date(soundTime.getTime()+5*60000)){
      lunchEndAlertPlayed=false;
    }
    
    document.getElementById('shiftBox').innerHTML = bannerText;
    document.getElementById('shiftBox').style.display="block";
  }
  else {
    let bannerText = `⏱️ Do začiatku zmeny: ${format(diffToShift)}`;
    bannerText += `<br>${getLunchBannerText()}`;
    document.getElementById('shiftBox').innerHTML = bannerText;
    document.getElementById('shiftBox').style.display="block";
  }
  
  const auditCells = document.querySelectorAll('.daysToAudit');
  auditCells.forEach(cell => {
    const startDate = new Date(cell.getAttribute('data-date'));
    const endDate = new Date(cell.getAttribute('data-end') || cell.getAttribute('data-date'));
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    startDate.setHours(0, 0, 0, 0);
    endDate.setHours(0, 0, 0, 0);

    const row = cell.closest('tr');
    const daysAfterEnd = Math.ceil((endDate - today) / (1000 * 60 * 60 * 24));

    if (daysAfterEnd < 0) {
      if (row) row.style.display = 'none';
      return;
    }
    if (row) {
      row.style.display = '';
      row.classList.toggle('event-soon', isEventWithin24h(cell.getAttribute('data-date')));
    }

    const left = countdownToSeven(cell.getAttribute('data-date'));
    cell.textContent = left.text;
    cell.style.color = left.color;
    cell.style.whiteSpace = 'nowrap';
    cell.style.fontSize = '';
    if(typeof shrinkToFit==='function') shrinkToFit(cell, 11);
  });
}

// SVIATKY: tri najbližšie, plus odpočet do Štedrého dňa
function easterSunday(year){
  const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4;
  const f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k+7)%7,m=Math.floor((a+11*h+22*l)/451);
  return new Date(year,Math.floor((h+l-7*m+114)/31)-1,((h+l-7*m+114)%31)+1);
}
function holidaysForYear(y){
  const easter=easterSunday(y);
  const fromEaster=(offset)=>{const d=new Date(easter);d.setDate(d.getDate()+offset);return d;};
  return [
    {date:new Date(y,0,1),name:'Nový rok'},
    {date:new Date(y,0,6),name:'Zjavenie Pána'},
    {date:new Date(y,0,27),name:'Deň pamiatky obetí holokaustu a rasového násilia'},
    {date:fromEaster(-2),name:'Veľký piatok'},
    {date:fromEaster(1),name:'Veľkonočný pondelok'},
    {date:new Date(y,4,1),name:'Sviatok práce'},
    {date:new Date(y,4,8),name:'Deň víťazstva nad fašizmom'},
    {date:new Date(y,6,5),name:'Sviatok svätého Cyrila a svätého Metoda'},
    {date:new Date(y,7,29),name:'Výročie Slovenského národného povstania'},
    {date:new Date(y,8,1),name:'Deň Ústavy Slovenskej republiky'},
    {date:new Date(y,8,15),name:'Sedembolestná Panna Mária'},
    {date:new Date(y,10,1),name:'Sviatok všetkých svätých'},
    {date:new Date(y,10,17),name:'Deň boja za slobodu a demokraciu'},
    {date:new Date(y,11,24),name:'Štedrý deň'},
    {date:new Date(y,11,25),name:'Prvý sviatok vianočný'},
    {date:new Date(y,11,26),name:'Druhý sviatok vianočný'}
  ];
}
function updateHolidays(){
  const n=new Date(),today=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const oneDay=86400000;
  const upcoming=[...holidaysForYear(today.getFullYear()),...holidaysForYear(today.getFullYear()+1)]
    .filter(h=>h.date>=today && !(h.date.getMonth()===11 && [24,25,26].includes(h.date.getDate()))).sort((a,b)=>a.date-b.date).slice(0,3);
  const display=document.getElementById('holidayDisplay');
  if(!display) return;
  const when=(date)=>{
    const days=Math.round((date-today)/oneDay);
    return days===0?'Dnes':days===1?'Zajtra':'o '+days+' dní';
  };
  const row=(name,date)=>`<div class="holidayRow"><span class="holidayName">${name}</span><span class="holidayDate">${["Ne","Po","Ut","St","Št","Pi","So"][date.getDay()]} ${String(date.getDate()).padStart(2,"0")}.${String(date.getMonth()+1).padStart(2,"0")}.</span><span class="holidayWhen">${when(date)}</span></div>`;
  let christmas=new Date(today.getFullYear(),11,24);
  if(christmas<today)christmas=new Date(today.getFullYear()+1,11,24);
  display.innerHTML='<div class="holidayHeading">Sviatky</div>'+
    upcoming.map(h=>row(h.name,h.date)).join('')+
    '<div class="holidayChristmas">'+row('🎄 Do Vianoc',christmas)+'</div>';
  display.style.display='block';
  if(typeof positionLeaveBox==='function') positionLeaveBox();
  if(typeof positionBottomBoxes==='function') positionBottomBoxes();
}

// Skratka dňa podľa slovenského kalendára.
const SHORT_SK_DAYS=['Ne','Po','Ut','St','Št','Pi','So'];
function dayDateShort(date){
  return SHORT_SK_DAYS[date.getDay()]+' '+String(date.getDate()).padStart(2,'0')+'.'+String(date.getMonth()+1).padStart(2,'0')+'.';
}
function eventDateRangeShort(start,end){
  const first=dayDateShort(start);
  if(!end || start.getTime()===end.getTime()) return first;
  return first+' – '+dayDateShort(end);
}

function renderLeave(){
  const list=document.getElementById('leaveList');
  if(!list) return;
  const today=new Date(); today.setHours(0,0,0,0);

  const before=leaveData.length;
  leaveData = leaveData.filter(x=>{
    const e=parseLeaveDate(x.end||x.start); e.setHours(0,0,0,0);
    return Math.ceil((e-today)/86400000) >= 0;
  });
  if(leaveData.length!==before) saveLeave();

  const items = leaveData.map(x=>{
    const s=parseLeaveDate(x.start); s.setHours(0,0,0,0);
    const e=parseLeaveDate(x.end||x.start); e.setHours(0,0,0,0);
    const daysToStart=Math.ceil((s-today)/86400000);
    const datum=eventDateRangeShort(s,e);
    return {...x, s, e, daysToStart, datum};
  });

  const groups={};
  items.forEach(it=>{
    const key=it.start+'|'+(it.end||it.start);
    if(!groups[key]) groups[key]={ datum:it.datum, s:it.s, daysToStart:it.daysToStart, people:[] };
    groups[key].people.push(it);
  });
  const groupList=Object.values(groups).map(g=>{
    g.people.sort((a,b)=> a.name.localeCompare(b.name,'sk'));
    return g;
  }).sort((a,b)=> a.s - b.s);

  if(groupList.length===0){
    list.innerHTML=`<div style="text-align:center;color:#aaa;padding:8px;font-size:28px;">Žiadne plánované voľno</div>`;
  } else {
    let html=`<table style="width:100%;border-collapse:collapse;font-size:22px;table-layout:fixed;">`;
    html+=`<colgroup><col style="width:43%"><col style="width:34%"><col style="width:23%"></colgroup>`;
    groupList.forEach(g=>{
      const countdown=countdownToSeven(g.people[0].start);
      const dni=countdown.text;
      const namesHtml = g.people.map(p=>
        `<span onclick="event.stopPropagation();editLeave('${p.id}')" title="upraviť" style="cursor:pointer;">${p.name}</span>`
      ).join(', ');
      const soon=isEventWithin24h(g.people[0].start);
      html+=`<tr class="${soon?'event-soon':''}" style="border-bottom:1px solid rgba(255,255,255,0.1);">`+
        `<td class="eventDateCell" onclick="event.stopPropagation();editLeave('${g.people[0].id}')" title="upraviť" style="padding:5px 6px;text-align:center;white-space:nowrap;overflow:hidden;cursor:pointer;">${g.datum}</td>`+
        `<td class="leaveNamesCell" style="padding:5px 6px;text-align:center;white-space:nowrap;overflow:hidden;">${namesHtml}</td>`+
        `<td onclick="event.stopPropagation();editLeave('${g.people[0].id}')" title="upraviť" style="padding:5px 6px;text-align:center;white-space:nowrap;overflow:hidden;cursor:pointer;color:#f4f7f8;font-weight:400;">${dni}</td>`+
      `</tr>`;
    });
    html+=`</table>`;
    list.innerHTML=html;
  }
  positionLeaveBox();
  if(typeof positionBottomBoxes==='function') positionBottomBoxes();
  fitAllDashboardTables();
}

function parseDDMM(str, explicitYear){
  if(!str) return '';
  const m=String(str).trim().match(/^(\d{1,2})[.\/](\d{1,2})\.?$/);
  if(!m) return '';
  const day=parseInt(m[1],10), month=parseInt(m[2],10);
  if(day<1||day>31||month<1||month>12) return '';
  let year;
  if(explicitYear){
    year=parseInt(explicitYear,10);
  } else {
    const now=new Date(); now.setHours(0,0,0,0);
    year=now.getFullYear();
    let candidate=new Date(year, month-1, day);
    const diffDays=(now-candidate)/(1000*60*60*24);
    if(diffDays>30){ year+=1; }
  }
  const mm=String(month).padStart(2,'0');
  const dd=String(day).padStart(2,'0');
  return `${year}-${mm}-${dd}`;
}

// Určí veľkosť len podľa reálnej dĺžky obsahu a priestoru v bunke.
// Text nikdy nezväčšuje nad spoločnú veľkosť stĺpca.
function shrinkToFit(el, minFontPx=10, maxFontPx=null){
  if(!el || !el.isConnected || !el.clientWidth) return;
  const cs=getComputedStyle(el);
  const table=el.closest('table');
  const section=el.closest('#auditsTable, #leaveList, #forecast3days, #world, #holidayBox');
  const id=section?.id||'';
  const base=id==='leaveList'?21:id==='auditsTable'?18:id==='forecast3days'?23:id==='world'?21:18;
  const maximum=maxFontPx??base;
  const minimum=id==='auditsTable'?10:id==='leaveList'?12:Math.min(12,minimumSafe(minFontPx));
  const padding=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
  const available=Math.max(1,el.clientWidth-padding-4);
  const text=(el.innerText||el.textContent||'').replace(/\s+/g,' ').trim();
  if(!text) return;
  const canvas=shrinkToFit.measureCanvas||(shrinkToFit.measureCanvas=document.createElement('canvas'));
  const ctx=canvas.getContext('2d');
  const font=cs.fontFamily||'Arial, sans-serif';
  const weight=cs.fontWeight||'400';
  let chosen=maximum;
  for(;chosen>minimum;chosen-=0.25){
    ctx.font=`${weight} ${chosen}px ${font}`;
    if(ctx.measureText(text).width<=available) break;
  }
  el.style.setProperty('font-size',Math.max(minimum,chosen)+'px','important');
  if(chosen<=minimum){ el.title=text; }
}
function minimumSafe(value){return Number(value)||11;}
function fitAllDashboardTables(){

}

const MDP_MONTHS = ['Január','Február','Marec','Apríl','Máj','Jún','Júl','August','September','Október','November','December'];
const MDP_DOWS = ['Po','Ut','St','Št','Pi','So','Ne'];

function mdpRender(){
  const picker = document.getElementById('miniDatePicker');
  const firstDay = new Date(mdpViewYear, mdpViewMonth, 1);
  let startDow = firstDay.getDay();
  startDow = (startDow+6)%7;
  const daysInMonth = new Date(mdpViewYear, mdpViewMonth+1, 0).getDate();
  const now = new Date();

  const monthsFromNow = (mdpViewYear - now.getFullYear())*12 + (mdpViewMonth - now.getMonth());
  const canPrev = monthsFromNow > 0;
  const canNext = monthsFromNow < 12;

  let html = `<div class="mdpHeader">
    <span onclick="event.stopPropagation();mdpPrevMonth()" style="${canPrev?'':'visibility:hidden;'}">‹</span>
    <span style="cursor:default;">${MDP_MONTHS[mdpViewMonth]} ${mdpViewYear}</span>
    <span onclick="event.stopPropagation();mdpNextMonth()" style="${canNext?'':'visibility:hidden;'}">›</span>
  </div>`;
  html += `<div class="mdpGrid">`;
  MDP_DOWS.forEach(d=> html += `<div class="mdpDow">${d}</div>`);
  for(let i=0;i<startDow;i++) html += `<div class="mdpDay empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const isToday = (d===now.getDate() && mdpViewMonth===now.getMonth() && mdpViewYear===now.getFullYear());
    html += `<div class="mdpDay${isToday?' today':''}" onclick="event.stopPropagation();mdpSelect(${d})">${d}</div>`;
  }
  html += `</div>`;
  picker.innerHTML = html;
}

function mdpPrevMonth(){
  const now = new Date();
  const monthsFromNow = (mdpViewYear - now.getFullYear())*12 + (mdpViewMonth - now.getMonth());
  if(monthsFromNow <= 0) return;
  mdpViewMonth--;
  if(mdpViewMonth<0){ mdpViewMonth=11; mdpViewYear--; }
  mdpRender();
}
function mdpNextMonth(){
  const now = new Date();
  const monthsFromNow = (mdpViewYear - now.getFullYear())*12 + (mdpViewMonth - now.getMonth());
  if(monthsFromNow >= 12) return;
  mdpViewMonth++;
  if(mdpViewMonth>11){ mdpViewMonth=0; mdpViewYear++; }
  mdpRender();
}
window.mdpPrevMonth = mdpPrevMonth;
window.mdpNextMonth = mdpNextMonth;
window.mdpSelect = function(day){
  if(mdpTargetInput){
    mdpTargetInput.value = `${day}.${mdpViewMonth+1}.`;
    mdpTargetInput.dataset.year = mdpViewYear;
    mdpTargetInput.dispatchEvent(new Event('input'));
  }
  mdpClose();
};

document.addEventListener('click', (e)=>{
  const picker = document.getElementById('miniDatePicker');
  if(picker.style.display==='block' && !picker.contains(e.target) && e.target!==mdpTargetInput){
    mdpClose();
  }
});

document.addEventListener('click', (e)=>{
  const formRow = document.getElementById('auditFormRow');
  const picker = document.getElementById('miniDatePicker');
  if(formRow && formRow.style.display!=='none' && !formRow.contains(e.target) && !picker.contains(e.target)){
    hideAuditForm();
  }
});

document.addEventListener('click', (e)=>{
  const formRow = document.getElementById('leaveFormRow');
  const picker = document.getElementById('miniDatePicker');
  if(formRow && formRow.style.display!=='none' && !formRow.contains(e.target) && !picker.contains(e.target)){
    hideLeaveForm();
  }
});

['auditDate','auditDateEnd','leaveStart','leaveEnd'].forEach(id=>{
  const el = document.getElementById(id);
  if(el){
    el.readOnly = true;
    el.style.cursor = 'pointer';
    el.addEventListener('click', (e)=>{ e.stopPropagation(); mdpOpen(el); });
  }
});

<script>
// Recompute once the bottom ticker and all page elements exist.
positionBottomBoxes();
if(typeof ResizeObserver!=='undefined'){
  const radioLayoutObserver=new ResizeObserver(()=>positionBottomBoxes());
  radioLayoutObserver.observe(document.getElementById('historicalEvents'));
}
// Online radio player and silent, bounded stream availability checks.
(()=>{
 const stations=[
 ['Europa 2','https://stream.bauermedia.sk/europa2.mp3','https://www.europa2.sk/',128],
 ['Expres','https://stream.bauermedia.sk/128.mp3','https://www.expres.sk/',128],
 ['Fun Rádio','https://stream.funradio.sk/funpgm256.mp3','https://www.funradio.sk/',256],
 ['Rádio Melody','https://stream.bauermedia.sk/melody-hi.mp3','https://www.radiomelody.sk/',128],
 ['Rádio Vlna','https://stream.radiovlna.sk/vlna-hi.mp3','https://radiovlna.sk/',128],
 ['Fun Dance','https://stream.funradio.sk/dance128.mp3','https://www.funradio.sk/',128],
 ['Fun Chill','https://stream.funradio.sk/chill128.mp3','https://www.funradio.sk/',128],
 ['Fun Mileniálky','https://stream.funradio.sk/milenialky128.mp3','https://www.funradio.sk/',128],
 ['Fun CZ/SK','https://stream.funradio.sk/cs128.mp3','https://www.funradio.sk/',128],
 ['Fun 80/90','https://stream.funradio.sk/80-90-128.mp3','https://www.funradio.sk/',128]
 ];
 // Audio loading avoids fetch/CORS restrictions and never plays probe sound.
 stations.forEach(station=>radioHealth.push({name:station[0],state:null,message:'čaká na kontrolu',checkedAt:0}));
 function refreshRadioHealth(){
  const states=radioHealth.map(item=>item.state);
  setApiStatus('radio',states.some(v=>v===false)?false:states.some(v=>v===null)?null:states.some(v=>v==='unknown')?'unknown':true);
 }
 function recordHealth(station,state,message){
  const item=radioHealth.find(item=>item.name===station[0]);
  if(item){Object.assign(item,{state,message,checkedAt:Date.now()});refreshRadioHealth();}
 }
 function probeStream(url){
  return new Promise(resolve=>{
   const probe=new Audio();probe.muted=true;probe.volume=0;probe.preload='auto';
   let finished=false,timeout;
   function done(state,message){
    if(finished)return;finished=true;clearTimeout(timeout);
    probe.onloadeddata=null;probe.oncanplay=null;probe.onerror=null;
    probe.pause();probe.removeAttribute('src');probe.load();resolve({state,message});
   }
   probe.onloadeddata=probe.oncanplay=()=>done(true,'zvuk sa načítal');
   probe.onerror=()=>done(false,'stream sa nepodarilo načítať');
   timeout=setTimeout(()=>done('unknown','neoverené – časový limit'),12000);
   probe.src=url;probe.load();
  });
 }
 window.checkRadioHealth=async()=>{
  if(radioHealthRunning)return;
  radioHealthRunning=true;
  radioHealth.forEach(item=>{item.state=null;item.message='kontrolujem…';});refreshRadioHealth();
  let cursor=0;
  async function worker(){
   while(cursor<stations.length){
    const station=stations[cursor++];
    let result=await probeStream(station[1]);
    if(result.state!==true&&station[0]==='Fun Rádio'){
     const fallback=await probeStream('https://stream.funradio.sk/fun192.mp3');
     if(fallback.state===true)result={state:true,message:'OK • záložný stream 192 kb/s'};
     else {
      const low=await probeStream('https://stream.funradio.sk/fun128.mp3');
      if(low.state===true)result={state:true,message:'OK • záložný stream 128 kb/s'};
      else if([result,fallback,low].some(r=>r.state==='unknown'))result={state:'unknown',message:'neoverené – časový limit'};
     }
    }
    recordHealth(station,result.state,result.message);
   }
  }
  try{await Promise.all([worker(),worker()]);}
  finally{radioHealthRunning=false;refreshRadioHealth();}
 };
 setTimeout(()=>window.checkRadioHealth(),1000);
 setInterval(()=>{if(!document.hidden)window.checkRadioHealth();},15*60*1000);
 refreshRadioHealth();
 const $=id=>document.getElementById(id),audio=$('radioAudio'),status=$('radioStatus'),play=$('radioPlay'),vol=$('radioVolume');
 let selected=stations[0],wanted=false,attempt=0,timer,sourceIndex=0,nextSwitchAt=0;
 const schedule=$('radioSchedule');
 const rotation=$('radioRotate'),rotationStatus=$('radioRotationStatus'),hour=60*60*1000;
 const read=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
 const save=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
 const legacyNames={'Rádio Expres':'Expres','Fun SK/CZ':'Fun CZ/SK','Fun 80’s – 90’s':'Fun 80/90'};
 const savedStation=read('dashboardRadioStation');
 selected=stations.find(s=>s[0]===(legacyNames[savedStation]||savedStation))||selected;
 rotation.checked=read('dashboardRadioRotate')!=='false';
 schedule.checked=read('dashboardRadioSchedule')!=='false';
 let remainingStations=stations.slice(),startedDay='';
 const scheduleClock=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Bratislava',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
 function clock(){const parts=Object.fromEntries(scheduleClock.formatToParts(new Date()).map(p=>[p.type,p.value]));return {day:parts.year+'-'+parts.month+'-'+parts.day,minute:Number(parts.hour)*60+Number(parts.minute)};}
 function inWindow(){const t=clock().minute;return t>=420&&t<1020;}
 function nextRandom(){
  if(!remainingStations.length)remainingStations=stations.slice();
  const eligible=remainingStations.filter(s=>s!==selected);
  const next=eligible[Math.floor(Math.random()*eligible.length)];
  remainingStations=remainingStations.filter(s=>s!==next);return next;
 }
 const nowPlaying=$('radioNowPlaying');
 let metadataToken=0,metadataRequest=0,metadataMisses=0;
 const funMounts={'Fun Rádio':'funpgm256.mp3','Fun Dance':'dance128.mp3','Fun Chill':'chill128.mp3','Fun Mileniálky':'milenialky128.mp3','Fun CZ/SK':'cs128.mp3','Fun 80/90':'80-90-128.mp3'};
 const cleanSong=s=>typeof s==='string'?s.replace(/\s+/g,' ').trim().slice(0,150):'';
 function showSong(title){
  const song=cleanSong(title);
  nowPlaying.hidden=!song;
  nowPlaying.textContent=song;
  nowPlaying.title=song?('Aktuálna skladba: '+song):'Údaje o skladbe nie sú dostupné';
 }
 function resetSong(){metadataToken++;metadataRequest++;metadataMisses=0;showSong('');}
 function getMountSong(data,mount){
  const source=data?.icestats?.source;
  const sources=Array.isArray(source)?source:[source].filter(Boolean);
  const wantedMount=mount.toLowerCase();
  const found=sources.find(x=>{
   const urls=[x.listenurl,x.server_url,x.mount].filter(v=>typeof v==='string');
   return urls.some(url=>{try{return new URL(url,'https://stream.funradio.sk').pathname.toLowerCase().replace(/^\//,'')===wantedMount;}catch(e){return false;}});
  });
  const song=cleanSong(found?.title||found?.yp_currently_playing||found?.stream_title||'');
  return /^(hity,? ktore milujete|fun radio live|unknown|offline)$/i.test(song)?'':song;
 }
 // Europa 2 a Expres publikujú playlist na vlastných stránkach.
 // Úvodné audio reklamy však pridáva samotný poskytovateľ streamu (Bauer Media).
 const officialPlaylistPages={'Europa 2':'https://www.europa2.sk/stream/','Expres':'https://www.expres.sk/stream/'};
 function extractOfficialSong(html,station){
  if(!html||typeof html!=='string')return '';
  const doc=new DOMParser().parseFromString(html,'text/html');
  doc.querySelectorAll('script,style,noscript,svg,nav,footer,header').forEach(el=>el.remove());
  // Official player pages expose song title, artist and recent play time in the markup.
  // Collect text nodes rather than depending on WordPress CSS classes that can change.
  const nodes=[];
  const walk=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);
  while(walk.nextNode()){
   const v=(walk.currentNode.nodeValue||'').replace(/\s+/g,' ').trim();
   if(v&&v.length<180)nodes.push(v);
  }
  const marker=station==='Expres'?nodes.findIndex(t=>/posledn[eé] hran[eé]/i.test(t)):-1;
  const start=Math.max(0,marker);
  const slice=nodes.slice(start);
  const skip=/^(?:64|128|kbps|kvalita|poč[uú]vať|posledn[eé] hran[eé]|live|naživo|playlist|play|pause|rádio expres|europa 2|zobraziť všetky|viac|[•-])$/i;
  for(let i=0;i<slice.length-2;i++){
   if(!/^(?:dnes\s*)?\d{1,2}:\d{2}$/.test(slice[i]))continue;
   const parts=[];
   for(let j=i+1;j<Math.min(i+6,slice.length);j++){
    const val=slice[j];
    if(/^(?:dnes\s*)?\d{1,2}:\d{2}$/.test(val))break;
    if(skip.test(val)||/^\d{1,2}:\d{2}\s/.test(val))continue;
    if(val.length>2&&val.length<100)parts.push(val);
    if(parts.length===2)break;
   }
   if(parts.length>=2){
    // Europa 2 player lists time, song, artist; Expres lists time, song, artist.
    return cleanSong(parts[1]+' – '+parts[0]);
   }
  }
  return '';
 }
 async function fetchOfficialMetadata(station){
  const page=officialPlaylistPages[station];
  if(!page)return '';
  const url=page+(page.includes('?')?'&':'?')+'_='+Date.now();
  let html=null;
  try{
   const res=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(4500)});
   if(res.ok)html=await res.text();
  }catch(e){}
  if(!html){try{html=await fetchTextViaCorsProxy(url,3500);}catch(e){}}
  return extractOfficialSong(html,station);
 }
 async function fetchSongMetadata(){
  if(!wanted||audio.paused||document.hidden)return;
  const station=selected[0],mount=funMounts[station];
  if(!mount&&!officialPlaylistPages[station]){showSong('');return;}
  const token=metadataToken,request=++metadataRequest;
  let song='';
  if(officialPlaylistPages[station]){
   song=await fetchOfficialMetadata(station);
  }else{
   const url='https://stream.funradio.sk/status-json.xsl?_='+Date.now();
   let data=null;
   try{
    const response=await fetch(url,{signal:AbortSignal.timeout(5000),cache:'no-store'});
    if(response.ok)data=await response.json();
   }catch(e){}
   if(!data){try{const raw=await fetchTextViaCorsProxy(url,4500);if(raw)data=JSON.parse(raw);}catch(e){}}
   song=data?getMountSong(data,mount):'';
  }
  if(token!==metadataToken||request!==metadataRequest||!wanted||audio.paused||selected[0]!==station)return;
  if(song){metadataMisses=0;showSong(song);}
  else if(++metadataMisses>=2){showSong('');}
 }
 // Aktualizácia každých 5 sekúnd; obnova aj po návrate na kartu.
 setInterval(fetchSongMetadata,5000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)fetchSongMetadata();});
 const stored=read('dashboardRadioVolume');vol.value=stored!==null&&Number.isFinite(+stored)?Math.max(0,Math.min(100,+stored)):60;
 function volume(){audio.volume=+vol.value/100;$('radioVolumeLabel').textContent=vol.value+' %';save('dashboardRadioVolume',vol.value)}volume();
 function controls(){play.textContent=wanted?'■':'▶';play.setAttribute('aria-label',wanted?'Zastaviť rádio':'Spustiť rádio');}
 function selection(){$('radioWebsite').textContent='Web rádia ↗';[...$('radioStations').children].forEach((b,i)=>b.setAttribute('aria-pressed',String(stations[i]===selected)));$('radioWebsite').hidden=!selected[2];if(selected[2])$('radioWebsite').href=selected[2];}
 function stop(){resetSong();wanted=false;attempt++;nextSwitchAt=0;updateRotation();clearTimeout(timer);audio.pause();audio.removeAttribute('src');audio.load();controls();}
 function fail(message){stop();status.textContent=message;}
 function start(){
  if(schedule.checked&&!inWindow()){stop();status.textContent='Čakám na 7:00 • pre ručné hranie vypni automatický čas.';return;}
  if(schedule.checked)startedDay=clock().day;
  remainingStations=remainingStations.filter(s=>s!==selected);
  stop();wanted=true;const token=++attempt;controls();
  sourceIndex=0;
  const sources=selected[0]==='Fun Rádio'?[selected[1],'https://stream.funradio.sk/fun192.mp3','https://stream.funradio.sk/fun128.mp3']:[selected[1]];
  function connect(){
    if(token!==attempt)return;
    status.textContent='Pripájam: '+selected[0]+'…';audio.src=sources[sourceIndex];audio.load();
    clearTimeout(timer);timer=setTimeout(()=>fallback(),20000);
    const promise=audio.play();if(promise)promise.catch(e=>{
      if(token!==attempt)return;
      if(e.name==='NotAllowedError')fail('Prehliadač vyžaduje kliknutie na ▶.');
      else if(e.name!=='AbortError')fallback();
    });
  }
  let switching=false;
  function fallback(){
    if(token!==attempt||switching)return;
    switching=true;clearTimeout(timer);
    if(sourceIndex+1<sources.length){sourceIndex++;audio.pause();setTimeout(()=>{switching=false;connect();},0);}
    else {recordHealth(selected,false,'prehrávanie zlyhalo');fail('Stream je nedostupný. Skús znova, inú stanicu alebo web rádia.');}
  }
  audio.onerror=()=>{if(wanted)fallback();};connect();
 }
 stations.forEach(s=>{const b=document.createElement('button');b.type='button';b.textContent=s[0];b.title=(s[3]||128)+' kb/s MP3';b.onclick=()=>{selected=s;save('dashboardRadioStation',s[0]);selection();start();};$('radioStations').appendChild(b)});
 selection();status.textContent=selected[0]+' • pripravené na prehrávanie';
 play.onclick=()=>{if(wanted){stop();status.textContent=selected[0]+' • zastavené';}else start();};
 vol.oninput=volume;
 $('radioMute').onclick=()=>{audio.muted=!audio.muted;$('radioMute').textContent=audio.muted?'🔇':'🔊';$('radioMute').setAttribute('aria-label',audio.muted?'Zapnúť zvuk':'Stlmiť zvuk');};
 // Schedule relative to playback start (not the next clock-hour).
 function updateRotation(){
  if(!rotation.checked){rotationStatus.textContent='Automatické striedanie je vypnuté.';rotationStatus.title=rotationStatus.textContent;return;}
  if(!wanted||!nextSwitchAt){rotationStatus.textContent=schedule.checked?'Denne 7:00–17:00 • náhodne bez opakovania':'Spusti rádio • prepnutie po 60 minútach.';rotationStatus.title=rotationStatus.textContent;return;}
  const remaining=Math.max(0,Math.ceil((nextSwitchAt-Date.now())/1000));
  const minutes=Math.floor(remaining/60),seconds=remaining%60;
  rotationStatus.textContent='Náhodné rádio o '+minutes+':'+String(seconds).padStart(2,'0');
  rotationStatus.title='Ďalšia náhodná stanica za '+minutes+' min '+seconds+' s';
 }
 function checkRotation(){
  checkSchedule();
  if(rotation.checked&&wanted&&nextSwitchAt&&Date.now()>=nextSwitchAt){
   selected=nextRandom();
   save('dashboardRadioStation',selected[0]);selection();start();
  }
  updateRotation();
 }
 function checkSchedule(){
  if(!schedule.checked)return;
  const t=clock();
  if(t.minute<420||t.minute>=1020){
   if(wanted){stop();status.textContent='Rádio vypnuté • ďalší štart o 7:00.';}
   return;
  }
  if(startedDay!==t.day){
   startedDay=t.day;
   if(!wanted){selected=nextRandom();save('dashboardRadioStation',selected[0]);selection();start();}
  }
 }
 schedule.onchange=()=>{
  save('dashboardRadioSchedule',String(schedule.checked));
  if(schedule.checked){startedDay='';checkSchedule();}
  updateRotation();
 };
 rotation.onchange=()=>{
  save('dashboardRadioRotate',String(rotation.checked));
  nextSwitchAt=rotation.checked&&wanted&&!audio.paused&&audio.readyState>=3?Date.now()+hour:0;
  updateRotation();
 };
 setInterval(checkRotation,1000);
 document.addEventListener('visibilitychange',checkRotation);
 window.addEventListener('pageshow',checkRotation);
 updateRotation();
 audio.addEventListener('playing',()=>{if(!wanted)return;fetchSongMetadata();recordHealth(selected,true,'práve hrá');clearTimeout(timer);if(rotation.checked&&!nextSwitchAt)nextSwitchAt=Date.now()+hour;updateRotation();status.textContent='● Naživo: '+selected[0]+(stations.includes(selected)?' • '+(selected[0]==='Fun Rádio'?[256,192,128][sourceIndex]:128)+' kb/s':'');});
 audio.addEventListener('waiting',()=>{if(wanted)status.textContent='Načítavam zvuk: '+selected[0]+'…';});
 audio.addEventListener('ended',()=>{if(wanted)fail('Vysielanie sa skončilo. Klikni na ▶ pre nové pripojenie.');});
 checkSchedule();
})();
</script>
