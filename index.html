// Určí veľkosť len podľa reálnej dĺžky obsahu a priestoru v bunke.
// Text nikdy nezväčšuje nad spoločnú veľkosť stĺpca.
function shrinkToFit(el, minFontPx=10, maxFontPx=null){
  if(!el || !el.isConnected || !el.clientWidth) return;
  const cs=getComputedStyle(el);
  const table=el.closest('table');
  const section=el.closest('#auditsTable, #leaveList, #forecast3days, #world, #holidayBox');
  const id=section?.id||'';
  const base=id==='leaveList'?22:id==='auditsTable'?22:id==='forecast3days'?19:id==='world'?19:18;
  const maximum=maxFontPx??base;
  const minimum=id==='auditsTable'?10:id==='leaveList'?12:Math.min(12,minimumSafe(minFontPx));
  const padding=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
  const available=Math.max(1,el.clientWidth-padding-4);
  const text=(el.innerText||el.textContent||'').replace(/\s+/g,' ').trim();
  if(!text) return;
  const canvas=shrinkToFit.measureCanvas||(shrinkToFit.measureCanvas=document.createElement('canvas'));
  const ctx=canvas.getContext('2d');
  const font=cs.fontFamily||'Arial, sans-serif';
  const weight=cs.fontWeight||'400';
  let chosen=maximum;
  for(;chosen>minimum;chosen-=0.25){
    ctx.font=`${weight} ${chosen}px ${font}`;
    if(ctx.measureText(text).width<=available) break;
  }
  el.style.setProperty('font-size',Math.max(minimum,chosen)+'px','important');
  if(chosen<=minimum){ el.title=text; }
}
function minimumSafe(value){return Number(value)||11;}
function fitAllDashboardTables(){
  ['forecast3days','world','auditsTable','leaveList','holidayBox'].forEach(id=>{
    const section=document.getElementById(id);

      if(id==='auditsTable') el.style.removeProperty('font-size');
      shrinkToFit(el,id==='auditsTable'?18:id==='leaveList'?12:11);
    });
  });
}

// SPRÁVY TERAZ.SK – odolné načítavanie z viacerých brán a lokálna záloha.
const NEWS_QUEUE_MAX = 50;
const NEWS_RSS_URL = 'https://www.teraz.sk/rss/vsetky-spravy.rss';
const NEWS_FEEDS = [
  {url:'https://www.teraz.sk/rss/vsetky-spravy.rss',category:''}
];
const NEWS_CACHE_KEY = 'dashboardTasrOnlyNewsCacheV1';
let newsQueue = [];
let newsUpdating = false;
let lastNewsSuccess = null;
let newsRetryTimer = null;
let newsActiveIndex=0;
let newsRotationTimer=null;
const NEWS_DISPLAY_MS=10000;

function setNewsStatus(message, error = false){
  const status=document.getElementById('newsUpdateStatus');
  if(!status) return;
  status.textContent=message;
  status.title=message;
  status.style.color=error?'#ffe1c9':'#fff';
}

function normalizeNews(raw,idx){
  const title=String(raw.title||'').replace(/\s+/g,' ').trim();
  const pubDate=raw.pubDate||raw.published||raw.date||'';
  const parsedDate=typeof raw.when==='number' && Number.isFinite(raw.when) ? raw.when : Date.parse(pubDate);
  let url='';
  try{
    const link=new URL(String(raw.url||raw.link||''));
    if(['https:','http:'].includes(link.protocol) &&
       (['teraz.sk','sita.sk','aktuality.sk'].some(domain=>link.hostname===domain || link.hostname.endsWith('.'+domain)))) url=link.href;
  }catch(e){}
  return {title, url, when:Number.isFinite(parsedDate)?parsedDate:0, idx, category:String(raw.category||raw.categories?.[0]||'').trim(), source:url.includes('sita.sk')?'SITA':url.includes('aktuality.sk')?'Aktuality.sk':'TASR / Teraz.sk'};
}
function sortAndValidateNews(rows){
  if(!Array.isArray(rows)) throw new Error('Neznámy formát zoznamu');
  const valid=rows.map(normalizeNews).filter(item=>item.title.length>10 && item.url);
  if(!valid.length) throw new Error('Zdroj nevrátil platné titulky');
  valid.sort((a,b)=>b.when-a.when || a.idx-b.idx);
  return valid.slice(0,NEWS_QUEUE_MAX);
}
function parseNewsXML(xmlText){
  if(typeof xmlText!=='string' || !xmlText.trim()) throw new Error('Prázdna odpoveď RSS');
  const xml=new DOMParser().parseFromString(xmlText,'application/xml');
  if(xml.querySelector('parsererror')) throw new Error('Proxy vrátilo neplatné RSS XML');
  const items=Array.from(xml.querySelectorAll('item'));
  if(!items.length) throw new Error('V odpovedi nie sú RSS články');
  return sortAndValidateNews(items.map(item=>({
    title:item.querySelector('title')?.textContent||'',
    link:item.querySelector('link')?.textContent||'',
    pubDate:item.querySelector('pubDate')?.textContent||'',
    category:item.querySelector('category')?.textContent||''
  })));
}
async function newsFetch(url, timeoutMs=8500){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  try{
    const response=await fetch(url,{signal:controller.signal,cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    return response;
  }finally{clearTimeout(timer);}
}
async function newsFromXMLProxy(base){
  const response=await newsFetch(base,8500);
  // Platná HTTP odpoveď nie je ešte platné RSS: každú bránu overíme osobitne.
  return parseNewsXML(await response.text());
}
async function newsFromJSONConverter(feedUrl=NEWS_RSS_URL){
  const url='https://api.rss2json.com/v1/api.json?rss_url='
    +encodeURIComponent(feedUrl)+'&count=50';
  const response=await newsFetch(url,9500);
  const data=await response.json();
  if(data.status!=='ok') throw new Error('RSS2JSON: '+String(data.message||data.status||'chyba'));
  return sortAndValidateNews(data.items||[]);
}
async function newsFromAllOriginsJSON(feedUrl=NEWS_RSS_URL){
  const url='https://api.allorigins.win/get?url='+encodeURIComponent(feedUrl);
  const response=await newsFetch(url,8500);
  const data=await response.json();
  return parseNewsXML(data.contents);
}
async function loadNewsFeed(feed){
  const url=feed.url;
  let rows;
  try{
    rows=await Promise.any([
      newsFromXMLProxy('https://proxy.cors.dev/'+url),
      newsFromJSONConverter(url)
    ]);
  }catch(primaryError){
    rows=await Promise.any([
      newsFromAllOriginsJSON(url),
      newsFromXMLProxy('https://corsproxy.io/?url='+encodeURIComponent(url)),
      newsFromXMLProxy('https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(url))
    ]);
  }
  // Pre jednotlivé RSS rubriky použiť ich explicitnú kategóriu, ak RSS kategória chýba.
  return rows.filter(item=>/^https?:\/\/(?:[^/]+\.)?teraz\.sk\//i.test(item.url)).map(item=>({...item,category:item.category || feed.category,source:'TASR / Teraz.sk'}));
}
function newsPriority(item, now=Date.now()){
  // Prednosť má dátum a čas publikovania, nie rubrika článku.
  // Mimoriadne udalosti získajú iba obmedzené časové zvýhodnenie
  // (max. 90 minút), ktoré počas 24 hodín postupne zanikne.
  const published=Number(item.when)||0;
  const ageMs=Math.max(0,now-published);
  const title=String(item.title||'').toLocaleLowerCase('sk-SK');
  const urgent=/mimoriadn|urgentn|výstrah|vystrah|varovan|povod[eňn]|zemetrasen|evaku|výbuch|vybuch|explóz|explozi|terorist|útok|utok|katastrof|tornád|tornad|požiar|poziar|havári|havari|tragéd|traged|smrteľn|smrteln|krízov|krizov/.test(title);
  const urgencyFade=Math.max(0,1-ageMs/(24*3600000));
  const urgencyBonus=urgent ? urgencyFade*90*60000 : 0;
  return published+urgencyBonus;
}
function newsDedupKey(item){
  return item.title.toLocaleLowerCase('sk-SK').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'').slice(0,115);
}
function selectTopNews(rows){
  // Najnovšie články ako prvé. Mimoriadne udalosti môžu predbehnúť
  // iba časovo blízke bežné správy; za kategórie sa body neprideľujú.
  const now=Date.now();
  const ordered=rows.map(normalizeNews).filter(x=>x.title.length>10&&/^https?:\/\/(?:[^/]+\.)?teraz\.sk\//i.test(x.url)&&x.when>now-72*3600000);
  ordered.sort((a,b)=>newsPriority(b,now)-newsPriority(a,now)||b.when-a.when);
  const unique=[],links=new Set(),titles=new Set();
  for(const item of ordered){
    const key=newsDedupKey(item);
    if(links.has(item.url)||titles.has(key))continue;
    links.add(item.url);titles.add(key);unique.push(item);
    if(unique.length>=NEWS_QUEUE_MAX)break;
  }
  return unique;
}
async function fetchFreshNews(){
  const results=await Promise.allSettled(NEWS_FEEDS.map(loadNewsFeed));
  const fetched=results.filter(r=>r.status==='fulfilled').flatMap(r=>r.value);
  if(!fetched.length)throw new Error('Nedostupné všetky RSS kanály');
  const selected=selectTopNews(fetched);
  if(!selected.length)throw new Error('RSS TASR neobsahuje platné aktuálne články');
  return selected;
}
function classifyNews(item){
  const direct=String(item.category||'').toLowerCase();
  const title=String(item.title||'').toLowerCase();
  const both=direct+' '+title;
  if(/počas|meteorolog|výstrah|vystrah|búrk|vietor|povodeň|teplot|shmú/.test(both))return 'POČASIE';
  if(/šport|sport|futbal|hokej|tenis|nhl|olympi|liga majstrov|f1\b|formula/.test(both))return 'ŠPORT';
  if(/politika|vlád|vlada|parlament|minister|premiér|prezident|nrsr|voľb|volb|koalíci|opozíci|fico|pell[eé]grini/.test(both))return 'POLITIKA';
  if(/ekonomik|financ|banka|infláci|podnik|firma|úrok|dane|rozpoč|investíci/.test(both))return 'EKONOMIKA';
  if(/kultúr|film|divadl|hudb|koncert|festival|knih|umenie/.test(both))return 'KULTÚRA';
  if(/svet|zahranič|usa|európsk|ukrajin|rusko|čína|nato/.test(both))return 'SVET';
  if(/veda|technológi|umelá inteligencia|vesmír|výskum|it\b/.test(both))return 'VEDA A TECHNIKA';
  if(/zdrav|nemocnic|lekár|chorob|liečb/.test(both))return 'ZDRAVIE';
  if(/región|region|kraj|mesto|obec|nitra|bratislav|trnav|žilina/.test(both))return 'REGIÓNY';
  return direct ? direct.toLocaleUpperCase('sk-SK').slice(0,27) : 'SPRÁVY';
}
function fullNewsList(){
  return newsQueue;
}
function setNewsMarqueeSpeed(){
  // Pôvodné vodorovné posúvanie sa už nepoužíva.
}
function showNewsAt(index, animated=true){
  const scroll=document.getElementById('eventScroll');
  const counter=document.getElementById('newsSlideCounter');
  const visible=fullNewsList();
  if(!scroll || !visible.length){
    if(counter) counter.textContent='0 / 0';
    return;
  }
  newsActiveIndex=((index%visible.length)+visible.length)%visible.length;
  const item=visible[newsActiveIndex];
  const a=document.createElement('a');
  a.href=item.url;
  a.target='_blank';
  a.rel='noopener noreferrer';
  a.textContent=item.title;
  a.title='Otvoriť článok ('+item.source+')';
  const category=document.createElement('span');category.className='newsTopic';category.textContent=classifyNews(item);
  scroll.replaceChildren(category,a);
  requestAnimationFrame(fitCurrentNewsTitle);
  if(counter)counter.textContent=(newsActiveIndex+1)+' / '+visible.length;
  scroll.classList.remove('newsSlideEnter');
  if(animated){
    void scroll.offsetWidth; // reštartovať len krátku animáciu príchodu zdola
    scroll.classList.add('newsSlideEnter');
  }
}
function fitCurrentNewsTitle(){
  const container=document.getElementById('eventScroll');
  const title=container?.querySelector('a');
  if(!container||!title)return;
  // Pri každom novom článku vyber najväčšie písmo, ktoré sa zmestí do jedného riadka.
  title.style.setProperty('font-size','36px','important');
  const available=title.clientWidth;
  if(available<=0)return;
  const canvas=fitCurrentNewsTitle.canvas||(fitCurrentNewsTitle.canvas=document.createElement('canvas'));
  const ctx=canvas.getContext('2d');
  const style=getComputedStyle(title);
  const weight=style.fontWeight;
  const family=style.fontFamily;
  for(let size=36;size>=12;size--){
    ctx.font=weight+' '+size+'px '+family;
    if(ctx.measureText(title.textContent).width <= available-5){
      title.style.setProperty('font-size',size+'px','important');
      return;
    }
  }
  title.style.setProperty('font-size','12px','important');
}
window.addEventListener('resize',()=>requestAnimationFrame(fitCurrentNewsTitle));

function drawNewsQueue(){
  if(!newsQueue.length)return;
  showNewsAt(Math.min(newsActiveIndex,fullNewsList().length-1),false);
  if(!newsRotationTimer){
    newsRotationTimer=setInterval(()=>{
      if(document.hidden || !newsQueue.length)return;
      showNewsAt(newsActiveIndex+1,true);
    },NEWS_DISPLAY_MS);
  }
}
function restoreSavedNews(){
  // Pri zmene vydania zachovať staršiu zálohu TASR (nikdy nepoužiť SITA).
  const cacheKeys=[NEWS_CACHE_KEY,'dashboardTerazNewsCacheV3'];
  for(const key of cacheKeys){
    try{
      const data=JSON.parse(localStorage.getItem(key)||'null');
      if(!data || !Array.isArray(data.items))continue;
      const cached=selectTopNews(data.items);
      if(!cached.length)continue;
      newsQueue=cached;
      if(Number.isFinite(data.savedAt))lastNewsSuccess=new Date(data.savedAt);
      drawNewsQueue();
      setNewsStatus('Zobrazené uložené správy • overujem nové…',true);
      return;
    }catch(e){console.info('Správy: záloha nebola dostupná.',e);}
  }
}
function saveNewsLocally(){
  try{localStorage.setItem(NEWS_CACHE_KEY,JSON.stringify({
    items:newsQueue,savedAt:Date.now()
  }));}catch(e){console.info('Správy: prehliadač neumožňuje uložiť zálohu.');}
}
async function updateNewsQueue(){
  if(newsUpdating) return;
  newsUpdating=true;
  try{
    const fresh=await fetchFreshNews();
    const previousUrl=fullNewsList()[newsActiveIndex]?.url;
    const updated=selectTopNews(fresh.concat(newsQueue));
    if(!updated.length)throw new Error('Načítali sa prázdne správy');
    newsQueue=updated;
    if(previousUrl){
      const found=fullNewsList().findIndex(item=>item.url===previousUrl);
      newsActiveIndex=found>=0?found:0;
    }
    drawNewsQueue();
    lastNewsSuccess=new Date();
    saveNewsLocally();
    setNewsStatus('Správy aktualizované '+lastNewsSuccess.toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'}));
    setApiStatus('news',true);
    if(newsRetryTimer){clearTimeout(newsRetryTimer);newsRetryTimer=null;}
  }catch(err){
    console.warn('TASR / Teraz.sk: načítanie cez dostupné brány zlyhalo:',err);
    setApiStatus('news',false);
    setNewsStatus(lastNewsSuccess && newsQueue.length
      ? 'Správy: uložené z '+lastNewsSuccess.toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'})+' • zdroj nedostupný ⚠'
      : 'Správy: zdroj dočasne nedostupný ⚠',true);
    if(!newsQueue.length){
      const scroll=document.getElementById('eventScroll');
      if(scroll){
        const a=document.createElement('a');
        a.href='https://www.teraz.sk/';
        a.target='_blank';a.rel='noopener noreferrer';
        a.textContent='Správy sa nepodarilo načítať. Otvoriť Teraz.sk (TASR) ↗';
        scroll.replaceChildren(a);
        const counter=document.getElementById('newsSlideCounter');
        if(counter)counter.textContent='0 / 0';
      }
    }
    if(!newsRetryTimer){
      newsRetryTimer=setTimeout(()=>{newsRetryTimer=null;updateNewsQueue();},60*1000);
    }
  }finally{newsUpdating=false;}
}

// Spúšťame až po vytvorení spodnej tabuľky; pri file:// by sa inak
// prvá obnovená položka vykresľovala do ešte neexistujúceho prvku.

function startNewsFeed(){

}

  document.addEventListener('DOMContentLoaded',startNewsFeed,{once:true});
}else{startNewsFeed();}

// ===== MINI DATE PICKER =====
let mdpTargetInput = null;
let mdpViewMonth = new Date().getMonth();
let mdpViewYear = new Date().getFullYear();

function mdpOpen(inputEl){
  mdpTargetInput = inputEl;
  const now = new Date();
  const m = (inputEl.value||'').trim().match(/^(\d{1,2})[.\/](\d{1,2})\.?$/);
  if(m){
    mdpViewMonth = parseInt(m[2],10)-1;
    mdpViewYear = inputEl.dataset.year ? parseInt(inputEl.dataset.year,10) : now.getFullYear();
  } else {
    mdpViewMonth = now.getMonth();
    mdpViewYear = now.getFullYear();
  }
  mdpRender();
  const picker = document.getElementById('miniDatePicker');
  const rect = inputEl.getBoundingClientRect();
  picker.style.display = 'block';
  let top = rect.bottom + window.scrollY + 6;
  let left = rect.left + window.scrollX;
  if(left + 220 > window.innerWidth) left = window.innerWidth - 230;
  picker.style.top = top + 'px';
  picker.style.left = left + 'px';
}

function mdpClose(){
  document.getElementById('miniDatePicker').style.display = 'none';
  mdpTargetInput = null;
}

const MDP_MONTHS = ['Január','Február','Marec','Apríl','Máj','Jún','Júl','August','September','Október','November','December'];
const MDP_DOWS = ['Po','Ut','St','Št','Pi','So','Ne'];

function mdpRender(){
  const picker = document.getElementById('miniDatePicker');
  const firstDay = new Date(mdpViewYear, mdpViewMonth, 1);
  let startDow = firstDay.getDay();
  startDow = (startDow+6)%7;
  const daysInMonth = new Date(mdpViewYear, mdpViewMonth+1, 0).getDate();
  const now = new Date();

  const monthsFromNow = (mdpViewYear - now.getFullYear())*12 + (mdpViewMonth - now.getMonth());
  const canPrev = monthsFromNow > 0;
  const canNext = monthsFromNow < 12;

  let html = `<div class="mdpHeader">
    <span onclick="event.stopPropagation();mdpPrevMonth()" style="${canPrev?'':'visibility:hidden;'}">‹</span>
    <span style="cursor:default;">${MDP_MONTHS[mdpViewMonth]} ${mdpViewYear}</span>
    <span onclick="event.stopPropagation();mdpNextMonth()" style="${canNext?'':'visibility:hidden;'}">›</span>
  </div>`;
  html += `<div class="mdpGrid">`;
  MDP_DOWS.forEach(d=> html += `<div class="mdpDow">${d}</div>`);
  for(let i=0;i<startDow;i++) html += `<div class="mdpDay empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const isToday = (d===now.getDate() && mdpViewMonth===now.getMonth() && mdpViewYear===now.getFullYear());
    html += `<div class="mdpDay${isToday?' today':''}" onclick="event.stopPropagation();mdpSelect(${d})">${d}</div>`;
  }
  html += `</div>`;
  picker.innerHTML = html;
}

function mdpPrevMonth(){
  const now = new Date();
  const monthsFromNow = (mdpViewYear - now.getFullYear())*12 + (mdpViewMonth - now.getMonth());
  if(monthsFromNow <= 0) return;
  mdpViewMonth--;
  if(mdpViewMonth<0){ mdpViewMonth=11; mdpViewYear--; }
  mdpRender();
}
function mdpNextMonth(){
  const now = new Date();
  const monthsFromNow = (mdpViewYear - now.getFullYear())*12 + (mdpViewMonth - now.getMonth());
  if(monthsFromNow >= 12) return;
  mdpViewMonth++;
  if(mdpViewMonth>11){ mdpViewMonth=0; mdpViewYear++; }
  mdpRender();
}
window.mdpPrevMonth = mdpPrevMonth;
window.mdpNextMonth = mdpNextMonth;
window.mdpSelect = function(day){
  if(mdpTargetInput){
    mdpTargetInput.value = `${day}.${mdpViewMonth+1}.`;
    mdpTargetInput.dataset.year = mdpViewYear;
    mdpTargetInput.dispatchEvent(new Event('input'));
  }
  mdpClose();
};

document.addEventListener('click', (e)=>{
  const picker = document.getElementById('miniDatePicker');
  if(picker.style.display==='block' && !picker.contains(e.target) && e.target!==mdpTargetInput){
    mdpClose();
  }
});

document.addEventListener('click', (e)=>{
  const formRow = document.getElementById('auditFormRow');
  const picker = document.getElementById('miniDatePicker');
  if(formRow && formRow.style.display!=='none' && !formRow.contains(e.target) && !picker.contains(e.target)){
    hideAuditForm();

document.addEventListener('click', (e)=>{
  const formRow = document.getElementById('leaveFormRow');
  const picker = document.getElementById('miniDatePicker');
  if(formRow && formRow.style.display!=='none' && !formRow.contains(e.target) && !picker.contains(e.target)){
    hideLeaveForm();
  }
});

['auditDate','auditDateEnd','leaveStart','leaveEnd'].forEach(id=>{
  const el = document.getElementById(id);
  if(el){
    el.readOnly = true;
    el.style.cursor = 'pointer';
    el.addEventListener('click', (e)=>{ e.stopPropagation(); mdpOpen(el); });

// Online radio player and silent, bounded stream availability checks.
(()=>{
 const stations=[
 ['Europa 2','https://stream.bauermedia.sk/europa2.mp3','https://www.europa2.sk/',128],
 ['Expres','https://stream.bauermedia.sk/128.mp3','https://www.expres.sk/',128],

 ['Rádio Melody','https://stream.bauermedia.sk/melody-hi.mp3','https://www.radiomelody.sk/',128],

 ['Rádio Rock','https://stream.bauermedia.sk/rock-hi.mp3','https://radiorock.sk/',128],

  const states=radioHealth.map(item=>item.state);

  const item=radioHealth.find(item=>item.name===station[0]);

 function probeStream(url){
  return new Promise(resolve=>{
   const probe=new Audio();probe.muted=true;probe.volume=0;probe.preload='auto';
   let finished=false,timeout;
   function done(state,message){
    if(finished)return;finished=true;clearTimeout(timeout);
    probe.onloadeddata=null;probe.oncanplay=null;probe.onerror=null;
    probe.pause();probe.removeAttribute('src');probe.load();resolve({state,message});
   }
   probe.onloadeddata=probe.oncanplay=()=>done(true,'zvuk sa načítal');
   probe.onerror=()=>done(false,'stream sa nepodarilo načítať');
   timeout=setTimeout(()=>done('unknown','neoverené – časový limit'),12000);
   probe.src=url;probe.load();
  });

 window.checkRadioHealth=async()=>{
  if(radioHealthRunning)return;

   while(cursor<stations.length){

     const fallback=await probeStream('https://stream.funradio.sk/fun192.mp3');

     }

   }

 setTimeout(()=>window.checkRadioHealth(),1000);
 setInterval(()=>{if(!document.hidden)window.checkRadioHealth();},60*60*1000);
 refreshRadioHealth();
 const $=id=>document.getElementById(id),audio=$('radioAudio'),status=$('radioStatus'),play=$('radioPlay'),vol=$('radioVolume');
 let selected=stations[0],wanted=false,attempt=0,timer,sourceIndex=0,nextSwitchAt=0;
 const schedule=$('radioSchedule');
 const rotation=$('radioRotate'),rotationStatus=$('radioRotationStatus'),hour=60*60*1000;
 const read=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
 const save=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
 const legacyNames={'Rádio Expres':'Expres','Fun SK/CZ':'Fun CZ/SK','Fun 80’s – 90’s':'Fun 80/90'};

 }
 const nowPlaying=$('radioNowPlaying');
 let metadataToken=0,metadataRequest=0,metadataMisses=0;

 function resetSong(){metadataToken++;metadataRequest++;metadataMisses=0;showSong('');}
 function getMountSong(data,mount){
  const source=data?.icestats?.source;
  const sources=Array.isArray(source)?source:[source].filter(Boolean);
  const wantedMount=mount.toLowerCase();
  const found=sources.find(x=>{
   const urls=[x.listenurl,x.server_url,x.mount].filter(v=>typeof v==='string');
   return urls.some(url=>{try{return new URL(url,'https://stream.funradio.sk').pathname.toLowerCase().replace(/^\//,'')===wantedMount;}catch(e){return false;}});
  });
  const song=cleanSong(found?.title||found?.yp_currently_playing||found?.stream_title||'');

 // Europa 2 a Expres publikujú playlist na vlastných stránkach.
 // Úvodné audio reklamy však pridáva samotný poskytovateľ streamu (Bauer Media).
 const officialPlaylistPages={'Europa 2':'https://www.europa2.sk/stream/','Expres':'https://www.expres.sk/stream/'};
 function extractOfficialSong(html,station){
  if(!html||typeof html!=='string')return '';
  const doc=new DOMParser().parseFromString(html,'text/html');
  doc.querySelectorAll('script,style,noscript,svg,nav,footer,header').forEach(el=>el.remove());
  // Official player pages expose song title, artist and recent play time in the markup.
  // Collect text nodes rather than depending on WordPress CSS classes that can change.
  const nodes=[];
  const walk=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);
  while(walk.nextNode()){
   const v=(walk.currentNode.nodeValue||'').replace(/\s+/g,' ').trim();
   if(v&&v.length<180)nodes.push(v);
  }
  const marker=station==='Expres'?nodes.findIndex(t=>/posledn[eé] hran[eé]/i.test(t)):-1;
  const start=Math.max(0,marker);
  const slice=nodes.slice(start);
  const skip=/^(?:64|128|kbps|kvalita|poč[uú]vať|posledn[eé] hran[eé]|live|naživo|playlist|play|pause|rádio expres|europa 2|zobraziť všetky|viac|[•-])$/i;
  for(let i=0;i<slice.length-2;i++){
   if(!/^(?:dnes\s*)?\d{1,2}:\d{2}$/.test(slice[i]))continue;
   const parts=[];
   for(let j=i+1;j<Math.min(i+6,slice.length);j++){
    const val=slice[j];
    if(/^(?:dnes\s*)?\d{1,2}:\d{2}$/.test(val))break;
    if(skip.test(val)||/^\d{1,2}:\d{2}\s/.test(val))continue;
    if(val.length>2&&val.length<100)parts.push(val);
    if(parts.length===2)break;
   }
   if(parts.length>=2){
    // Europa 2 player lists time, song, artist; Expres lists time, song, artist.
    return cleanSong(parts[1]+' – '+parts[0]);
   }
  }
  return '';
 }
 async function fetchOfficialMetadata(station){
  const page=officialPlaylistPages[station];
  if(!page)return '';
  const url=page+(page.includes('?')?'&':'?')+'_='+Date.now();
  let html=null;
  try{
   const res=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(4500)});
   if(res.ok)html=await res.text();
  }catch(e){}
  if(!html){try{html=await fetchTextViaCorsProxy(url,3500);}catch(e){}}

 }
 async function fetchSongMetadata(){
  if(!wanted||audio.paused||document.hidden)return;

  if(!mount&&!officialPlaylistPages[station]){showSong('');return;}

   song=await fetchOfficialMetadata(station);
  }else{
   const url='https://stream.funradio.sk/status-json.xsl?_='+Date.now();
   let data=null;
   try{
    const response=await fetch(url,{signal:AbortSignal.timeout(5000),cache:'no-store'});

   }catch(e){}
   if(!data){try{const raw=await fetchTextViaCorsProxy(url,4500);if(raw)data=JSON.parse(raw);}catch(e){}}
   song=data?getMountSong(data,mount):'';
  }

  else if(++metadataMisses>=2){showSong('');}
 }
 // Aktualizácia každých 5 sekúnd; obnova aj po návrate na kartu.
 setInterval(fetchSongMetadata,5000);

 const stored=read('dashboardRadioVolume');vol.value=stored!==null&&Number.isFinite(+stored)?Math.max(0,Math.min(100,+stored)):60;
 function volume(){audio.volume=+vol.value/100;$('radioVolumeLabel').textContent=vol.value+' %';save('dashboardRadioVolume',vol.value)}volume();
 function controls(){play.textContent=wanted?'■':'▶';play.setAttribute('aria-label',wanted?'Zastaviť rádio':'Spustiť rádio');}
 function selection(){$('radioWebsite').textContent='Web rádia ↗';[...$('radioStations').children].forEach((b,i)=>b.setAttribute('aria-pressed',String(stations[i]===selected)));$('radioWebsite').hidden=!selected[2];if(selected[2])$('radioWebsite').href=selected[2];}

  if(schedule.checked&&!inWindow()){stop();status.textContent='Čakám na 7:00 • pre ručné hranie vypni automatický čas.';return;}

 }
 stations.forEach(s=>{const b=document.createElement('button');b.type='button';b.textContent=s[0];b.title=(s[3]||128)+' kb/s MP3';b.onclick=()=>{selected=s;save('dashboardRadioStation',s[0]);selection();start();};$('radioStations').appendChild(b)});
 selection();status.textContent=selected[0]+' • pripravené na prehrávanie';
 play.onclick=()=>{if(wanted){stop();status.textContent=selected[0]+' • zastavené';}else start();};
 vol.oninput=volume;
 $('radioMute').onclick=()=>{audio.muted=!audio.muted;$('radioMute').textContent=audio.muted?'🔇':'🔊';$('radioMute').setAttribute('aria-label',audio.muted?'Zapnúť zvuk':'Stlmiť zvuk');};
 // Schedule relative to playback start (not the next clock-hour).
 function updateRotation(){

  if(!wanted||!nextSwitchAt){rotationStatus.textContent=schedule.checked?'Denne 7:00–17:00 • náhodne bez opakovania':'Spusti rádio • prepnutie po 60 minútach.';rotationStatus.title=rotationStatus.textContent;return;}

  checkSchedule();

   save('dashboardRadioStation',selected[0]);selection();start();

})();

    const soon=p.days===0 || (hoursUntil>=0 && hoursUntil<=23);
    return `<div class="birthdayCard ${soon?'isSoon':''} ${p.days===0?'isToday':''}">`
      + `<div class="birthdayLeft"><div class="birthdayPerson">${escapeHolidayText(shortName)}</div><div class="birthdayDate">${dateLabel}</div></div>`
      + `<div class="birthdayCountdown">${remaining}</div>`
      + `</div>`;
  }).join('');
  if(typeof positionLeaveBox==='function')positionLeaveBox();
}
renderBirthdays();
setInterval(renderBirthdays,60*60000);

// Celý zoznam narodenín po kliknutí na nadpis; bežný panel ukazuje tri najbližšie.
function openAllBirthdays(){
  let overlay=document.getElementById('birthdayAllOverlay');
  if(!overlay){
    overlay=document.createElement('div');
    overlay.id='birthdayAllOverlay';
    overlay.innerHTML='<div id="birthdayAllDialog" role="dialog" aria-modal="true" aria-labelledby="birthdayAllDialogHeader"><div id="birthdayAllDialogHeader"><span>Všetky narodeniny</span><button type="button" id="birthdayAllClose" aria-label="Zavrieť zoznam" onclick="closeAllBirthdays()">×</button></div><div id="birthdayAllList"></div></div>';
    overlay.addEventListener('click',e=>{if(e.target===overlay)closeAllBirthdays();});
    document.getElementById('stage').appendChild(overlay);
  }
  const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const y=today.getFullYear();
  const rows=birthdayPeople.map(p=>{
    const parts=p.birth.split('-').map(Number);
    let next=new Date(y,parts[1]-1,parts[2]);
    if(next<today)next=new Date(y+1,parts[1]-1,parts[2]);
    const days=Math.round((Date.UTC(next.getFullYear(),next.getMonth(),next.getDate())-Date.UTC(y,today.getMonth(),today.getDate()))/86400000);
    const words=p.name.trim().split(/\s+/);
    const name=words.length>1?words.slice(0,-1).join(' ')+' '+words[words.length-1].charAt(0)+'.':p.name;
    const until=(new Date(next.getFullYear(),next.getMonth(),next.getDate(),7).getTime()-now.getTime())/3600000;
    return {name,date:String(parts[2]).padStart(2,'0')+'.'+String(parts[1]).padStart(2,'0')+'.',days,soon:days===0||(until>=0&&until<=23)};
  }).sort((a,b)=>a.days-b.days||a.name.localeCompare(b.name,'sk'));
  document.getElementById('birthdayAllList').innerHTML=rows.map(p=>
    '<div class="birthdayAllItem '+(p.soon?'isSoon':'')+'"><span class="birthdayAllName">'+escapeHolidayText(p.name)+'</span><span class="birthdayAllDate">'+p.date+'</span><span class="birthdayAllCountdown">'+(p.days===0?'Dnes':p.days===1?'Zajtra':'o '+formatDaysSk(p.days))+'</span></div>'
  ).join('');
  overlay.classList.add('isOpen');
  document.getElementById('birthdayAllClose').focus();
}
function closeAllBirthdays(){
  const overlay=document.getElementById('birthdayAllOverlay');
  if(overlay)overlay.classList.remove('isOpen');
  document.getElementById('birthdayAllToggle')?.focus();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape' && document.getElementById('birthdayAllOverlay')?.classList.contains('isOpen'))closeAllBirthdays();});


</script>

<script>
/* Prehľad sviatkov a menín v rovnakom dialógu ako prehľad narodenín. */
let calendarAllActiveType='nameday';
function calendarAllDateLabel(date){
 return ['Ne','Po','Ut','St','Št','Pi','So'][date.getDay()]+' '+String(date.getDate()).padStart(2,'0')+'.'+String(date.getMonth()+1).padStart(2,'0')+'.';
}
function calendarAllDaysUntil(date,today){
 return Math.round((Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())-Date.UTC(today.getFullYear(),today.getMonth(),today.getDate()))/86400000);
}
function calendarAllEntries(type,today){
 const y=today.getFullYear();
 if(type==='nameday'){
  const rows=[];
  // Všetky dni najbližších 12 mesiacov. Použitý rovnaký kalendár getNameday ako v malom paneli.
  const end=new Date(y+1,today.getMonth(),today.getDate());
  for(let cursor=new Date(today);cursor<end;cursor.setDate(cursor.getDate()+1)){
   const d=new Date(cursor);
   const key=isoLocalDate(d);
   const override=namedayOverrides[key];
   const name=(override&&override.name)||getNameday(d);
   if(name)rows.push({date:d,name});
  }
  for(const item of customNamedayData){
   const d=parseCustomHolidayDate(item.date);
   if(d&&d>=today&&d<end)rows.push({date:d,name:item.name});
  }
  return rows.sort((a,b)=>a.date-b.date||a.name.localeCompare(b.name,'sk'));
 }
 const holidaySet=[...holidaysForYear(y),...holidaysForYear(y+1)]
  .map(h=>{const key=isoLocalDate(h.date),isOfficialChristmas=h.date.getMonth()===11&&[24,25,26].includes(h.date.getDate()),edited=isOfficialChristmas?null:holidayOverrides[key];return {date:edited?parseCustomHolidayDate(edited.date):h.date,name:edited?edited.name:h.name};});
 const own=customHolidayData.map(item=>({date:parseCustomHolidayDate(item.date),name:item.name}));
 const end=new Date(y+1,today.getMonth(),today.getDate());
 return [...holidaySet,...own].filter(h=>h.date&&h.date>=today&&h.date<end).sort((a,b)=>a.date-b.date||a.name.localeCompare(b.name,'sk'));
}
function openAllCalendar(type){
 calendarAllActiveType=type==='holiday'?'holiday':'nameday';
 let overlay=document.getElementById('calendarAllOverlay');
 if(!overlay){
  overlay=document.createElement('div');
  overlay.id='calendarAllOverlay';
  overlay.innerHTML='<div id="calendarAllDialog" role="dialog" aria-modal="true" aria-labelledby="calendarAllHeader"><div id="calendarAllHeader"><span id="calendarAllTitle"></span><button type="button" id="calendarAllClose" aria-label="Zavrieť zoznam" onclick="closeAllCalendar()">×</button></div><div id="calendarAllList"></div></div>';
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeAllCalendar();});
  document.getElementById('stage').appendChild(overlay);
 }
 document.getElementById('calendarAllTitle').textContent=calendarAllActiveType==='holiday'?'Všetky nadchádzajúce sviatky':'Všetky nadchádzajúce meniny';
 const today=new Date();today.setHours(0,0,0,0);
 const items=calendarAllEntries(calendarAllActiveType,today);
 document.getElementById('calendarAllList').innerHTML=items.map(p=>{
  const days=calendarAllDaysUntil(p.date,today);
  const label=days===0?'Dnes':days===1?'Zajtra':'o '+formatDaysSk(days);
  return '<div class="calendarAllRow '+(days===0?'isSoon':'')+'"><span>'+calendarAllDateLabel(p.date)+'</span><span class="calendarAllName">'+escapeHolidayText(p.name)+'</span><span class="calendarAllCountdown">'+label+'</span></div>';
 }).join('');
 overlay.classList.add('isOpen');
 document.getElementById('calendarAllList').scrollTop=0;
 document.getElementById('calendarAllClose').focus();
}
function closeAllCalendar(){
 const overlay=document.getElementById('calendarAllOverlay');
 if(overlay)overlay.classList.remove('isOpen');
 document.getElementById(calendarAllActiveType==='holiday'?'holidayAllToggle':'namedayAllToggle')?.focus();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('calendarAllOverlay')?.classList.contains('isOpen'))closeAllCalendar();});
</script>

<script>
/* Zoznam všetkých aktuálne načítaných správ, bez zmeny striedania titulkov. */
function openAllNews(){
  let overlay=document.getElementById('allNewsOverlay');
  if(!overlay){
    overlay=document.createElement('div');
    overlay.id='allNewsOverlay';
    overlay.innerHTML='<div id="allNewsDialog" role="dialog" aria-modal="true" aria-labelledby="allNewsHeader"><div id="allNewsHeader"><span id="allNewsHeading">Všetky správy</span><button type="button" id="allNewsClose" aria-label="Zavrieť zoznam" onclick="closeAllNews()">×</button></div><div id="allNewsList"></div></div>';
    overlay.addEventListener('click',e=>{if(e.target===overlay)closeAllNews();});
    document.getElementById('stage').appendChild(overlay);
  }
  const items=fullNewsList();
  document.getElementById('allNewsHeading').textContent='Všetky správy ('+items.length+')';
  const list=document.getElementById('allNewsList');
  list.replaceChildren();
  items.forEach((item,i)=>{
    const link=document.createElement('a');
    link.className='allNewsItem';
    link.href=item.url;
    link.target='_blank';
    link.rel='noopener noreferrer';
    const index=document.createElement('span');index.className='allNewsNumber';index.textContent=String(i+1);
    const topic=document.createElement('span');topic.className='allNewsTopic';topic.textContent=classifyNews(item);
    const title=document.createElement('span');title.className='allNewsTitle';title.textContent=item.title+' · '+item.source;
    link.append(index,topic,title);
    list.appendChild(link);
  });
  if(!items.length) list.textContent='Zatiaľ nie sú načítané žiadne správy.';
  overlay.classList.add('isOpen');
  list.scrollTop=0;
  document.getElementById('allNewsClose').focus();
}
function closeAllNews(){
  document.getElementById('allNewsOverlay')?.classList.remove('isOpen');
  document.getElementById('newsSlideCounter')?.focus();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('allNewsOverlay')?.classList.contains('isOpen'))closeAllNews();});
</script>
